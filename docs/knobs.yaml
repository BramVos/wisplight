# Where every fixed number in the code belongs (M10.20; Bram, 28 September 2026).
# `npm run knobs` writes docs/KNOBS.md from this file and the code; a test fails
# when the code has a number that is not placed here, or this file names one
# the code no longer has.
#
# A number is a top-level constant in src/engine, src/node, src/main or
# src/chronicler whose value is a number, a sum of numbers, or a map of them.
# Each gets one of three places:
#   world: a rule of play that may differ per world. It moves to the content
#          (world.yaml or rules.yaml) with a neutral default. After the colon:
#          the knob's name to be.
#   settings: how the app behaves. It moves to the settings with a default.
#   code: safety or technique. It stays in the code; after the colon: why.
# "(moved)" after the place: it has already moved, and the constant is only
# the default.

# Units of time: the same in every world and every app, never a rule.
units: [DAY, HOUR, WEEK, MINUTES_PER_DAY, MINUTES_PER_HOUR]

numbers:
  src/chronicler/reply.ts:
    MAX_PLAN_EFFECTS: 'code: a bound on what the chronicler may propose in one plan (safety)'
    MAX_STEPS: 'code: a bound on the steps of one plan the chronicler proposes (safety)'
  src/engine/acquaintance.ts:
    YEAR: 'world: calendar.year (follows the shape of the year)'
    KEEP_PLACES: 'code: how many places are kept per person seen (save size)'
  src/engine/agreements.ts:
    KEEP_CLOSED: 'code: closed agreements go to the archive after this (save size)'
  src/engine/aisettings.ts:
    BUDGET_CEILING_USD: 'code: the most an hour may be set to, against a slip of the keyboard (safety)'
    BUDGET_FLOOR_USD: 'code: the least an hour may be set to (safety)'
    BUDGET_CONFIRM_USD: 'code: above this the settings ask once before saving (safety)'
  src/engine/archive.ts:
    ARCHIVE_AFTER: 'code: what is over goes to the archive after this (save size)'
  src/engine/belief.ts:
    RANK: 'code: the order of rejects, doubts and believes, not a number to tune'
  src/engine/checkpoint.ts:
    CHECKPOINT_ENTRIES: 'code: when a save writes a new checkpoint (save size and loading time)'
    CHECKPOINT_MINUTES: 'code: when a save writes a new checkpoint (save size and loading time)'
  src/engine/choice.ts:
    MAX_OPTIONS: 'code: a choice is answered with the keys 1 to 9 (the interface)'
  src/engine/clock.ts:
    DAYS_PER_YEAR: 'world: calendar.days_per_month (the shape of the year; now twelve months of thirty days and five)'
  src/engine/combat/flow.ts:
    POS: 'code: the order of the positions in a fight, not a number to tune'
  src/engine/content.ts:
    PARSED_KEPT: 'code: how many files the loader keeps read, by their text (memory; M10.24)'
  src/engine/chronicler.ts:
    TALKS_PER_LINE: 'code: how many remembered talks a storyline takes to the night round, the newest (M10.30; Bram: bounded, never the whole history)'
  src/engine/nightquest.ts:
    MOST_PEOPLE: 'code: how many people the call that makes a quest in play names, the asker first (M10.30, the size of the call)'
    MOST_PLACES: 'code: how many places it names (M10.30, the size of the call)'
    TALK_DAYS: 'code: the days of talks it reads, since the night round told of them already (M10.30)'
    MADE_DC: 'code: how hard a deed of a quest made in play is, when it asks for a skill (M10.30, like a region''s story)'
  src/engine/said.ts:
    KEPT: 'code: how many lines of what the stranger said the game keeps, for the condition said (M10.30; memory)'
  src/engine/pasttalks.ts:
    EARLIER_LINES: 'code: how many lines of the talk before the talk window shows, faded (M10.29 J, the window)'
    OLD_TALK_GAP: 'code: the minutes between two lines of an old save that still make one talk (M10.29 R, saves from before)'
  src/engine/dialogue/block.ts:
    BLOCK_FLOOR: 'code: the size an area block is filled to, above Haiku''s cache minimum of 4,096 tokens (M10.28, technique)'
  src/engine/dialogue/acts.ts:
    TIER_TOKENS: 'code: the tokens a reply may use follow from its words (technique)'
  src/engine/dialogue/conversation.ts:
    REPLY_WITHIN_MS: 'settings (moved): the reply time the player sets (M10.8); this is its default'
    LINK_RETRY_MS: 'code: after a failed call for want of a connection, how long the rules answer before the talk asks the model again quietly (M10.29 V, safety)'
  src/engine/dialogue/testset.ts:
    TALK_AT: 'code: the moment the trial of a model is played at (a test fixture)'
  src/engine/engine.ts:
    MAX_TALK_LINES: 'code: the lines a talk keeps for its window (memory)'
  src/engine/frames.ts:
    GROWTH: 'code: the growth dial of the frames screen (M10.24) as a factor on the world''s own growth knobs; the knobs themselves are the world''s'
  src/engine/growth/growth.ts:
    SEASON: 'world: calendar.season (follows the shape of the year)'
  src/engine/items.ts:
    DUIT: 'world (moved): world.yaml money.units (M10.17); kept as the default for a world without coins'
    STUIVER: 'world (moved): world.yaml money.units (M10.17); kept as the default for a world without coins'
    GUILDER: 'world (moved): world.yaml money.units (M10.17); kept as the default for a world without coins'
  src/engine/growth/expansion.ts:
    KM_PER_DAY: 'code: the pace a far place''s road is laid out at, as in far.ts, so a charted place lies as far as the days it names'
  src/engine/growth/districts.ts:
    MOST_PLACES: 'code: a bound on what one district call may add, so the call stays small (cost)'
    MOST_PEOPLE: 'code: a bound on what one district call may add, so the call stays small (cost)'
    MOST_SEATS: 'code: a bound on the seats of factions one district may hold (a town brings no new factions, and few new seats)'
  src/engine/growth/regionstory.ts:
    MOST_STAGES: 'code: a bound on the stages of a region''s quest (the roadmap: two or three), so the call stays small'
    MOST_WATCHERS: 'code: a bound on the watchers a story round may add (the roadmap: two)'
    STORY_DC: 'code: how hard a deed of a region''s quest is when it asks for a skill; an ordinary task'
  src/engine/growth/weave.ts:
    MOST_BONDS: 'code: a bound on what one weave round may add (safety of the world: a few believable ties, not a web)'
    MOST_SECRETS: 'code: a bound on what one weave round may add (the roadmap: at most two secrets)'
    MOST_KNOWN: 'code: the people shown to the chronicler in a weave round, so the call stays small (cost)'
  src/engine/lod.ts:
    FULL_KM: 'code: how near the simulation counts every minute (speed)'
    NEAR_KM: 'code: how near a note on the map becomes a person again (speed)'
    COARSE_EVERY: 'code: how often a far person thinks (speed)'
  src/engine/map/palette.ts:
    MAX_SIGNS: 'code: the map keeps the sign of a hex in three bits (the format)'
  src/engine/map/regiondraft.ts:
    KM_PER_MINUTE: 'code: the pace of the map (a hex of 250 m in four minutes, as minutesFor walks it), so the first map keeps the minutes of the exits'
    HEX_KM: 'code: the hex of a first map; the region file holds its own (hex:), which the designer may change'
    MARGIN_KM: 'code: open land around the places of a first map; the designer changes the size in the region file'
    MIN_SIZE_KM: 'code: the least a first map measures; the designer changes the size in the region file'
    DISAGREE: 'code: when the first map tells the designer that an exit and the map part ways (a note, not a rule)'
    FINE_UP_TO_KM: 'code: when a first map is drawn a hex a character; the region file holds its own (zone:)'
  src/engine/news.ts:
    CHECKS_PER_HOUR: 'code: how often news is passed on in an hour (the grain of the simulation)'
    CONTACTS: 'code: how many others a teller meets in a crowd each quarter of an hour (speed)'
  src/engine/npc/brain.ts:
    MAX_STEPS_PER_TURN: 'code: a bound on one plan of a brain (safety)'
    MAX_REPLANS: 'code: a bound on replanning in one turn (safety)'
  src/engine/npc/execute.ts:
    RECENT: 'code: the steps a person remembers having taken (memory)'
  src/engine/npc/planner.ts:
    MAX_DEPTH: 'code: a bound on the depth of a plan (speed)'
    MAX_WAIT: 'code: the longest a plan waits in one step (safety)'
  src/engine/people.ts:
    PRONOUN_INDEX: 'code: an index, not a number to tune'
  src/engine/signals.ts:
    KEEP: 'code: the signals kept in the save (save size)'
  src/engine/sketches.ts:
    SEASON: 'world: calendar.season (follows the shape of the year)'
    MAX_SKETCHES: 'code: the sketches kept in the save (save size)'
  src/engine/stories.ts:
    KEEP_DONE: 'code: the stories kept once done (save size)'
  src/engine/storylines.ts:
    MAX_FACTS: 'code: the facts one storyline takes, so a prompt stays small (cost)'
  src/engine/weather.ts:
    STAY: 'world (moved): world.yaml weather.stay; this is the default'
  src/engine/wishes.ts:
    WISH_CHARS: 'code: the length of one line to the chronicler (M10.24): one sentence or two, so the prompt stays small'
    READ: 'code: how many of the player''s newest lines the chronicler reads at a round (prompt size)'
    KEPT: 'code: how many answers of the chronicler a line keeps (save size)'
  src/engine/world.ts:
    MAX_EVENTS: 'code: the events kept in the save (save size)'
  src/main/index.ts:
    END_LINES: 'code: the lines the end view shows; the whole log is a download (the window)'
  src/node/ai/advisor.ts:
    PASS_SHARE: 'code: what a model must do in its trial to be chosen (FO, chapter 16)'
    LATENCY_MS: 'code: how long a model may take on average in its trial (FO, chapter 16)'
  src/node/ai/gateway.ts:
    TIMEOUT_MS: 'settings (moved): the app knobs brain_timeout_seconds and chronicler_timeout_seconds (the voice follows the reply time the player sets); these are the defaults'
    EDITOR_TIMEOUT_MS: 'settings (moved): the app knob editor_timeout_seconds; this is its default'
    LOW_PRIORITY_SHARE: 'settings (moved): the app knob conversation_share; this is its default'
    FAILURES_BEFORE_COOLDOWN: 'code: three failures and the connection cools down (safety)'
    COOLDOWN_MS: 'code: how long the connection cools down, thirty seconds like the talk (M10.29 V; safety)'
    LOW_TOKENS: 'code: below this the next call would hit the rate limit (technique)'
    UNPRICED_CALLS_PER_HOUR: 'code: a model without a known price is called at most this often an hour (safety of cost)'
  src/node/ai/log.ts:
    KEEP: 'settings (moved): the app knob ai_log_keep; this is its default'
  src/node/ai/frequency.ts:
    GAME_DAYS_PER_HOUR: 'code: game days in an hour of play, measured (M10.27), for the guide price as measured (an estimate, not a rule)'
    GOALS_PER_GAME_DAY: 'code: the goal choices that go to the model in a game day, measured in the simulation (M10.27; tests/m1027goals.test.ts keeps it true)'
  src/node/ai/pricing.ts:
    CALLS_PER_HOUR: 'code: the calls of an hour of play, to estimate what a model costs (an estimate, not a rule)'
  src/node/ai/settings.ts:
    ASK_ABOVE_USD: 'settings (moved): from what cost of one call the game asks first (M10.21); this is its default'
    REPLY_WITHIN_SECONDS: 'settings (moved): the reply time the player sets (M10.8); this is its default'
  src/node/ai/usage.ts:
    KEEP_DAYS: 'code: the days of usage kept (store size)'
    STALE_DAYS: 'code: after this a credit balance is shown as old (technique)'
  src/node/gamelog.ts:
    PART_BYTES: 'code: the size of one part of a log export, so every part opens quickly (technique)'
  src/node/transcript.ts:
    TRANSCRIPT_MAX_BYTES: 'code: past this size a transcript goes on in the next file (technique)'
  src/node/zip.ts:
    LIMIT: 'code: the largest size a zip entry can have (the format)'
