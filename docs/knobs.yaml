# Where every fixed number in the code belongs (M10.20; Bram, 28 September 2026).
# `npm run knobs` writes docs/KNOBS.md from this file and the code; a test fails
# when the code has a number that is not placed here, or this file names one
# the code no longer has.
#
# A number is a top-level constant in src/engine, src/node, src/main or
# src/chronicler whose value is a number, a sum of numbers, or a map of them.
# Each gets one of three places:
#   world: a rule of play that may differ per world. It moves to the content
#          (world.yaml or rules.yaml) with a neutral default. After the colon:
#          the knob's name to be.
#   settings: how the app behaves. It moves to the settings with a default.
#   code: safety or technique. It stays in the code; after the colon: why.
# "(moved)" after the place: it has already moved, and the constant is only
# the default.

# Units of time: the same in every world and every app, never a rule.
units: [DAY, HOUR, WEEK, MINUTES_PER_DAY, MINUTES_PER_HOUR]

