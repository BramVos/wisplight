locations:
  - id: loc_orison_listening_room
    name: Orison Listening Room
    area: orison_ridge
    tags: [landmark, research]
    aliases: [listening room, listening station, the station, control room]
    summary: The failing control room of the old listening station, where the repeating signal is received and recorded.
    sound: { kind: hum, level: 0.4, night: wind }
    improvise:
      domain: lore
      may:
        - { fact: true }
      fallback: You study it for a long while, but without more data it stays a guess.
      takes: false
    description:
      day: |
        Cramped and lined with receiving consoles, half dark and the rest flickering fault codes, this room hums with a rack of recording drives beside a desk where the maintenance logs lie in a damp-swollen binder. Through the wide window the antenna rises into cloud, cables groaning. A speaker gives the same short pattern of tones, then silence. Stairs lead down the steep route to [Ridge Shelter].
      night: |
        Only fault codes and the drive rack's small lights light this room. The antenna outside is a black shape against black sky, its cables groaning in the wind. The logs lie in their binder where they were left. Every few minutes the speaker plays its pattern of tones into the dark, then falls quiet. The stairs lead down to Ridge Shelter.
    arrival:
      text: "Half the consoles are dark and the rest flicker fault codes, and through the window the antenna climbs into cloud. Then the speaker gives its short pattern of tones, and the silence after it, and you understand why nobody here sleeps well."
      far: "High on Orison Ridge the antenna of the listening station stands against the cloud, its cables groaning in the wind."
    exits:
      down: { to: loc_ridge_shelter, minutes: 12, words: [stairs, steps, steep route] }
      # A secret way (M10.31): not in the exits or on the plan until the hatch is found; OPEN THE HATCH or CLIMB DOWN THE
      # LADDER takes it (M10.33).
      in: { to: loc_orison_cable_gallery, minutes: 2, hidden: true, words: [hatch, ladder] }
    hidden:
      # SEARCH may find it by a roll; SEARCH BEHIND THE CONSOLES finds it at once.
      - id: console_hatch
        dc: 12
        text: Behind the last console, where the bundled cables drop through the floor, a square hatch lies flush with the plating, its handle folded flat. It lifts on a stiff hinge, and a ladder goes down into warm, humming dark.
        exit: in
        words: [hatch, behind the consoles, behind the console, behind consoles, where the cables go, floor]
        verbs: [lift]
        helps: The cables behind the last console drop through the floor somewhere. A closer look behind the consoles might show where.
      # Found only by someone who heard of the cairn (M10.30), never by a plain search.
      - id: survey_cache
        text: By the antenna footing a low cairn of flat stones stands where you were told it would. Under the top stone, the one with the pale painted arrow, a sealed tin holds a field lamp, still dry, and a card with the first survey crew's names in faded pencil.
        item: field_lamp
        when: [{ knows: the_survey_cairn }]
        words: [cairn, survey cairn, stone, top stone, cache]
        verbs: [lift, move]
    details:
      - words: [consoles, receiving consoles, console, fault codes]
        look: Old receiving consoles with worn keys and cracked screens. The live ones scroll fault codes that repeat, stop and begin again. Behind the last one, a thick bundle of cables drops out of sight through the floor.
        take: The consoles are built into the room.
        verbs:
          read: The fault codes point to power drops and missing frames in the recording. Most seem to start on the same day, some weeks ago.
      - words: [rack, drives, recording drives, recordings, original recordings]
        look: A tall rack of recording drives, each with a small status light. Several lights are amber and one is dark, and a handwritten tag on the rack reads ORIGINALS. DO NOT OVERWRITE.
        take: The drives are clamped into the rack, and pulling one while it is running might destroy exactly what you came to recover.
        # COPY THE ORIGINAL RECORDINGS is typed on the rack (M10.33 AA).
        verbs:
          copy: The console will not release the originals without the access sequence, and you do not have it.
      - { words: [desk], look: "A metal desk with a cold mug, a pen on a string and the binder of logs." }
      - words: [binder, logs, maintenance logs, log]
        look: A thick binder of printed and handwritten maintenance logs, its pages curled with damp.
        take: The logs are evidence of what happened here, and they belong in the station until you know what they show.
        verbs:
          read: The entries are dated and signed, in several hands. The last few are brief and hurried, and at least one page has been torn out close to the spine.
      - words: [window, wide window]
        look: A wide window of thick, salt-streaked glass, cold to the touch, looking up at the antenna.
      - words: [antenna, antenna structure, cables, dish]
        look: A lattice mast and dish rising into the low cloud, held by humming guy cables. One cable hangs slacker than the others.
      - words: [speaker, tones, signal, pattern]
        look: A small grey speaker above the consoles. The tones come in the same order each time, short and even, from somewhere no one has been. What they mean, if they mean anything, is what you are here to find out.
        take: The speaker is screwed to the wall, and the signal is in the drives, not in the speaker.
        verbs:
          listen: You wait, and the tones come again, just as before. Hearing them once more tells you nothing new, but it is hard not to listen.
      - words: [stairs]
        look: Steel stairs leading down through a hatch to the steep route to the Ridge Shelter.

  # Under the listening room (M10.31): reached only by the hatch behind the consoles, once found.
  - id: loc_orison_cable_gallery
    name: Cable Gallery
    area: orison_ridge
    tags: [research]
    aliases: [cable gallery, gallery, cable run, crawlspace, under the floor]
    summary: A low service gallery under the listening room, where the antenna feed comes down into the station.
    sound: { kind: hum, level: 0.5 }
    description:
      day: |
        You crouch in a low gallery under the station floor, where bundled cables run in trays along both walls. The air is warm and dry and smells of hot dust. Junction boxes stand open along the run, lights ticking green and amber, and a feed line as thick as your wrist comes down from the antenna through a collar overhead. The ladder climbs back to the [Orison Listening Room].
    arrival:
      text: "The ladder brings you down into warm, humming dark under the floor. Cables run away from you in their trays, and somewhere along them a relay clicks, waits, and clicks again."
    exits:
      out: { to: loc_orison_listening_room, minutes: 2, words: [ladder, hatch] }
    details:
      - words: [cables, trays, cable trays, bundles]
        look: Cables of every thickness, tied into bundles and laid in steel trays, some labelled with tags gone brown with age.
        take: They are live, tied down, and part of the station.
      - words: [junction boxes, junction box, boxes, lights]
        look: "Grey junction boxes with their lids hanging open, each marked in pen: RX 1, RX 2, ARCHIVE, FEED. Their small lights tick green, then amber, then green again."
      - words: [feed, feed line, collar, splice, tape, newer cable]
        look: The antenna feed drops through its sealed collar and runs along the tray towards the consoles above. Just below the collar a short length of newer cable has been spliced into it, wrapped in bright tape, and it runs up out of sight towards a service panel behind the consoles.
        take: Cutting into a live feed would be the quickest way to lose what you came for.
        verbs:
          touch: The newer cable is warm, much warmer than the old feed beside it.
          trace: The feed runs along its tray towards the consoles above, and the newer cable spliced into it runs with it, out of sight.
          follow: The feed runs along its tray towards the consoles above, and the newer cable spliced into it runs with it, out of sight.
      - words: [ladder, hatch]
        look: A steel ladder up to the square hatch behind the consoles, and the flicker of the fault codes above it.
