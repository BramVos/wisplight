locations:
  - id: loc_arrival_lock
    name: Arrival Lock
    area: port_vesper
    tags: [public, landmark]
    aliases: [lock, airlock, arrival airlock, arrivals, landing pad, the pad]
    summary: The arrival airlock of Port Vesper, where newcomers and cargo come in off the landing pad.
    description:
      day: |
        Steel walls drip from the pumps, and seawater pools in the grooves of the floor grating. Crates from the supply ship line one wall, each label stamped [Harrow Station]. The cold tastes of salt and oil; a pressure pump thuds behind the panels. By the inner door, a desk scanner reads assignments and your terminal chirps, taking the local map. A corridor leads east, a cargo passage northeast.
      night: |
        Only an amber strip above the inner door lights the lock, and water gleams in the grooves of the floor grating. The crates stand dark along one wall, their labels unreadable. The pressure pump ticks as it cools, and the cold smells of salt and oil. The unmanned desk's scanner shows a single green light. The corridor leads east towards the [Commons]; the cargo passage runs northeast.
    arrival:
      text: "The inner door of the lock opens on steel, seawater and the thud of pumps, and for the first time in months the floor under you does not move. Every crate against the wall came the same long way you did, from Harrow Station."
    exits:
      # The threshold (M10.33, Bram): a short corridor before the Commons.
      east: { to: loc_lock_corridor, minutes: 1 }
      northeast: { to: loc_workshop, minutes: 4 }
    details:
      - words: [wall, walls, steel walls, pumps]
        look: Bare steel, beaded with water from the last pressure cycle, with a painted line at shoulder height that reads PRESSURE ZONE.
      - words: [floor, grating, floor grating, water, seawater, wet floor]
        look: Steel grating over a drain channel. Seawater from the pad has run in with the cargo and lies in the grooves, and the soles of your boots squeak on it.
        take: You would need a bucket, and the drain will have it soon enough anyway.
      - words: [crates, cargo crates, cargo, crate]
        look: Grey composite crates, strapped in pairs and sealed with tamper tape. Some are marked MEDICAL, some FILTERS, and a few simply RESERVED.
        take: The crates are sealed and signed for, and none of them is yours.
        verbs: { open: "The tamper tape is intact, and breaking it on your first morning here would not make you friends." }
      - words: [label, labels, cargo label, cargo labels]
        look: Printed labels from Harrow Station with a consignment number, a weight and a destination code. Most read PORT VESPER / STORES; two read VESPER WORKS / HANGAR.
        take: The labels are fused to the crates, and peeling one off would only get you questions.
        verbs:
          read: Most of the labels read PORT VESPER / STORES. Two, on the heaviest crates, read VESPER WORKS / HANGAR, with a clearance stamp you do not recognise.
      - words: [pump, pressure pump, panels]
        look: You cannot see the pump itself, only the grille where the panels meet, but you feel each thud through the soles of your feet.
        take: It is bolted somewhere behind the wall, and it keeps the air in.
      - words: [desk, check-in desk, counter]
        look: A narrow desk of scuffed composite by the inner door, with a tablet stand, a coffee ring and a clip of printed arrival forms.
        take: The desk is bolted to the deck.
      # The manifests a story sends the stranger to compare (M10.33 AE: "there is no manifest there").
      - words: [manifests, manifest, cargo manifests, tablet, tablet stand]
        look: A scuffed tablet in the stand on the desk, holding the cargo manifests of every supply run, crate by crate and line by line.
        take: It is the port's record, and it stays at the desk. You can read it here.
        verbs:
          read: "Supply run after supply run: food, filters, seals, cable. Most lines are plain. A few near the end have been corrected by hand, and the corrections are initialled."
          compare: You set run beside run. They agree line for line, but for a few near the end, corrected by hand and initialled.
      - words: [scanner, assignment scanner, reader]
        look: A palm-sized reader on a flexible arm. Its small screen asks for an assignment code or a contract chip.
        take: It is cabled to the desk, and someone would miss it at once.
        verbs:
          use: The scanner reads your contract and shows it on its little screen, with the word PENDING beside it. It is waiting for someone to confirm it.
      - words: [terminal, pocket terminal, map, local map]
        look: Your own pocket terminal, scuffed from the voyage. It now holds a basic map of Port Vesper with its workshops, and a dotted coastal route to Orison Ridge.
        verbs:
          read: The map is plain but clear. East, through a short corridor, is the Commons; northeast are the workshops, and from the Commons an outside door gives onto the coastal path to Orison Ridge.
      - words: [inner door, door]
        look: A heavy pressure door, now standing open, its seals slick with condensation.
      - words: [corridor, covered corridor]
        look: A short, ribbed corridor with a handrail, running east towards the sound of voices.
      - words: [cargo passage, passage]
        look: A wider passage with scuffed floor tracks for trolleys, running northeast towards the Works.

  # The threshold between the lock and the Commons (M10.33 M, Bram, 1 October 2026).
  - id: loc_lock_corridor
    name: Lock Corridor
    area: port_vesper
    tags: [public]
    aliases: [corridor, the corridor, lock corridor]
    summary: The short corridor between the Arrival Lock and the Commons, where coats are hung and boots left to drip.
    sound: { kind: hum, level: 0.3 }
    description:
      day: |
        A short corridor of ribbed steel runs from the lock towards the Commons, its floor still wet from boots coming in. Along one wall, coat hooks hang over a boot rack, under a board of safety notices. The air warms as you go east, and it smells of soup and strong tea. Behind you is the [Arrival Lock]; ahead, the [Commons] is loud with voices.
      night: |
        One strip lamp lights the corridor, and the coats on their hooks hang like people waiting. The boot rack drips onto the grating. Warmth and the last smell of tea come from the Commons to the east; the lock is behind you to the west.
    exits:
      west: { to: loc_arrival_lock, minutes: 1 }
      east: { to: loc_commons, minutes: 2 }
    details:
      - words: [hooks, coat hooks, coats]
        look: A row of coat hooks, most of them hung with weatherproof coats still beaded from the pad.
        take: The coats belong to people who will want them in the morning.
      - words: [boot rack, rack, boots]
        look: A wire rack of boots left to drip, salt drying white on their seams.
      - words: [board, notices, safety notices]
        look: A board of safety notices about pressure doors, storm warnings and the weather cutoff for the coast path.
        verbs:
          read: "PRESSURE DOORS CLOSE ON THEIR OWN. STORM WARNING MEANS NOBODY ON THE COAST PATH. SIGN OUT AT THE COMMONS BEFORE YOU GO TO THE RIDGE."

  - id: loc_commons
    name: Commons
    area: port_vesper
    tags: [public, social]
    aliases: [the Commons, dining hall, mess, canteen]
    summary: The shared dining hall and meeting place of Port Vesper.
    sound: { kind: crowd, level: 0.5, night: hum }
    description:
      day: |
        Bolted tables and benches fill a long, low hall, warm and loud with trays. The smell of soup and strong tea hangs under the ceiling ducts. By the serving hatch a shift roster and a board of arrival notices are patched with handwritten corrections. The far window looks out on grey swell and black rock. A heavy outside door opens onto the coast; a connection runs northwest to the workshops.
      night: |
        Half the lights are out, the tables wiped and empty, and the ducts breathe a low, steady hum. A lamp over the serving hatch still lights the shift roster and the notice board beside it. The window shows only black, port beacons blinking in the glass. You smell cold tea and disinfectant. The outside door to the coast and the connection northwest stand as by day.
    arrival:
      text: "The Commons is the first warm room you have stood in on Nacre: bolted benches, the smell of soup and strong tea, and a board of arrival notices patched by hand. A few heads turn to see who has come in off the supply ship."
    exits:
      north: { to: loc_guest_quarters, minutes: 2 }
      south: { to: loc_medical_bay, minutes: 2 }
      northwest: { to: loc_workshop, minutes: 5 }
      out: { to: loc_coastal_service_path, minutes: 4 }
      west: { to: loc_lock_corridor, minutes: 2 }
    details:
      - words: [tables, benches, table, bench]
        look: Long composite tables and benches bolted to the deck in rows, their surfaces scratched with years of initials and tally marks.
        take: They are bolted down, like almost everything here.
      - words: [serving hatch, hatch]
        look: A steel hatch in the wall, with a counter in front of it and trays stacked at one end.
      - words: [roster, shift roster]
        look: A printed grid of names and shifts, corrected in three different hands. Several names have been moved from the Works to the pad and back again this week.
        take: The roster belongs to everyone here, and taking it would leave the whole port guessing.
        verbs:
          read: The roster gives shifts for the pad, the Works, the medical bay and the kitchen. Someone has pencilled 'RIDGE?' beside an empty slot and then crossed it out.
      - words: [board, notices, arrival notices, notice board]
        look: A cork board thick with notices about the supply ship, filter rations, a lost glove and the next ship due from Harrow Station, some of them weeks out of date.
        take: You leave the notices where people can see them.
        verbs:
          read: The newest notice lists this morning's arrivals, your name among them, and asks new staff to report to the Medical Bay before any field trip.
      # Where the recordings can be shown to the port (M10.33 AA): PLAY THE RECORDINGS is typed on it.
      - words: [screen, wall screen, commons screen]
        look: A scuffed wall screen beside the serving hatch, used for the shift roster, the weather and not much else.
        verbs:
          play: There is nothing on it but the shift roster and tomorrow's weather.
      - words: [window, observation window, glass]
        look: A wide pane of thick glass, scratched at its edges, looking out on the swell and the black rock. At its foot, the deck is worn smooth where people have stood.
        take: It is part of the hull.
        verbs:
          touch: The glass is cold under your palm. Around your hand you see the faint, overlapping marks of many other palms.
      - words: [ducts, ceiling ducts]
        look: Ribbed ducts along the ceiling, breathing warm air that carries every smell from the kitchen.
      - words: [outside door, heavy door]
        look: A heavy door with a small lock cycle of its own and a weather light beside it, now showing amber.
      - words: [connection, covered connection]
        look: A covered passage running northwest to the workshops, with an old sign that still reads VESPER WORKS.
    objects:
      - id: commons_tap
        type: water_tap
        name: water tap
        description: A steel tap over a small basin beside the serving hatch, stencilled POTABLE, with a cup on a chain.
    services:
      - id: commons_hatch
        sells:
          field_ration: { stock: 10, target: 12, price: 600 }
          herbal_tea: { stock: 20, target: 20, price: 50 }
          coffee: { stock: 6, target: 8, price: 150 }
        provider: npc_sana_holt
        hours: 07-20
      - id: breakfast
        sells:
          hot_meal: { stock: 20, target: 20, price: 400 }
        provider: npc_sana_holt
        hours: 07-09
      - id: midday_meal
        sells:
          hot_meal: { stock: 20, target: 20, price: 400 }
        provider: npc_sana_holt
        hours: 12-14
      - id: supper
        sells:
          hot_meal: { stock: 20, target: 20, price: 400 }
        provider: npc_sana_holt
        hours: 18-20

  - id: loc_guest_quarters
    name: Guest Quarters
    area: port_vesper
    tags: [lodging, rest]
    aliases: [quarters, bunks, dormitory, my bunk]
    summary: Shared sleeping quarters for visitors and newly arrived staff.
    sound: quiet
    description:
      day: |
        Narrow bunks stack behind sliding doors, each with a small reading lamp and a curtain. Your own bunk, third on the left, has a lockable cabinet bolted beneath it. The air recycler ticks overhead, and the blankets smell faintly of disinfectant. A slip on the cabinet door says your first three nights are paid for. The door south leads back to the Commons.
      night: |
        Most curtains are drawn, and somewhere behind one someone breathes slowly in sleep. A few reading lamps glow faintly through the fabric. The air recycler ticks overhead, and cold creeps along the floor. Your bunk waits, third on the left, above its cabinet. The door south leads back to the Commons.
    exits:
      south: { to: loc_commons, minutes: 2 }
    details:
      - words: [bunks, bunk, beds, my bunk]
        look: Bunks stacked two high, each behind its own sliding door. Yours has a thin mattress, a folded grey blanket and a pillow that has seen many visitors.
        verbs: { sleep: Lie down when you are ready to rest. The bunk is yours for the nights that are paid. }
      - words: [lamp, reading lamp, lamps]
        look: A small clip lamp with a flexible neck and a dimmer worn smooth by thumbs.
        take: It is wired into the bunk frame.
        verbs: { use: "The lamp clicks on and gives a small, warm circle of light." }
      - words: [curtain, curtains]
        look: A heavy curtain of grey fabric that runs on a rail, the only privacy on offer.
        take: It is riveted to its rail.
        verbs: { close: "You draw the curtain, and the room shrinks to your bunk and the ticking overhead." }
      - words: [cabinet, luggage cabinet, locker]
        look: A steel cabinet bolted beneath your bunk, with a code lock keyed to your contract.
        take: It is bolted to the deck.
        verbs:
          open: The cabinet takes your code and swings open on an empty steel shelf, waiting for whatever you want to keep safe.
      - words: [slip, note, paper slip]
        look: A slip of printed paper, taped to the cabinet door.
        take: You leave the slip where it is. It is proof of your paid nights.
        verbs:
          read: GUEST QUARTERS, BUNK 3L. First three nights paid under contract. Further nights by arrangement with stores.
      - words: [recycler, air recycler]
        look: A grey box in the ceiling with a slotted face, ticking like a slow clock.
      - words: [blankets, blanket]
        look: Thin grey blankets, clean and rough, smelling of disinfectant.
        take: The blankets belong to the quarters. You may use them, but not keep them.
      # The notes a story has the stranger read (M10.33 AE).
      - words: [notes, test notes, tessa's notes, folder]
        look: A folder of test notes on the shelf by Tessa's bunk, pages of pencilled readings in her tight, square hand.
        take: They are Tessa's. Reading them here is one thing; walking off with them is another.
    objects:
      - id: quarters_tap
        type: water_tap
        name: water tap
        description: A small tap and basin by the door, stencilled POTABLE, with a cup on a chain.
    services:
      - { id: guest_bunks, lodging: 1000, provider: npc_mara_venn, hours: 07-22 }

  - id: loc_medical_bay
    name: Medical Bay
    area: port_vesper
    tags: [public, medical]
    aliases: [medical, med bay, infirmary, clinic]
    summary: Port Vesper's treatment room, with its medical supplies and the recovery cradle.
    sound: { kind: quiet }
    description:
      day: |
        Three plastic chairs and a counter face a glass partition just inside the door. Beyond it stand treatment couches, locked cabinets and, under pale light, the long shell of the recovery cradle. Everything smells of antiseptic, and a monitor keeps a soft, even beep. A notice asks visitors to wait and touch nothing past the glass. The door north leads back to the Commons.
      night: |
        Lit low now, the chairs sit empty and the glass partition is a dark mirror. Past it, the recovery cradle rests in its pale pool of light. The monitor beeps on, steady and alone, the antiseptic smell sharper in the stillness. The notice still asks you to wait. The door north leads back to the Commons.
    exits:
      north: { to: loc_commons, minutes: 2 }
    details:
      - words: [chairs, plastic chairs]
        look: Three moulded plastic chairs, one with a crack mended with tape.
        verbs: { sit: You sit and wait. The monitor goes on beeping. }
      - words: [counter, reception]
        look: A low counter with a sign-in tablet and a box of disposable gloves.
      - words: [partition, glass partition, glass]
        look: A clear partition from floor to ceiling, with a sliding door marked STAFF ONLY.
      - words: [couches, treatment couches]
        look: Two padded couches under jointed lamps, their covers smooth and tight.
      - words: [cabinets, supplies, medical supplies, supply cabinets]
        look: Steel cabinets with small windows and code locks. Through the glass you see dressings, ampoules and sealed trays.
        take: The supplies are behind the partition and locked away, and they are not yours to take.
      - words: [cradle, recovery cradle]
        look: A long, closed shell of white composite on a heavy base, with a clear lid and a bank of dark indicators along its side. It is where people are brought back, when they can be.
        take: It weighs more than a supply crate, and it is behind the glass.
      - words: [monitor]
        look: A small screen behind the counter showing a single flat line of status. Nobody is connected just now.
      - words: [notice]
        look: A laminated notice fixed to the partition.
        take: It is glued to the glass.
        verbs:
          read: "PLEASE WAIT TO BE SEEN. Do not pass the partition or handle equipment. New arrivals: implant fitting and briefing before any field trip."
    services:
      - id: medical_supplies
        sells:
          dressing_pack: { stock: 10, target: 10, price: 300 }
          field_medkit: { stock: 3, target: 3, price: 1500 }
        provider: npc_edda_vale
        hours: 08-18

  # The Works, in Port Vesper since M10.33 (one station, one settlement: Bram, 1 October 2026).
  - id: loc_workshop
    name: Workshop
    area: port_vesper
    tags: [public, work]
    aliases: [the workshop, works bay, workbench]
    summary: The workshop of Port Vesper, where equipment is repaired, prepared and signed out.
    sound: { kind: workshop, level: 0.7, night: hum }
    improvise:
      domain: craft
      may:
        - { fact: true }
      fallback: You turn it over in your hands, but without the right parts and a steadier bench you get no further than a guess.
      takes: false
    description:
      day: |
        Workbenches, tool racks and crates of salvaged parts crowd this high room under hard white lamps. Solder, cold metal and Nacre's damp hang in the air. At the counter by the door a clipboard lists what may be signed out and what is reserved for the [Peregrine]. The sealed hangar door at the back is stencilled RESTRICTED. Passages run southeast to the Commons and southwest to the Arrival Lock.
      night: |
        A single strip lamp burns over the counter, and the racks throw long shadows across the benches. A soldering iron ticks as it cools, its smell still lingering. The clipboard hangs on its hook, untouched. At the back the hangar door stays sealed, its RESTRICTED stencil catching the light. Passages run southeast to the Commons and southwest to the Arrival Lock.
    exits:
      # The keypad (M10.30): the code, or a hack, or force; Tessa knows the code.
      in:
        to: loc_peregrine_hangar
        minutes: 3
        lock: { word: "7411", word_text: "The keypad blinks green, and the heavy door slides back on its rail with a hiss of air.", dc: 13 }
      southwest: { to: loc_arrival_lock, minutes: 4 }
      southeast: { to: loc_commons, minutes: 5 }
    details:
      - words: [workbenches, benches, workbench]
        look: Steel benches scarred with burns and clamp marks, each with a vice, a magnifier on an arm and a half-finished job under a cloth.
        take: The benches are bolted down, and the jobs on them belong to someone.
      - words: [racks, tool racks, tools]
        look: Pegboards of tools, each hanging inside its own painted outline. Several outlines are empty, and a note says SIGNED OUT.
        take: Every tool here is signed in and out at the counter.
      - words: [crates, parts, salvaged parts, spare parts]
        look: Open crates of connectors, cable ends, circuit boards and seals salvaged from the old mine, sorted by someone patient into labelled bins.
        take: Parts are scarce here, and they go out through the counter or not at all.
      - { words: [lamps, strip lamps], look: Long white strip lamps that buzz faintly and show every scratch. }
      - words: [counter, public counter]
        look: A waist-high counter with a hatch, a sign-out tablet and a tray of labelled tags.
      - words: [clipboard, list, sign-out list]
        look: A battered clipboard on a hook, with a printed list and many handwritten changes.
        take: The clipboard belongs on its hook, where everyone can check it.
        verbs:
          read: The list gives weatherproof suits, rope lines, hand lamps and portable diagnostic kits as available to sign out. Anything with a red dot is reserved for the Peregrine, and there are a great many red dots.
      - words: [hangar door, door, restricted door]
        look: A heavy sliding door with a keypad and the word RESTRICTED stencilled across it in faded yellow.
      - words: [soldering iron, iron]
        look: A soldering iron in its stand, its tip dull grey.
        take: It is wired to the bench and signed to someone else.
    objects:
      - id: electronics_bench
        type: electronics_bench
        name: Electronics Bench
        owner: npc_tessa_rook
        staff: [npc_tessa_rook]
        hours: 08-18
        state: { broken: false }
      - id: fabrication_bench
        type: fabrication_bench
        name: Fabrication Bench
        owner: npc_tessa_rook
        staff: [npc_tessa_rook]
        hours: 08-18
        state: { broken: false }
    services:
      - id: workshop_counter
        sells:
          water_filter: { stock: 2, target: 3, price: 900 }
          seal_ring: { stock: 6, target: 6, price: 400 }
          insulated_wire: { stock: 8, target: 8, price: 150 }
          connector_parts: { stock: 10, target: 10, price: 120 }
          cable_assembly: { stock: 3, target: 4, price: 600 }
        buys: [cable_assembly, bracket, salvaged_cable_sheath]
        provider: npc_tessa_rook
        hours: 08-18
      - id: equipment_issue
        sells:
          field_lamp: { stock: 3, target: 3, price: 3500 }
          battery_cell: { stock: 10, target: 10, price: 400 }
          measurement_cable: { stock: 2, target: 2, price: 900 }
        buys: [measurement_cable, field_lamp]
        provider: npc_tessa_rook
        hours: 09-17

  - id: loc_peregrine_hangar
    name: Peregrine Hangar
    area: port_vesper
    tags: [restricted, landmark]
    aliases: [hangar, the hangar]
    summary: The locked hangar where the experimental ship Peregrine stands under maintenance.
    sound: { kind: hum, level: 0.6 }
    description:
      day: |
        Cold and cavernous, this hangar is filled almost entirely by the ship, its scarred hull resting on landing struts with maintenance panels hanging open. Cables snake to diagnostic carts, and the air hums deep enough to feel in your teeth. A yellow barrier marks off the drive section towards the stern. A boarding ramp climbs to the airlock; the door out leads back to the Workshop.
      night: |
        Dimmed to a few floods, the hangar holds the [Peregrine] as a dark bulk, its open panels glowing faintly from within. The hum is lower now but still felt. The yellow barrier by the drive section shines under the floodlight. The boarding ramp climbs into shadow towards the airlock; the door out leads back to the Workshop.
    arrival:
      text: "The Peregrine fills the hangar almost wall to wall, her scarred hull on its struts and her panels hanging open. The hum of her diagnostics goes into your teeth, and a yellow barrier keeps everyone away from the drive."
      far: "Beyond the Workshop the roof of the hangar rises above the rest of Port Vesper, the one building here big enough to hold a ship."
    exits:
      up: { to: loc_peregrine_common_deck, minutes: 2 }
      out: { to: loc_workshop, minutes: 3 }
    details:
      - words: [ship, peregrine, the peregrine, hull, struts, landing struts]
        look: A compact ship on four heavy struts, its hull pitted and patched. It was built for six people and for a journey no one has made before.
        take: You might as well try to pocket the hangar.
      - words: [panels, maintenance panels]
        look: Hull panels swung open on hinges, showing packed conduits, tagged wiring and several empty sockets with 'AWAITING PART' written beside them.
        take: They are part of the ship.
      - words: [cables, carts, diagnostic carts]
        look: Thick cables running from the panels to wheeled carts, whose screens scroll with numbers you cannot yet read.
        take: Unplugging anything here without leave would be remembered.
      - words: [barrier, yellow barrier, line, painted line, drive section, drive]
        look: A waist-high yellow barrier and a line painted on the deck, closing off the stern. Behind it the hull plating is a different, darker metal, and a sign reads 'DRIVE SECTION. AUTHORISED PERSONNEL ONLY'.
        verbs:
          climb: You put a hand on the barrier and think better of it. Whatever lies beyond is not for someone on their first day.
      - words: [ramp, boarding ramp]
        look: A ribbed metal ramp climbing to the ship's side, with a handrail on one side only.
      - words: [airlock, access airlock]
        look: A small round airlock in the ship's flank, its outer door standing open onto a dim inner chamber.
      - words: [door, workshop door]
        look: The sliding door back to the Workshop, with its keypad on this side too.
      # The crates a story has the stranger carry back (M10.33 AE).
      - words: [crates, stacked crates, stores crates]
        look: A stack of crates against the hangar wall, stencilled with the port's stores marks and taped over with fresh labels in another hand.
        take: They are heavy, and they belong to somebody. Whose is the question.
        # CARRY THE CRATES BACK is typed on them (M10.33 AA).
        verbs:
          carry: They are heavy, and they belong to somebody. Carrying them anywhere wants a reason, and whose they are.

  - id: loc_peregrine_common_deck
    name: Peregrine — Common Deck
    area: port_vesper
    tags: [ship, restricted]
    aliases: [common deck, peregrine deck, briefing room]
    summary: The first open compartment aboard the Peregrine, with its briefing table and cleared expedition data.
    sound: quiet
    description:
      day: |
        Tight and curved, built for six, this deck holds a briefing table bolted down with six strapped chairs around it. A terminal in the table glows with expedition data cleared for the crew. The air is dry and recycled, tasting faintly of new plastic, and the hull ticks now and then as it settles. The airlock leads back down the ramp to the Hangar.
      night: |
        Lit only by the terminal, a pale square among six strapped chairs, the deck is quiet enough to hear your own breathing. The hull ticks in the cold, and the air still tastes of plastic and filters. The airlock leads back down the ramp to the Hangar.
    exits:
      down: { to: loc_peregrine_hangar, minutes: 2 }
    details:
      - words: [table, briefing table]
        look: A low oval table bolted to the deck, with grab handles along its rim and a terminal set into its centre.
        take: It is bolted to the ship.
      - words: [chairs, chair, seats]
        look: Six padded chairs, each strapped to rails in the deck with a harness folded on its seat.
        verbs:
          sit: You sit, and the harness buckle digs into your back. It is a chair for sitting still for a long time.
      - words: [terminal, data, expedition data]
        look: A flat screen set into the table, showing a menu headed CLEARED FOR CREW.
        take: It is set into the table.
        verbs:
          read: The cleared files give crew lists, stores and a mission outline towards a destination marked only 'ECHO NINE (PROVISIONAL)'. Every section on the drive is marked RESTRICTED.
