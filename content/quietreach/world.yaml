  pictures:
    style: "Painted science-fiction concept art with a documentary feel: matte surfaces, fine brush texture, believable materials and restrained colours. Technology looks maintained, repaired and sometimes used for too long, with repaired seams, faded labels, scratches and personal belongings. Outdoors the light is cool: overcast skies, wet black rock, grey swell and sea mist. Indoors the light is warm: workbenches, the dining hall and inhabited cabins. Portraits show head and upper body in natural light against a quiet background. People vary in age, build, skin colour and appearance, and their origins show in clothing, habits and personal objects rather than in a fixed look. They wear practical workwear, repaired raincoats, medical wrap coats and safety vests, never tight uniform space suits. Each important character keeps the same identifying features in every image, and mood changes posture and expression, not the face. Places are shown at human scale from where a person could stand, with low buildings against a vast, cold landscape, vulnerable but inhabited. No neon, no holograms, no glowing interfaces beyond plain screen light. The picture shows exactly the state the text describes: damage stays damaged, empty rooms stay empty, and no doors, objects, weapons or clues are added that the world does not hold. Nothing alien, and nothing of Echo Nine, is shown unless the player has discovered it. The impression is of a cold, distant place where people have struggled to make something warm and habitable."
    # The editor makes the pictures of what is new after the steps (M10.26); in a game the player's switch decides.
    wanted: true
