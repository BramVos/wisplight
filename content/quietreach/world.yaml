    lines:
      clear:
        day: The cloud breaks open, and for once you can see far along the black coast to the grey line of the sea.
        night: The sky is clear and bitterly cold, the stars hard and many, and the swell mutters below the rocks.
      overcast:
        day: Low cloud lies flat over the coast, and the top of Orison Ridge is lost in it.
        night: No star shows through the cloud; only the lamps of the port hold back the dark.
      rain:
        day: A thin, steady rain comes in off the sea and beads on every hull and visor.
        night: Rain ticks on metal in the dark, steady and patient.
      fog:
        day: Sea mist rolls in over the rocks, and the pad lights turn to soft blurs a few metres off.
        night: The mist is so thick tonight that the beacons seem to float, fastened to nothing.
      storm:
        day: A storm front drives in from the sea; the wind shoves at you, and spray bursts white over the black rock.
        night: The storm howls through the dark, antenna stays shriek, and the swell booms against the shore.
      frost:
        day: Frost whitens the deck plates and railings, and your breath hangs in the still, cold air.
        night: The cold bites hard tonight, and ice creeps along the door seals.
      snow:
        day: Wet snow and hail slant in off the sea, clotting on the rails and clogging the hatch seals.
        night: Snow falls heavily in the dark, and the lamps light only the nearest flakes.
