rules:
  death:
    vision: "The dark gives way to a silent arrival hall. Empty benches stand in rows, and rain runs down frosted glass without a sound. A calm voice reaches you from nowhere in particular, the voice of {guide}: 'Stay with the voice. Your name first. Then where you last remember being.'"
    guide: Morrow
    wake: You wake in the recovery cradle with a dry mouth and hands that will not quite close. The monitor chirps steadily beside you, and the air smells of antiseptic and warm plastic. Time has passed; the log by the cradle says how much, and who answered your implant's distress signal. You are weak, and you will need rest before you are yourself again.
    mark: "What you had with you when you fell stayed where it fell, unless someone has taken it since: {lost}."
    rite_where: While you were under, someone sat by the cradle and spoke your name, where you are, and one memory you share. The Keeping calls it Holding the Name; the doctors call it familiar orientation.
    rite_done: The cradle log notes who stayed beside you and for how long. Someone held your name while you were gone.
    rite_nothing: The cradle log holds only the machines' readings. Nobody sat with you this time.
  patrons:
    - id: the_remembered
      name: The Remembered
      text: The dead whom the living know by name. To the Keeping, a person stays part of the community for as long as others keep their name, their work and their promises; to call on the Remembered is to remember that you carry what they left unfinished.
      sworn: "Companions judge whether you keep faith with the dead and the living: a promise made in someone's name kept, their work finished or handed on, a name spoken and not forgotten. A broken word given by the Remembered weighs heavily with them."

    - id: the_witness
      name: The Witness
      text: A name the Open Sky gives to the supposed presence behind the universe; some of the faithful mean by it only their own conscience. To call on the Witness is to act as if someone is watching how humanity meets what it does not yet understand.
      sworn: "Companions judge whether you meet the unknown with curiosity and restraint: asking an honest question, recording what you saw as you saw it, and not forcing an answer or a door before you understand it. Recklessness, or twisting data to fit a wish, counts against you."

  # Who the stranger came as (M10.29 C): the five specialisms of the frame. Everyone has the same assignment from
  # Dr Sorell; the background says why you were the one sent for. Without classes there are no skills or talents.
  backgrounds:
    - { id: systems_engineer, name: Systems engineer, topics: [second_observation], reason: "You keep old machines alive for a living, and the listening station on Orison Ridge is failing for reasons nobody here can name. Dr Sorell sent for you to find out why before the original recordings are lost.", contact: npc_ilyan_sorell, heard: echo_nine }
    - { id: signal_linguist, name: Signal linguist, knows: [{ who: npc_niko_serrin, how: "you have traded notes on the transmission with him by relay for weeks" }], reason: "You read patterns in noise and language in patterns, and the transmission from beyond the Belt repeats like something meant to be read. Dr Sorell sent for you to recover the recordings and say whether anyone has touched them.", contact: npc_ilyan_sorell, heard: echo_nine }
    - { id: navigator, name: Navigator, topics: [meridian_anchorage], reason: "You plot courses where the charts run out, and someone here wants to go where the signal seems to point. Dr Sorell hired you to check the data and its numbers before anyone trusts a heading to it.", contact: npc_ilyan_sorell, heard: echo_nine }
    - { id: expedition_medic, name: Expedition medic, knows: [{ who: npc_edda_vale, how: "you worked a winter together in the infirmary at Harrow Station" }], reason: "You have kept crews alive far from any hospital, and an expedition from Port Vesper would go farther than anyone has. Dr Sorell wants you to judge who is fit to go, and whether anyone should.", contact: npc_ilyan_sorell, heard: safe_return }
    - { id: expedition_hand, name: Expedition hand, topics: [safe_return], reason: "You have crossed ice, rock and vacuum for people who paid well and asked little, and you came back every time. Dr Sorell hired you for what the work up on the ridge will ask of whoever goes.", contact: npc_ilyan_sorell, heard: echo_nine }
