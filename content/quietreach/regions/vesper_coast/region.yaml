regions:
  - id: vesper_coast
    name: Vesper Coast
    area: vesper_coast
    origin: [0, 0]
    size: [4.5, 5]
    hex: 0.25
    seed: 8216
    legend: { "#": volcanic, "%": highland, "&": ocean, "*": shallows, +: scrub, "-": beds, ":": road, ",": path }
    lands:
      volcanic: { like: heath, text: "Black basalt runs underfoot, wet and ridged, with nothing to break the wind." }
      highland: { like: heath, text: "The high rock is bare and cold, and the cloud sits low enough to touch." }
      ocean: { like: water, text: "Grey swell rolls in from the open sea, and the cold comes off it in waves." }
      shallows:
        like: fen
        text: The tidal shallows suck at your boots, and the water hisses as it moves between the rocks.
      scrub:
        like: woods
        text: Low, dark coastal scrub clings to the rock, wet and springy, and it hides the ground.
      beds:
        like: fields
        text: Controlled growing beds lie in tidy rows under patched covers, and the soil smells of salt.
    zone: [0.25, 0.25]
