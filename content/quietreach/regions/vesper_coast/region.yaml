    paths:
      - kind: path
        name: the path to the Coastal Traverse
        via:
          - [1.63, 1.73]
          - [2.07, 1.73]
        text: The maintenance track leaves the port between marker posts, and their reflectors are faded and scratched.
      - kind: path
        name: the path to Ridge Shelter
        via:
          - [2.07, 1.73]
          - [2.87, 2.52]
        text: The coastal path climbs over wet basalt, and the sea mutters somewhere below you in the mist.
      - kind: path
        name: the path to Orison Ridge
        via:
          - [2.87, 2.52]
          - [2.87, 3.27]
        text: The last stretch to the ridge is steep and bare, and the antenna shows and vanishes in the cloud.
    beyond:
      - side: west
        text: The open sea runs west to the horizon, grey and empty, and no boat of the coast goes out that far.
      - side: north
        text: North, the coast goes on as black rock and swell, and the official map marks nothing there but old survey lines.
      - side: east
        text: East lies the abandoned mining ground, broken and unfenced, and the map there is years out of date.
      - side: south
        text: South, the high rock falls away into cloud, and nobody at Port Vesper has walked beyond it lately.
