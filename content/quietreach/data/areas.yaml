areas:
  - id: port_vesper
    name: Port Vesper
    kind: village
    aliases: [Vesper, the port, the settlement, the Works, the workshops, Vesper Works]
    # One station, one settlement (M10.33 L, Bram, 1 October 2026): the Works went up in the port.
    summary: "A compact colony of connected pressure modules with shared facilities: the landing pad, the Commons, the guest quarters and the medical bay, and beside them the workshop and the locked hangar of the Peregrine."
    fame: 2
    sound: { kind: hum, level: 0.4 }
    pos: [1.63, 1.73]

  - id: coastal_traverse
    name: The Coastal Traverse
    kind: route
    aliases: [the Traverse, the coast path, the service route]
    summary: An exposed maintenance route along the black coast between Port Vesper and Orison Ridge.
    fame: 1
    sound: { kind: wind, level: 0.7 }
    pos: [2.07, 1.73]

  - id: orison_ridge
    name: Orison Ridge
    kind: wilderness
    aliases: [the Ridge, Orison, the listening station]
    summary: A bare volcanic ridge above the coast, where an abandoned listening station has been receiving a repeating transmission for weeks.
    fame: 2
    sound: { kind: wind, level: 0.8 }
    barred:
      - when:
          - { weather: storm }
        text: The wind on the climb tears at you hard enough to pull you off the rock, and the steps are running with water. This is not a climb to make in a storm. The Ridge Shelter is the place to wait it out, or the path back to Port Vesper.
    pos: [2.87, 3.27]

  - id: vesper_coast
    name: Vesper Coast
    kind: wilderness
    summary: The open land between the places of Vesper Coast.
    pos: [2.25, 2.5]
