crafts:
  - id: field_electronics
    name: Field Electronics
    maker: field technician
    skill: electronics
    professions: [chief_engineer, field_mechanic, signal_technician]
    techniques:
      - { id: diagnosis, name: "Diagnosis: recognising damage, cleaning contacts, checking connections" }
      - { id: cable_repair, name: Cable and connector repair }
      - { id: fault_finding, name: Fault finding in linked systems }
      - { id: repair_design, name: "Designing, testing and documenting a difficult repair" }
    masterwork: A repair designed, tested and written up so clearly that another technician could repeat it from the notes alone, months from any help.
    practice: [3, 8, 15]
    per_day: 3
    # After three failed tries in a row the bench rests (M10.29, crafts.fail_cooldown in world.yaml).
    cooldown_text: The soldering iron has overheated and the test lamp flickers. Let the bench cool before you try again.
    failure:
      outcome: lost
      why: The material went into a repair that did not hold. Slow down, and test before you trust it.
