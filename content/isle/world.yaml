# Skerrow (M8): a second, very small world beside the Nethermarch, to show that
# the game keeps more than one world. High fantasy: a rocky island in the Glass
# Sea, four hundred years after the Starfall. You wash up from a wreck and have
# to find a way off before the winter storms close the sea.
#
# Since M9.1 it has rules of its own (rules/): the island's peoples, callings,
# patrons and beasts, on the Nethermarch's numbers. Everything else (people,
# schedules, knowledge, quests, the chronicler) works as in the Nethermarch.

world:
  id: skerrow
  name: Skerrow
  start:
    location: loc_skerrow_wreck_strand
    year: 412
    month: 9      # Leaffall
    day: 3
    hour: 7
    minute: 10
  player:
    money: 35     # 3 sp 5 cp: what the sea left you
    inventory:
      knife: 1
      ship_biscuit: 2
  # The names the game's own texts use for this world.
  words:
    land: the Sundered Isles
    region: Skerrow
    from: the sea
    # How a night's sleep reads on the island (M10.17).
    sleep:
      room: You sleep in a box bed at the Salt Kettle, under a blanket that smells of salt and smoke.
      home: You sleep in your own box bed, with the sea loud outside the shutters.
      rough: You sleep in the lee of a rock, and the wind finds you anyway. The cold gets into your bones.
  # Faiths (M9.1): the islanders keep to the Tidemother; the old ones still watch the Old Stars.
  faiths:
    # Each faith swears by its own (M10.8): the oaths are in the voice kit, data/voice.yaml (M10.10).
    # With the faction that stands for each (M10.17): a wedding at the grove raises the Tidemother's faithful.
    - { id: tidemother, name: the Tidemother, patrons: [tidemother], faction: tidemother_faithful }
    - { id: old_stars, name: the Old Stars, patrons: [old_stars], faction: star_sailors }
  law:
    where: on Skerrow
    officer: headwoman
    npc: npc_maren
    office: loc_skerrow_salt_kettle
    # What the headwoman fines, in copper pieces (M10.17): the island is poor, and so are its fines.
    # A death is not paid for on Skerrow (M10.20): the island gathers and hears it.
    fines: { murder: hearing, assault: 300, least: 20 }
    hearing:
      hours: 24
      held: The headwoman has you shut in the salt store with the door barred, and a boy sits outside it all night with a gaff across his knees.
      heard: In the morning the island gathers on the shingle, every household that can walk, and the headwoman asks what happened. They hear you and they hear the dead one's kin, and at the end they let you go, because the sea will judge you in its own time.
  # Standing on the island (M10.17): the lightkeeper's household stands a step higher.
  standing:
    names: [poor, plain folk, respected, well-found, notable]
    offices: [lightkeeper]
  calendar:
    era: SF
    months: [Deepwinter, Thawmoon, Seedtide, Blossom, Brightsun, Midsummer, Highsun, Harvest, Leaffall, Mistmoon, Frostwane, Longnight, Starfall Days]
    weekdays: [Moonday, Tidesday, Windsday, Thornsday, Fireday, Starday, Restday]
    start_weekday: Windsday
  # Names for people a game makes (M10.9): someone spoken of who becomes a person, the people of a far place.
  names:
    she: [Kerra, Morwen, Lowena, Senara, Jenna, Tressa, Ebrel, Ysolt, Rosen, Demelza]
    he: [Jory, Kenan, Treve, Madoc, Petroc, Hedyn, Talan, Bryok, Denzel, Kitto]
    family: [Penrose, Trevail, Nance, Polglase, Carne, Rowe, Tregear, Hocking, Jago, Pascoe]
  # People a speaker may name who are not in the world yet (M10.9): what they are to the speaker, and in which talks.
  sketch:
    domains: your family, your trade, the sea or your past
    bonds: { cousin: kin, aunt: kin, uncle: kin, old shipmate: friend, old skipper: employer, old teacher: teacher, trading partner: acquaintance, old friend: friend, debtor: debtor, creditor: creditor }
  # Sea weather (M10.8): more wind and mist than on the mainland, hardly any frost; the sky moves by steps, not draws.
  weather:
    seasons: [winter, winter, spring, spring, spring, summer, summer, summer, autumn, autumn, autumn, winter, winter]
    chances:
      spring: { clear: 0.25, overcast: 0.3, rain: 0.25, fog: 0.15, storm: 0.05 }
      summer: { clear: 0.45, overcast: 0.25, rain: 0.15, fog: 0.1, storm: 0.05 }
      autumn: { clear: 0.1, overcast: 0.25, rain: 0.25, fog: 0.3, storm: 0.1 }
      winter: { clear: 0.15, overcast: 0.35, rain: 0.2, fog: 0.15, storm: 0.1, frost: 0.05 }
    stay: 0.55
    prevailing: west
    readers: [fisher, boatman, lightkeeper, hedge_witch]
    # The sky over Skerrow (M10.17): the sea is never far.
    lines:
      rain: Rain comes in off the sea and runs down your neck.
      fog: A sea mist lies over everything and muffles every sound but the surf.
      clear: { day: The sky is wide and pale over the water., night: Stars hang sharp and cold over the sea. }
  # The harbour bell (M10.15): they count time by tides and bells. Rung at dawn and at dusk for the boats.
  bells:
    - id: harbour_bell
      name: the harbour bell
      at: loc_skerrow_harbour
      hours: [6, 18]
      heard: [skerrow_hythe]
      far: [skerrow_shore, skerrow_heights]
      line: "The harbour bell rings for {hour}, once for the boats."
      far_line: "Down at the Hythe, thin across the water, the harbour bell rings for {hour}."
  money:
    units:
      - { short: gp, name: gold piece, aliases: [gold, crown, crowns], value: 100 }
      - { short: sp, name: silver piece, aliases: [silver, shilling, shillings], value: 10 }
      - { short: cp, name: copper piece, aliases: [copper, coppers], value: 1 }
  # The fixed block every model call gets about this world.
  frame: |
    WORLD: The Sundered Isles, a scatter of islands in the Glass Sea. Year 412 of the Starfall,
    the night the sky broke and the empire of Aldmar drowned. Magic is real but rare: hedge-witches,
    runes, and the ruined towers of Aldmar's mages. Elves of the western isles live long and speak
    little; wyrms sleep under the old barrows. Money: gold, silver and copper pieces (1 gp = 10 sp,
    1 sp = 10 cp). Faith: the Tidemother, who gives and takes back; sailors swear by the Old Stars.
    REGION: Skerrow, a small rocky island with one fishing hamlet, Skerrow Hythe. The beacon on the
    headland went out in the storm, and no ship has called since. The stranger was washed up from
    the wreck of the Grey Gull, and the winter storms will soon close the sea.
    PEOPLE speak plain English with a salt turn of phrase. They count time by tides and bells.
  pictures:
    style: A small illustration in the manner of an old high-fantasy book plate, pen and ink with a light watercolour wash, sea greens and storm greys, a lone rocky island under a vast sky.
  intro: |
    Cold water, then stones. You wake on your face on a strand of black
    shingle, with the sea still pulling at your boots. Of the Grey Gull there
    is not much left: a broken mast, a spill of cordage, a cask rolling in the
    surf. Of her crew there is nothing at all.

    Gulls argue overhead. Somewhere beyond the rocks a bell rings once, thin
    and far, and then stops. There are people on this island, then.

    This is Skerrow, though you do not know it yet. No ship has called here
    since the light went out.

    Type LOOK to look around. Type HELP if you are lost. You are, rather.

  # The map (M10): Skerrow's own palette, colder than the Nethermarch's, from
  # the frame of the world: grey-green sea, salt grass, heather on the
  # heights, cliffs and dune. Skerrow has no region map yet; the palette and
  # the levels wait for one, and the editor shows them on a sample.
  map:
    levels:
      - { id: under, name: the caves }
      - { id: surface, name: ground level }
      - { id: crown, name: the cliff tops }
    palette:
      names: { water: sea water, channel: tide channel, fields: salt grass, heath: heather, fen: salt marsh, cliff: cliffs, dune: dune, tunnel: caves, crown: cliff tops }
      dark:
        ground: "#0d1113"
        unknown: "#151a1c"
        label: "#dde3e0"
        label_shadow: "#080a0b"
        terrain:
          water: ["#16323a", "#1a3942", "#132c33", "#1d4049"]
          channel: ["#24505a", "#285862"]
          fields: ["#5b6a4e", "#546248", "#627155", "#4e5c43"]
          heath: ["#5e4f5c", "#574955", "#665663", "#51444f"]
          fen: ["#3e4a3c", "#384436", "#445042", "#35403a"]
          cliff: ["#5a5a58", "#626260", "#535351", "#6a6a67"]
          dune: ["#8a8466", "#827c5f", "#928c6d", "#7b7659"]
          tunnel: ["#4f4a44", "#48433e"]
          crown: ["#6e6f6a", "#676863"]
        ways: { road: "#c4b894", path: "#a99d7c", canal: "#7fa3ad" }
        glyph: { pool: "#86b3bf", peat_pit: "#14120e", peat_edge: "#5f5645", willow: "#9fb38c", ruin: "#c9c3b2", hummock: "#a9ad8c", stairs: "#e3dcc0" }
