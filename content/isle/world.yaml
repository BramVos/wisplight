        label_shadow: "#f2f0e8"
        terrain:
          water: ["#8fb2b8", "#97b9bf", "#88abb1", "#9ec0c5"]
          channel: ["#7aa1aa", "#80a7b0"]
          fields: ["#bcc5a4", "#b5be9d", "#c3ccab", "#aeb796"]
          heath: ["#c0acb9", "#b8a4b1", "#c8b4c0", "#b19eab"]
          fen: ["#aeb8a0", "#a7b199", "#b5bfa7", "#a1ab93"]
          cliff: ["#b8b7b2", "#c0bfba", "#b0afaa", "#c8c7c2"]
          dune: ["#e2d9b4", "#dbd2ad", "#e8dfbb", "#d4cba6"]
          tunnel: ["#9f988d", "#978f84"]
          crown: ["#bdbdb6", "#b5b5ae"]
        ways: { road: "#7d6a4a", path: "#958062", canal: "#557f89" }
        glyph: { pool: "#4a7883", peat_pit: "#4f4535", peat_edge: "#3a3226", willow: "#4c6440", ruin: "#665a48", hummock: "#83845e", stairs: "#262018" }
