# The Shore of Skerrow, where the Grey Gull broke. Words in [brackets] are
# topics the interface shows as clickable.

locations:
  - id: loc_skerrow_wreck_strand
    name: The Wreck Strand
    area: skerrow_shore
    tags: [public, landmark]
    aliases: [strand, wreck strand, the strand, the beach, beach, shingle]
    summary: A strand of black shingle where the wreck of the Grey Gull lies.
    description:
      day: |
        You stand on a strand of black shingle where the sea throws up what is
        left of the [Grey Gull]: a broken mast, a spill of wet rope, a cask
        rolling in the shallows. The stones clatter and hiss with every wave,
        and the air tastes of salt and tar. Gulls quarrel over something you
        would rather not look at. North, a path climbs the low cliff; east, the
        rocks give way to the [Tidepools].
      night: |
        The strand is black on black, and the sea is a roar you feel through
        your boots. Now and then the wreck of the [Grey Gull] knocks against
        the rocks like someone asking to be let in. There is no light anywhere
        on the island. A path climbs north, and the rocks run east.
    exits:
      north: { to: loc_skerrow_cliff_path, minutes: 10 }
      east: { to: loc_skerrow_tidepools, minutes: 8 }
    items: { sailcloth: 1, lamp_oil: 1, rope: 1 }
    forage: [kelp]
    hidden:
      - id: buried_cask
        dc: 14
        item: lamp_oil
        text: Half-buried in the shingle above the tideline, where the storm threw it, a small cask. Lamp oil, by the smell of the bung.
    details:
      - words: [mast, broken mast]
        look: A broken mast from the Grey Gull, lying in the shingle with its rigging tangled round it.
        take: It is far too heavy to carry.
      - words: [spill]
        look: A spill of wet rope from the wreck, tangled in the shingle.
    arrival:
      text: You come to on black shingle with the sea still pulling at your boots. Around you lies what is left of the Grey Gull, a mast, rope, a cask turning in the shallows, and nobody else.
      storm: "The sea is still trying to take you back: waves drag at your legs over the black shingle, and wreckage of the Grey Gull comes in on every one. You crawl up the strand until the water lets you go."

  - id: loc_skerrow_tidepools
    name: The Tidepools
    area: skerrow_shore
    tags: [public]
    aliases: [tidepools, pools, rock pools, the rocks]
    summary: Shelves of rock full of clear pools between the strand and the harbour.
    description:
      day: |
        Flat shelves of rock run out into the sea here, pocked with pools as
        clear as window glass. Crabs sidle away from your shadow, and
        anemones close like fists when you lean over them. The weed is slick
        and cold under your hand. West lies the [Wreck Strand]; east, the
        roofs of the Hythe show above a harbour wall.
      night: |
        The pools hold the stars, and every one of them trembles when a wave
        comes in. The weed is treacherous in the dark, and something small
        clicks and scuttles near your feet. West is the strand, east the
        harbour wall.
    exits:
      west: { to: loc_skerrow_wreck_strand, minutes: 8 }
      east: { to: loc_skerrow_harbour, minutes: 6 }
      # Back up the rope to the cliff path (M10.30).
      up:
        to: loc_skerrow_cliff_path
        minutes: 8
        when: [{ flag: rope_on_the_cliff }]
        not_yet: The cliff above the pools is sheer and wet. Without a rope from the top there is no way up.
      # A secret way (M10.31): the cave behind the weed shows once the weed is parted.
      in:
        to: loc_skerrow_sea_cave
        minutes: 3
        hidden: true
        when: [{ flag: sea_cave_found }]
    forage: [kelp]
    details:
      - words: [weed, curtain of weed, weed curtain, back of the pools, rock face]
        look: At the back of the pools long brown weed hangs down the rock face like a heavy curtain. When a wave comes in it stirs inward, as if something behind it breathes.
        verbs:
          part:
            text: You drag the cold weed aside in armfuls. Behind it the rock opens into a low cave mouth, black and booming, and the air that comes out of it is colder than the sea wind.
            effects: [{ set: sea_cave_found }]
            minutes: 2
            done: The weed hangs aside where you parted it, and the cave mouth stands open behind it.
          pull:
            text: You drag the cold weed aside in armfuls. Behind it the rock opens into a low cave mouth, black and booming, and the air that comes out of it is colder than the sea wind.
            when: [{ not_flag: sea_cave_found }]
            not_yet: The weed hangs aside where you parted it, and the cave mouth stands open behind it.
            effects: [{ set: sea_cave_found }]
            minutes: 2
      - words: [wall, harbour wall]
        look: East, above the rocks, the harbour wall of the Hythe.
      - words: [pools, crabs, anemones]
        look: Pools as clear as window glass, with crabs sidling away from your shadow and anemones closing like fists.
    pos: [2.06, 1.59]

  - id: loc_skerrow_cliff_path
    name: The Cliff Path
    area: skerrow_shore
    tags: [public]
    aliases: [cliff path, cliff, path, sheep track]
    summary: A sheep track along the top of the south cliff.
    description:
      day: |
        A sheep track runs along the top of the cliff between thrift and sea
        campion. The wind comes straight off the Glass Sea and leans on you
        like a hand, and far below the waves boom in the caves. South, it
        drops to the [Wreck Strand]. Inland it climbs north towards a stand of
        pale trees, and east it runs down to the hamlet.
      night: |
        The path is a pale thread along the edge of nothing. You hear the sea
        below more than you see it, a slow boom and suck in the caves. South
        is the strand; north the path climbs to the trees, east it goes down
        to the hamlet.
    exits:
      south: { to: loc_skerrow_wreck_strand, minutes: 10 }
      north: { to: loc_skerrow_silver_grove, minutes: 15 }
      east: { to: loc_skerrow_green, minutes: 12 }
      # Straight down to the tidepools, once a rope hangs from the stake (M10.30).
      down:
        to: loc_skerrow_tidepools
        minutes: 6
        when: [{ flag: rope_on_the_cliff }]
        not_yet: The cliff drops sheer to the tidepools. A rope tied to the old stake would take you down.
    details:
      - words: [stake, iron stake, edge, cliff edge]
        look: An old iron stake is driven into the turf at the very edge, rusted but firm. Far below, the tidepools shine between the rocks.
        take: It has been in the rock longer than anyone on Skerrow has been alive.
        verbs:
          tie:
            when: [{ has: rope }]
            not_yet: You have nothing to tie to the stake.
            text: You knot the rope round the iron stake and pay it out over the edge. It hangs to the rocks by the tidepools, swaying in the wind.
            effects: [{ take: rope }, { set: rope_on_the_cliff }]
            done: Your rope is tied fast already, and hangs to the pools.
      - words: [stand, trees, pale trees]
        look: A stand of pale trees on the rise to the north, bent by the wind.
      - words: [thrift, campion, sea campion]
        look: Thrift and sea campion grow along the cliff top, pink and white.
    pos: [1.56, 2.22]

  # Behind the weed at the back of the Tidepools (M10.31): a secret way, found by parting the weed.
  - id: loc_skerrow_sea_cave
    name: The Sea Cave
    area: skerrow_shore
    aliases: [sea cave, cave, the cave]
    summary: A low cave behind the weed at the back of the Tidepools, where the sea booms in the dark.
    sound: { kind: surf, level: 0.8 }
    description:
      day: |
        Green light leaks in past the weed behind you and fades a few steps on, where the cave runs back into the cliff. Every wave fills the dark with a slow boom and a long suck of water, and the cold air tastes of salt and iron. Grey driftwood lies wedged on a ledge above your head, far above where any tide should reach. The way out is back through the weed to the [Tidepools].
      night: |
        It is black as pitch in here, and you find the walls by touch, wet and ridged under your fingers. The sea booms and sucks somewhere ahead of you, closer than you like. Behind you a paler dark shows where the weed hangs across the mouth, the way back out to the pools.
    exits:
      out: { to: loc_skerrow_tidepools, minutes: 3 }
    details:
      - words: [driftwood, ledge, wood]
        look: Grey driftwood, bleached and dry, wedged on a ledge far above the tide line. Only a great storm throws the sea this high.
      - words: [walls, rock, cliff]
        look: Black rock, ridged and wet, running back into a dark you cannot see the end of.
      - words: [sea, wave, waves, boom, water]
        look: Somewhere deeper in, the sea comes and goes through a gap you cannot see, with a slow boom and a long suck of water.
      - words: [weed, mouth, cave mouth]
        look: The weed hangs across the mouth behind you, lit green by the day outside.
