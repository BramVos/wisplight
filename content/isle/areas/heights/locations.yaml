# The Heights of Skerrow: the grove, the barrow, the beacon and the tower.

locations:
  - id: loc_skerrow_silver_grove
    name: The Silver Grove
    area: skerrow_heights
    tags: [public, holy]
    aliases: [grove, silver grove, the grove, birches, trees]
    summary: A grove of silver birches out of the wind, where Old Tamsin lives.
    description:
      day: |
        Birches with bark gone silver-white stand close together here, out of
        the wind, and the moss between them is soft underfoot. Shells and
        scraps of cloth hang from the branches on threads, and they tick and
        chime whenever the air moves. A turf hut with a crooked chimney sits
        among the trees. The cliff path runs south, the heights climb north to
        the barrow of [Old Skarth], and a track crosses east to the headland.
      night: |
        The birches glimmer as if they held a little of the day back. The
        shells chime in the dark, very softly, and a thread of smoke smells of
        thyme from the hut among the trees. South is the cliff path, north
        the barrow, east the headland.
    exits:
      south: { to: loc_skerrow_cliff_path, minutes: 15 }
      north: { to: loc_skerrow_wyrm_barrow, minutes: 20 }
      east: { to: loc_skerrow_headland, minutes: 12 }
      in: { to: loc_skerrow_tamsin_hut, minutes: 1 }
    objects:
      - { id: old_birch, type: silver_birch }
    services:
      - id: tamsins_remedies
        provider: npc_tamsin
        hours: "08-17"
        sells:
          kelp_salve: { stock: 3, target: 3 }
        supply:
          - { item: kelp_salve, amount: 3, every: week, at: 8 }

  - id: loc_skerrow_tamsin_hut
    name: Tamsin's Hut
    area: skerrow_heights
    tags: [private]
    aliases: [hut, tamsin's hut, turf hut]
    summary: Old Tamsin's turf hut in the silver grove.
    description:
      day: |
        The hut is one round room, dark and warm, hung so thick with drying
        herbs that you have to duck. Jars of things you would rather not name
        line the shelves. It smells of thyme, smoke and the sea. The door out
        to the grove is a hide curtain behind you.
      night: |
        A fish-oil lamp gutters on the table, and the herbs overhead turn it
        into a forest of shadows. Something in a jar is ticking. The hide
        curtain behind you goes out to the grove.
    exits:
      out: { to: loc_skerrow_silver_grove, minutes: 1 }
    objects:
      - { id: pot, type: salve_pot, owner: npc_tamsin }
    details:
      - words: [curtain, hide curtain]
        look: A hide curtain over the doorway, heavy and stiff with salt.
      - words: [jars, shelves]
        look: Jars of things you would rather not name, stoppered with wax and lined up along the shelves.
        take: They are Tamsin's, and some of them are better left shut.
        verbs:
          open: You put your hand to a stopper and think better of it.
      - words: [herbs, thyme]
        look: "Herbs hang so thick from the roof that you have to duck: thyme most of all, and some you do not know."
        take: They are Tamsin's. You leave them hanging.

  - id: loc_skerrow_wyrm_barrow
    name: The Wyrm Barrow
    area: skerrow_heights
    tags: [public, landmark]
    aliases: [barrow, wyrm barrow, the barrow, the mound, mound, tomb]
    summary: A long green mound on the top of the island, where they say a wyrm sleeps.
    description:
      day: |
        A long green mound lies across the top of the island like a sleeping
        animal, and nothing grows on it but short, warm grass. Put your ear to
        the ground and you hear, very slow and very deep, something like
        breathing. A gap between two standing stones at the east end is black
        and goes down. The only way off the height is south, back to the
        grove.
      night: |
        The barrow is darker than the dark around it, and there is no dew on
        its grass. The air over the gap between the standing stones shimmers
        like the air over a forge. The way back is south, to the grove.
    exits:
      south: { to: loc_skerrow_silver_grove, minutes: 20 }
    # M10.5: for eyes that look.
    hidden:
      - id: scorched_stones
        dc: 15
        topic: old_skarth
        text: On the inner faces of the two standing stones the lichen is burnt away in long black tongues, and the stone is glazed like a pot, as if something breathed on them once, very hot, from below.
    details:
      - words: [gap, standing stones, stones]
        look: Between two standing stones at the east end, a gap goes down into the dark. Warm air comes out of it, slow and deep, like breath.
      - words: [mound, barrow, grass]
        look: A long green mound, and the short grass on it is warm to the touch.
        verbs:
          dig: You kneel on the warm grass, and under your hands something breathes, very slow. You get up again.

  - id: loc_skerrow_headland
    name: The Headland
    area: skerrow_heights
    tags: [public, landmark]
    aliases: [headland, the headland, beacon tower, lighthouse, point]
    summary: The blunt headland with the beacon tower, the Lamp of Skerrow.
    description:
      day: |
        The island ends here in a blunt headland with the sea on three sides
        and a squat stone tower on top: the [beacon]. Its great lamp stands
        cold behind green glass, and the wind whistles through the empty
        gallery. Below the tower a lean-to store shed has lost half its roof,
        and it smells strongly of fish oil. A track runs south to the hamlet
        and west to the grove; north, a ruined tower stands alone on the last
        rise.
      night: |
        The beacon tower is a black tooth against the stars, and its lamp is
        as dark as the rest of the island. The sea booms on three sides.
        Tracks go south to the hamlet and west to the grove; north, the ruined
        tower is only a darker shape.
    # The Lamp of Skerrow lit again (found in the M9.4 playtest: at night it still stood dark).
    variants:
      - flag: beacon_burning
        day: |
          The island ends here in a blunt headland with the sea on three sides
          and the squat beacon tower on top, its green glass warm with the
          lamp inside. It smells of fish oil and hot brass. A track runs south
          to the hamlet and west to the grove; north, a ruined tower stands
          alone on the last rise.
        night: |
          Above you the Lamp of Skerrow burns, and its long green beam sweeps
          out over the sea and back, over and over. The tower hums faintly
          with the heat. Tracks go south to the hamlet and west to the grove;
          north, the ruined tower shows in each pass of the light.
    exits:
      south: { to: loc_skerrow_green, minutes: 15 }
      west: { to: loc_skerrow_silver_grove, minutes: 12 }
      north: { to: loc_skerrow_mage_tower, minutes: 15 }
    objects:
      - { id: lamp, type: beacon, owner: npc_garrick }
    forage: [heath]
    items: { lamp_oil: 1 }
    details:
      - words: [shed, store, store shed, lean-to]
        look: A lean-to store shed at the foot of the tower, with half its roof gone. It smells strongly of fish oil.
      - words: [track, tracks]
        look: Tracks run south to the hamlet and west to the grove.
    arrival:
      text: "The squat stone tower stands at the very end of the island with the sea on three sides, and the great lamp behind its green glass is cold. From up here you see why the ships stopped coming: without that light, Skerrow is only rocks in the dark."
      night: At night the headland is all wind and the sound of the sea, and the tower is a black shape with no light in it. Somewhere out there a ship would have to guess where the rocks begin.
      far: "On the last headland stands a squat stone tower with a gallery of green glass: the Lamp of Skerrow, with no light in it."

  - id: loc_skerrow_mage_tower
    name: The Drowned Mage's Tower
    area: skerrow_heights
    tags: [public, landmark]
    aliases: [tower, mage tower, the tower, ruined tower, elowen's tower]
    summary: Half a tower of black stone from the days of Aldmar, where the elf Elowen studies.
    description:
      day: |
        Half a tower of black stone stands on the last rise of Skerrow, its
        top storeys long since fallen into the sea. Inside, stairs climb round
        the wall to nowhere, and in the middle of the floor stands the
        [waystone], a ring of black stone taller than a man. The air hums
        faintly, like a struck glass that never quite stops. Someone has made
        a study of the place, with books, a lamp and a narrow cot; the way out
        is south, down to the headland.
      night: |
        A single lamp burns among the books, and the runes on the [waystone]
        catch its light and seem to move. The hum in the air is louder in the
        dark. The way out is south, down to the headland.
    exits:
      south: { to: loc_skerrow_headland, minutes: 15 }
    objects:
      - { id: waystone, type: waystone }
    details:
      - words: [study, cot, books]
        look: "Someone has made a study here among the ruins: books stacked against the wall, a lamp, and a narrow cot."
      - words: [lamp]
        look: A small oil lamp among the books.
        take: It is someone's lamp, in someone's study. You leave it.
      - words: [stairs]
        look: Stairs climb round the inside of the wall and stop in the air where the tower has fallen.
        verbs:
          climb: You climb a few steps and look up at the sky where the rest of the tower should be. You come down again.
    arrival:
      text: Half a tower of black stone stands against the sky, its top long since fallen into the sea. As you come closer the air begins to hum, faint as a finger on glass, and the hair on your arms stands up.
      far: On the last rise of the island stands half a tower of black stone, broken off like a tooth.
