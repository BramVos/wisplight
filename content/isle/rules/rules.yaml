      trees:
        - id: tide
          name: Tide
          talents:
            - { id: scalding_brine, name: Scalding Brine, text: "Brine that burns.", effects: [{ ability: { actions: 2, uses: at_will, target: enemy, range: near, do: [{ damage: { dice: 2d6, save: reflex } }] } }] }
            - { id: salt_ward, name: Salt Ward, text: "+2 defence against spirits.", effects: [{ bonus: { to: defence, value: 2, when: vs_spirit } }] }
            - { id: spray, name: Spray, text: "Salt spray in a foe's eyes.", effects: [{ ability: { actions: 1, uses: fight, target: enemy, range: near, do: [{ condition: { name: blinded, rounds: 1, save: will } }] } }] }
            - { id: breaking_wave, name: Breaking Wave, text: "A wave on every foe.", effects: [{ ability: { actions: 3, uses: fight, target: enemies, range: near, do: [{ damage: { dice: 4d6, save: reflex } }] } }] }
