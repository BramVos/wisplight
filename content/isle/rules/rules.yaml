            - { id: last_tide, name: Last Tide, text: "+1 on attacks and saves.", effects: [{ bonus: { to: attack, value: 1 } }, { bonus: { to: 'save:will', value: 1 } }] }

  # Favour runs from 0 to 100; blessings at 25, 50 and 75.
  patrons:
    - id: tidemother
      name: the Tidemother
      # Swearing to her is a deed companions judge (M10.17).
      sworn: mercy
      text: The sea that gives and takes back; fish, weather and the drowned.
      values: { request_done: 2, honour_dead: 3, spared: 2, pray: 1 }
      forbids: { killed_surrendered: -20, grave_robbing: -20 }
      blessings:
        - { at: 25, name: Salt Blood, text: "+1 Fortitude: the cold sea does not take you so easily.", effects: [{ bonus: { to: 'save:fortitude', value: 1 } }] }
        - { at: 50, name: "The Mother's Hand", text: "+1 Seamanship; travel over water goes a quarter faster.", effects: [{ bonus: { to: 'skill:watercraft', value: 1 } }] }
        - { at: 75, name: Given Back, text: "Once, the sea gives you back when you would drown; she asks for something later.", effects: [] }
    - id: old_stars
      name: the Old Stars
      # Swearing to them is a deed companions judge (M10.17).
      sworn: courage
      text: The stars that fell and the ones that stayed; sailors' oaths, luck and the way home.
      values: { fight_won: 2, request_done: 1, pray: 1 }
      forbids: { fled: -5, killed_surrendered: -10 }
      blessings:
        - { at: 25, name: Star-sight, text: "+1 Perception and Survival out of doors.", effects: [{ bonus: { to: 'skill:perception', value: 1, when: outdoors } }, { bonus: { to: 'skill:survival', value: 1, when: outdoors } }] }
        - { at: 50, name: Steady Course, text: "+1 on attacks.", effects: [{ bonus: { to: attack, value: 1 } }] }
        - { at: 75, name: The Way Home, text: "+2 Survival; you never lose your way under the stars.", effects: [{ bonus: { to: 'skill:survival', value: 2 } }] }
  # Death on Skerrow (M10.17): the Tidemother gives you back to the shore, and the grove lifts the cold.
  death:
    vision: "Cold water closes over you, and then there is no water, only a long grey shore under a sky of falling stars. A woman made of the tide comes walking over the shingle, and {guide} turns you round by the shoulders and gives you back to the sea."
    guide: she
    patron: tidemother
    wake: You wake on your back on the shingle a day later, coughing up salt water.
    mark: "The sea has left its cold in you: 10% fewer hit points until you give the Tidemother a RITE at the old birch in the silver grove.{lost}"
    rite_where: A rite for the drowned is given at the old birch in the silver grove.
    rite_done: You tie a shell to the old birch and say the names of the drowned you know. The cold goes out of your bones.
    rite_nothing: You say the names of the drowned. Only the sea answers.
