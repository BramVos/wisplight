# The rules of Skerrow (M9.1): the same slim d20 core as the Nethermarch, with
# the island's own peoples, callings, patrons and beasts. The numbers are the
# Nethermarch's, so the balance test holds for both worlds; the words are
# Skerrow's. Talent effects use the same vocabulary (see base/rules/rules.yaml).

rules:
  xp_per_level: 1000
  # The ready-made castaway for a game started without making a character: a
  # knave of the islands, a wrecker's child, quick of tongue.
  ready_made: { name: Castaway, ancestry: islander, background: wreckers_child, class: knave, boosts: [resolve, resolve, grace, might], skills: [intimidation, insight, perception], talent: quick_hands }
  # For a suggested character, the ancestry for each key attribute.
  suggest: { might: mainlander, grace: western_elf, wits: islander, resolve: islander }
  skills:
    - { id: athletics, name: Athletics, attribute: might }
    - { id: stealth, name: Stealth, attribute: grace }
    - { id: thievery, name: Thievery, attribute: grace }
    - { id: watercraft, name: Seamanship, attribute: grace }
    - { id: perception, name: Perception, attribute: wits }
    - { id: survival, name: Survival, attribute: wits }
    - { id: lore, name: Lore, attribute: wits }
    - { id: medicine, name: Medicine, attribute: wits }
    - { id: crafting, name: Crafting, attribute: wits }
    - { id: insight, name: Insight, attribute: wits }
    - { id: persuasion, name: Persuasion, attribute: resolve }
    - { id: deception, name: Deception, attribute: resolve }
    - { id: intimidation, name: Intimidation, attribute: resolve }

  ancestries:
    - id: islander
      name: Islander
      aliases: [islanders, islandfolk, island born]
      text: People of the Sundered Isles, born to boats and weather.
      attributes: { wits: 1, choice: 1 }
      hp: 8
      special: Feels weather and tide; advantage when foretelling storm and tide.
      aptitude: { watercraft: 1, crafting: 1 }
    - id: mainlander
      name: Mainlander
      aliases: [mainlanders, havenmoor folk]
      text: People of Havenmoor and the big isles, broad and stubborn.
      attributes: { might: 1, resolve: 1, grace: -1 }
      hp: 10
      special: Carries twice the load; clumsy in tight places.
      aptitude: { athletics: 1, intimidation: 1, stealth: -1 }
    - id: western_elf
      name: Elf of the western isles
      aliases: [elf, elves, elven, western elf]
      # The superstitious keep a step back from the long-lived (M10.17).
      distrusted_by: [superstitious]
      text: They live long and speak little.
      attributes: { grace: 1, wits: 1 }
      hp: 8
      special: Sees by starlight as by day, and remembers what others forget.
      aptitude: { lore: 1, stealth: 1, persuasion: -1 }

  backgrounds:
    - { id: castaway, name: Castaway sailor, skills: [athletics, watercraft], talent: shore_walker, knows: [npc_brannoc], topics: [grey_gull], reason: "You signed on the Grey Gull as a deckhand at Havenmoor, and you are the only one the sea gave back. Brannoc has the only boat on the island.", contact: npc_brannoc, heard: grey_gull }
    - { id: fisher, name: Fisher, skills: [survival, watercraft], talent: shore_walker, knows: [{ who: npc_wenna, how: "you have fished the same grounds as her, season after season" }, npc_brannoc], topics: [the_tidemother], reason: "You fished out of Havenmoor and took passage on the Grey Gull to see your sister, and the storm took the ship instead. Wenna fishes these waters; she will know where the fish are.", contact: npc_wenna, heard: the_tidemother }
    - { id: lamp_hand, name: "Lightkeeper's hand", skills: [perception, crafting], talent: keen_eyes, knows: [npc_garrick], topics: [the_beacon], reason: "You were on the Grey Gull to take up a post as a keeper's hand further west, and the light here was dark the night she struck. Garrick keeps the Lamp of Skerrow, when he keeps it.", contact: npc_garrick, heard: the_beacon }
    - { id: witch_apprentice, name: "Hedge-witch's apprentice", skills: [medicine, survival], talent: iron_stomach, knows: [{ who: npc_tamsin, how: "your mistress's old friend, whose letters you carried as a child" }], topics: [old_skarth], reason: "Your mistress sent you across the Glass Sea with a letter for Old Tamsin, and the letter went down with the Grey Gull. Tamsin may take you in without it.", contact: npc_tamsin, heard: old_skarth }
    - { id: rune_reader, name: Rune-reader, skills: [lore, insight], talent: steady_hand, knows: [npc_elowen], topics: [the_starfall, the_waystone], reason: "You sailed on the Grey Gull to study the ruined tower of Aldmar's mages, the one thing on Skerrow you came for. The elf Elowen lives there, they told you in Havenmoor.", contact: npc_elowen, heard: the_starfall }
    - { id: wreckers_child, name: "A wrecker's child", skills: [stealth, deception], talent: light_step, knows: [npc_maren], topics: [], reason: "You were born to wreckers on another island and ran from them on the Grey Gull, and now a wreck has put you ashore after all. Maren at the Salt Kettle takes in what the sea brings.", contact: npc_maren, heard: grey_gull }
    - { id: havenmoor_guard, name: Guard of Havenmoor, skills: [athletics, perception], talent: light_step, knows: [], topics: [havenmoor], reason: "You guarded cargo on the Grey Gull for a Havenmoor house, and the cargo is on the sea floor now. Maren is headwoman here; she will want to know who you are.", contact: npc_maren, heard: havenmoor }
    - { id: merchants_clerk, name: "Merchant's clerk", skills: [persuasion, insight], talent: haggler, knows: [npc_maren], topics: [havenmoor], reason: "You kept the ledger of a Havenmoor merchant aboard the Grey Gull, and you would like to know what the sea gave back. Maren at the Salt Kettle buys what washes up.", contact: npc_maren, heard: havenmoor }
    # From the wreck (M10.9): who else the Grey Gull carried.
    - { id: fugitive, name: Fugitive, skills: [stealth, athletics], talent: light_step, knows: [], topics: [havenmoor], reason: "You signed on the Grey Gull under another name to get away from Havenmoor and what you did there. Nobody here knows your face yet, and Maren asks fewer questions than most.", contact: npc_maren, heard: havenmoor }
    - { id: merchant, name: Merchant, skills: [persuasion, perception], talent: haggler, knows: [], topics: [havenmoor], reason: "Your wares were in the hold of the Grey Gull, and some of them may still be on the strand. Maren at the Salt Kettle buys and sells for the whole island.", contact: npc_maren, heard: grey_gull }

  general_talents:
    - { id: shore_walker, name: Shore-walker, text: "+2 Survival out of doors; wet rock does not throw you so easily.", effects: [{ bonus: { to: 'skill:survival', value: 2, when: outdoors } }] }
    - { id: haggler, name: Haggler, text: "+2 Persuasion when bargaining; prices a little better.", effects: [{ bonus: { to: 'skill:persuasion', value: 1 } }] }
    - { id: iron_stomach, name: Iron Stomach, text: "+2 Fortitude; bad fish and bilge water do not make you sick.", effects: [{ bonus: { to: 'save:fortitude', value: 2 } }] }
    - { id: steady_hand, name: Steady Hand, text: "+2 Medicine.", effects: [{ bonus: { to: 'skill:medicine', value: 2 } }] }
    - { id: light_step, name: Light Step, text: "+2 Stealth.", effects: [{ bonus: { to: 'skill:stealth', value: 2 } }] }
    - { id: toughness, name: Toughness, text: "+1 hit point per level.", effects: [{ bonus: { to: hp, value: 1, when: per_level } }] }
    - { id: keen_eyes, name: Keen Eyes, text: "+2 Perception and initiative.", effects: [{ bonus: { to: 'skill:perception', value: 2 } }] }
    - { id: iron_will, name: Iron Will, text: "+2 Will.", effects: [{ bonus: { to: 'save:will', value: 2 } }] }

  conditions:
    - { id: frightened, name: Frightened, text: "Minus its value on all checks; drops by 1 each round.", max: 3 }
    - { id: bleeding, name: Bleeding, text: "Takes its value in damage each round.", max: 5 }
    - { id: grabbed, name: Grabbed, text: "Cannot move; -2 on attacks." }
    - { id: prone, name: Prone, text: "-2 on attacks, easier to hit; standing up takes an action." }
    # M10.14: out of the sea, soaked and cold, until an hour under a roof.
    - { id: wet, name: Wet and cold, text: "-1 on checks until you dry out by a fire or under a roof." }
    - { id: off_guard, name: Off-guard, text: "-2 defence until the end of its next turn." }
    - { id: sickened, name: Sickened, text: "Cannot eat or drink; -1 on checks." }
    - { id: cursed, name: Cursed, text: "A curse with a rule of its own." }
    - { id: blinded, name: Blinded, text: "-4 on attacks and Perception." }
    - { id: slowed, name: Slowed, text: "One action fewer each turn." }

  classes:
    - id: shieldhand
      name: Shieldhand
      text: "A shield-bearer of the old sea-watch who holds the line."
      key: might
      hp: 10
      trained: [athletics, intimidation, perception]
      armour: heavy
      proficiency: { attack: [1, 7], class_dc: [1, 9], defence: [1, 5, 9] }
      gear: { spear: 1, ring_shirt: 1, round_shield: 1 }
      core:
        id: shield_wall
        name: Shield Wall
        text: Take the blow meant for an ally beside you.
        effects: [{ ability: { actions: 1, uses: at_will, target: ally, range: engaged, do: [{ protect: true }] } }]
      trees:
        - id: seawall
          name: Seawall
          talents:
            - { id: brace, name: Brace, text: "+1 defence while your shield is raised.", effects: [{ bonus: { to: defence, value: 1, when: shield } }] }
            - { id: stand_fast, name: Stand Fast, text: "+2 Fortitude and +5 hit points.", effects: [{ bonus: { to: 'save:fortitude', value: 2 } }, { bonus: { to: hp, value: 5 } }] }
            - { id: bulwark, name: Bulwark, text: "+1 defence for good.", effects: [{ bonus: { to: defence, value: 1 } }] }
            - { id: unbroken_line, name: Unbroken Line, text: "Allies behind you get +1 defence.", effects: [{ bonus: { to: defence, value: 1, when: front } }] }
        - id: steel
          name: Steel
          talents:
            - { id: heavy_blow, name: Heavy Blow, text: "A slow, heavy strike that does 1d6 more.", effects: [{ ability: { actions: 2, uses: at_will, target: enemy, range: engaged, do: [{ strike: { bonus: 0, damage: 1d6 } }] } }] }
            - { id: weapon_drill, name: Weapon Drill, text: "+1 on melee attacks.", effects: [{ bonus: { to: attack, value: 1, when: melee } }] }
            - { id: sweep, name: Sweep, text: "Strike every enemy you are engaged with.", effects: [{ ability: { actions: 2, uses: fight, target: enemies, range: engaged, do: [{ strike: { bonus: -1 } }] } }] }
            - { id: hard_as_iron, name: Hard as Iron, text: "+2 damage on melee strikes.", effects: [{ bonus: { to: damage, value: 2, when: melee } }] }
        - id: watch
          name: Watch
          talents:
            - { id: rally, name: Rally, text: "Allies shake off fear.", effects: [{ ability: { actions: 1, uses: fight, target: allies, range: near, do: [{ cure: { name: frightened } }, { buff: { to: attack, value: 1, rounds: 2 } }] } }] }
            - { id: commanding_voice, name: Commanding Voice, text: "+2 Intimidation, and enemies' morale drops faster.", effects: [{ bonus: { to: 'skill:intimidation', value: 2 } }] }
            - { id: hold_the_line, name: Hold the Line, text: "Momentum starts one higher.", effects: [{ bonus: { to: momentum, value: 1 } }] }
            - { id: last_stand, name: Last Stand, text: "Once a fight, heal yourself when badly hurt.", effects: [{ ability: { actions: 1, uses: fight, target: self, do: [{ heal: { dice: 2d8 } }] } }] }

    - id: harpooner
      name: Harpooner
      text: "Bow, nets and the patience of the hunt; nobody reads the shore better."
      key: grace
      hp: 8
      trained: [stealth, survival, perception]
      armour: light
      proficiency: { attack: [1, 5, 9], class_dc: [1, 9], defence: [1, 5, 9] }
      gear: { longbow: 1, knife: 1, sealskin_jerkin: 1 }
      keeps_range: true
      core:
        id: quarry
        name: Quarry
        text: Mark a prey; your strikes on it do more harm.
        effects: [{ ability: { actions: 1, uses: at_will, target: enemy, range: far, do: [{ mark: quarry }] } }, { bonus: { to: damage, value: 2, when: quarry } }]
      trees:
        - id: bow
          name: Bow
          talents:
            - { id: steady_aim, name: Steady Aim, text: "+1 on ranged attacks.", effects: [{ bonus: { to: attack, value: 1, when: ranged } }] }
            - { id: double_shot, name: Double Shot, text: "Two arrows at once.", effects: [{ ability: { actions: 2, uses: at_will, target: enemy, range: far, do: [{ strike: { bonus: -2 } }, { strike: { bonus: -2 } }] } }] }
            - { id: pinning_shot, name: Pinning Shot, text: "An arrow that slows.", effects: [{ ability: { actions: 2, uses: fight, target: enemy, range: far, do: [{ strike: { bonus: 0 } }, { condition: { name: slowed, rounds: 1, save: reflex } }] } }] }
            - { id: deadeye, name: Deadeye, text: "+2 damage on ranged strikes.", effects: [{ bonus: { to: damage, value: 2, when: ranged } }] }
        - id: nets
          name: Nets
          talents:
            - { id: tripwire, name: Tripwire, text: "Knock an enemy prone.", effects: [{ ability: { actions: 1, uses: fight, target: enemy, range: near, do: [{ condition: { name: prone, save: reflex } }] } }] }
            - { id: trapper, name: Trapper, text: "+2 Survival, and you see snares before they bite.", effects: [{ bonus: { to: 'skill:survival', value: 2 } }] }
            - { id: kelp_snare, name: Kelp Snare, text: "An enemy tangled in wet kelp.", effects: [{ ability: { actions: 2, uses: fight, target: enemy, range: near, do: [{ condition: { name: grabbed, save: reflex } }] } }] }
            - { id: hunters_patience, name: "Hunter's Patience", text: "+2 attack in the first round.", effects: [{ bonus: { to: attack, value: 2, when: first_round } }] }
        - id: rocks
          name: Rocks
          talents:
            - { id: among_the_rocks, name: Among the Rocks, text: "+2 Stealth and +1 defence at range.", effects: [{ bonus: { to: 'skill:stealth', value: 2 } }, { bonus: { to: defence, value: 1, when: ranged } }] }
            - { id: tracker, name: Tracker, text: "+2 Perception outdoors.", effects: [{ bonus: { to: 'skill:perception', value: 2, when: outdoors } }] }
            - { id: vanish, name: Vanish, text: "Slip away: enemies lose sight of you.", effects: [{ ability: { actions: 1, uses: fight, target: self, do: [{ move: back }, { buff: { to: defence, value: 2, rounds: 1 } }] } }] }
            - { id: sea_mist, name: Sea Mist, text: "+2 initiative and +1 on attacks at night.", effects: [{ bonus: { to: initiative, value: 2 } }, { bonus: { to: attack, value: 1, when: night } }] }

    - id: knave
      name: Knave
      text: "Sneaking, tricks and a quick tongue; half the stories of the isles are about someone like you."
      key: grace
      hp: 8
      trained: [stealth, thievery, deception, persuasion]
      armour: light
      proficiency: { attack: [1, 5, 9], class_dc: [1, 9], defence: [1, 7] }
      gear: { cutlass: 1, knife: 1, sealskin_jerkin: 1 }
      core:
        id: mischief
        name: Mischief
        text: A trick that throws an enemy off balance.
        effects: [{ ability: { actions: 1, uses: at_will, target: enemy, range: near, do: [{ condition: { name: off_guard, rounds: 1, save: will } }] } }]
      trees:
        - id: sleight
          name: Sleight
          talents:
            - { id: quick_hands, name: Quick Hands, text: "+2 Thievery.", effects: [{ bonus: { to: 'skill:thievery', value: 2 } }] }
            - { id: backstab, name: Backstab, text: "A strike on a foe off guard does 1d6 more.", effects: [{ ability: { actions: 1, uses: at_will, target: enemy, range: engaged, do: [{ strike: { bonus: 0, damage: 1d6 } }] } }] }
            - { id: flurry, name: Flurry, text: "Two quick stabs.", effects: [{ ability: { actions: 2, uses: at_will, target: enemy, range: engaged, do: [{ strike: { bonus: -1 } }, { strike: { bonus: -1 } }] } }] }
            - { id: vicious_edge, name: Vicious Edge, text: "+2 damage with light weapons.", effects: [{ bonus: { to: damage, value: 2, when: melee } }] }
        - id: tongue
          name: Tongue
          talents:
            - { id: silver_tongue, name: Silver Tongue, text: "+2 Persuasion.", effects: [{ bonus: { to: 'skill:persuasion', value: 2 } }] }
            - { id: taunt, name: Taunt, text: "Make an enemy wild with anger.", effects: [{ ability: { actions: 1, uses: fight, target: enemy, range: near, do: [{ condition: { name: off_guard, rounds: 2, save: will } }] } }] }
            - { id: liars_luck, name: "Liar's Luck", text: "+2 Deception.", effects: [{ bonus: { to: 'skill:deception', value: 2 } }] }
            - { id: talk_them_down, name: Talk Them Down, text: "An enemy loses heart.", effects: [{ ability: { actions: 2, uses: fight, target: enemy, range: near, do: [{ condition: { name: frightened, value: 2, save: will } }] } }] }
        - id: pranks
          name: Pranks
          talents:
            - { id: pocket_sand, name: Pocket Sand, text: "Sand in the eyes.", effects: [{ ability: { actions: 1, uses: fight, target: enemy, range: engaged, do: [{ condition: { name: blinded, rounds: 1, save: reflex } }] } }] }
            - { id: slippery, name: Slippery, text: "+1 defence and +2 Reflex.", effects: [{ bonus: { to: defence, value: 1 } }, { bonus: { to: 'save:reflex', value: 2 } }] }
            - { id: tumble, name: Tumble, text: "Roll away out of reach.", effects: [{ ability: { actions: 1, uses: at_will, target: self, do: [{ move: back }] } }] }
            - { id: gull_and_mirror, name: Gull and Mirror, text: "A trick so bold two foes stand stunned.", effects: [{ ability: { actions: 2, uses: fight, target: enemies, range: near, do: [{ condition: { name: slowed, rounds: 1, save: will } }] } }] }

    - id: witch
      name: Hedge-witch
      text: "Salves, poisons and the weeds of shore and heath."
      key: wits
      hp: 6
      trained: [medicine, survival, lore]
      armour: light
      proficiency: { attack: [1, 9], class_dc: [1, 5, 9], defence: [1, 5, 9] }
      gear: { staff: 1, kelp_salve: 3, quilted_coat: 1 }
      keeps_range: true
      core:
        id: poultice
        name: Poultice
        text: Heal a wound and take away one ailment.
        effects: [{ ability: { actions: 2, uses: at_will, target: ally, range: engaged, do: [{ heal: { dice: 1d8 } }, { cure: { name: any } }] } }]
      trees:
        - id: salve
          name: Salve
          talents:
            - { id: bandage, name: Bandage, text: "Stop bleeding at once.", effects: [{ ability: { actions: 1, uses: at_will, target: ally, range: engaged, do: [{ cure: { name: bleeding } }] } }] }
            - { id: healing_hands, name: Healing Hands, text: "Your poultices heal 1d8 more.", effects: [{ bonus: { to: heal, value: 4 } }] }
            - { id: field_surgeon, name: Field Surgeon, text: "+2 Medicine.", effects: [{ bonus: { to: 'skill:medicine', value: 2 } }] }
            - { id: second_wind, name: Second Wind, text: "Heal everyone near you.", effects: [{ ability: { actions: 2, uses: fight, target: allies, range: near, do: [{ heal: { dice: 2d6 } }] } }] }
        - id: poison
          name: Poison
          talents:
            - { id: bitter_dart, name: Bitter Dart, text: "A dart that makes sick.", effects: [{ ability: { actions: 1, uses: at_will, target: enemy, range: near, do: [{ damage: { dice: 1d6 } }, { condition: { name: sickened, save: fortitude } }] } }] }
            - { id: toxin_lore, name: Toxin Lore, text: "+2 Fortitude.", effects: [{ bonus: { to: 'save:fortitude', value: 2 } }] }
            - { id: hemlock_cloud, name: Hemlock Cloud, text: "A cloud of foul spores.", effects: [{ ability: { actions: 2, uses: fight, target: enemies, range: near, do: [{ damage: { dice: 2d6, save: fortitude } }] } }] }
            - { id: black_nightshade, name: Black Nightshade, text: "A dose that drops a man.", effects: [{ ability: { actions: 2, uses: fight, target: enemy, range: engaged, do: [{ damage: { dice: 4d6, save: fortitude } }] } }] }
        - id: wrack
          name: Wrack
          talents:
            - { id: shore_lore, name: Shore Lore, text: "+2 Survival and Lore.", effects: [{ bonus: { to: 'skill:survival', value: 2 } }, { bonus: { to: 'skill:lore', value: 2 } }] }
            - { id: rowan_charm, name: Rowan Charm, text: "A twist of rowan keeps spirits off.", effects: [{ bonus: { to: defence, value: 2, when: vs_spirit } }] }
            - { id: stinging_nettle, name: Stinging Nettle, text: "Whip of nettles.", effects: [{ ability: { actions: 1, uses: at_will, target: enemy, range: engaged, do: [{ damage: { dice: 2d4 } }] } }] }
            - { id: witches_brew, name: "Witch's Brew", text: "A draught for courage and strength.", effects: [{ ability: { actions: 1, uses: fight, target: allies, range: near, do: [{ buff: { to: attack, value: 1, rounds: 3 } }, { cure: { name: frightened } }] } }] }

    - id: runecaster
      name: Runecaster
      text: "Runes of drowned Aldmar: wards, bindings and curses."
      key: resolve
      hp: 6
      trained: [lore, insight, intimidation]
      armour: light
      proficiency: { attack: [1, 9], class_dc: [1, 5, 9], defence: [1, 5, 9] }
      gear: { staff: 1, sealskin_jerkin: 1 }
      keeps_range: true
      core:
        id: charm
        name: Charm
        text: A short charm that binds a spirit or slows a foe.
        effects: [{ ability: { actions: 2, uses: at_will, target: enemy, range: far, do: [{ damage: { dice: 2d8, save: will } }, { condition: { name: slowed, rounds: 1, save: will } }] } }]
      trees:
        - id: ward
          name: Ward
          talents:
            - { id: warding_word, name: Warding Word, text: "+2 defence for you or an ally.", effects: [{ ability: { actions: 1, uses: at_will, target: ally, range: near, do: [{ buff: { to: defence, value: 2, rounds: 3 } }] } }] }
            - { id: iron_word, name: Iron Word, text: "+2 Will.", effects: [{ bonus: { to: 'save:will', value: 2 } }] }
            - { id: circle_of_salt, name: Circle of Salt, text: "Everyone near you is harder to hit.", effects: [{ ability: { actions: 2, uses: fight, target: allies, range: near, do: [{ buff: { to: defence, value: 1, rounds: 3 } }] } }] }
            - { id: spirit_ward, name: Spirit Ward, text: "+3 defence against spirits.", effects: [{ bonus: { to: defence, value: 3, when: vs_spirit } }] }
        - id: binding
          name: Binding
          talents:
            - { id: word_of_binding, name: Word of Binding, text: "Hold a foe fast.", effects: [{ ability: { actions: 2, uses: fight, target: enemy, range: near, do: [{ condition: { name: grabbed, save: will } }] } }] }
            - { id: true_names, name: True Names, text: "+2 Lore; the name of a thing is power.", effects: [{ bonus: { to: 'skill:lore', value: 2 } }] }
            - { id: chains_of_speech, name: Chains of Speech, text: "Two foes slowed.", effects: [{ ability: { actions: 2, uses: fight, target: enemies, range: near, do: [{ condition: { name: slowed, rounds: 1, save: will } }] } }] }
            - { id: banishment, name: Banishment, text: "Send a spirit back where it came from.", effects: [{ ability: { actions: 3, uses: fight, target: enemy, range: near, do: [{ damage: { dice: 6d6, save: will } }] } }] }
        - id: curse
          name: Curse
          talents:
            - { id: evil_eye, name: Evil Eye, text: "Bad luck on a foe.", effects: [{ ability: { actions: 1, uses: at_will, target: enemy, range: far, do: [{ condition: { name: frightened, value: 1, save: will } }] } }] }
            - { id: withering_word, name: Withering Word, text: "Words that burn like frost.", effects: [{ ability: { actions: 2, uses: at_will, target: enemy, range: far, do: [{ damage: { dice: 2d6, save: will } }] } }] }
            - { id: black_tongue, name: Black Tongue, text: "+2 Intimidation.", effects: [{ bonus: { to: 'skill:intimidation', value: 2 } }] }
            - { id: doom, name: Doom, text: "A curse that bites deep.", effects: [{ ability: { actions: 2, uses: fight, target: enemy, range: far, do: [{ damage: { dice: 4d6, save: will } }, { condition: { name: frightened, value: 2 } }] } }] }

    - id: tidecaller
      name: Tidecaller
      text: "A keeper of the Tidemother's rites: water that heals, and a voice the drowned obey."
      key: resolve
      hp: 8
      trained: [medicine, lore, persuasion]
      armour: medium
      proficiency: { attack: [1, 7], class_dc: [1, 5, 9], defence: [1, 7] }
      gear: { iron_hook: 1, scale_vest: 1, conch: 1 }
      core:
        id: tides_blessing
        name: "Tide's Blessing"
