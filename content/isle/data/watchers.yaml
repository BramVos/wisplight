# Watchers of Skerrow (design: signalen en nasleep). A new kind of event is a
# watcher here and an aftermath in aftermath.yaml, not code. Skerrow had none
# until M10.3; these are what conversations that go on in the world need.

watchers:
  # Someone hears the stranger was asking after them (M10.3): they may go and find out why.
  - id: asked_about
    signal: asked_about
    belief: { key: asked_about }

  # Warm towards the stranger for three days, with something shared (M10.3): a friend.
  - id: befriended
    signal: befriended
    probe: { befriended: 3 }

  # Skerrow mourns (M10.7): a death on the island, $a the dead.
  - id: death
    signal: death
    fact: { kind: death }
    who: [$about]

  # Lost to the sea, or otherwise gone without a body to bury (M10.7): a memorial, no burial.
  - id: lost
    signal: lost
    fact: { kind: missing }
    who: [$about]

  # Someone went away from the island for a while (M10.7): the empty place at the Kettle.
  - id: departure
    signal: departure
    fact: { kind: "aftermath:leave" }
    who: [$about]

  # M10.14: good news has an aftermath too. The Lamp of Skerrow burns again.
  - id: lamp_lit
    signal: lamp_lit
    fact: { kind: lamp_lit }

  # The pulse (M10.24): never by themselves. When the stranger has had nothing new
  # near them for days, the rule sets one of these off where they are: Tamsin comes
  # down from the heights, a sail is seen, someone near has an errand.
  - id: pulse_tamsin
    signal: pulse_tamsin
    probe: { pulse: visitor }

  - id: pulse_sail
    signal: pulse_sail
    probe: { pulse: tiding }

  - id: pulse_errand
    signal: pulse_errand
    probe: { pulse: request }
