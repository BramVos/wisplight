# Schedules on Skerrow. The first block that matches the time wins.
# Activities: sleep, work, eat, socialize, pray, free, home.

professions:
  - id: innkeeper
    name: innkeeper
    schedule:
      - { from: "06:30", to: "07:00", activity: eat }
      - { from: "12:30", to: "13:00", activity: eat }
      - { from: "18:30", to: "19:00", activity: eat }
      - { from: "07:00", to: "23:00", activity: work }
      - { from: "23:00", to: "06:30", activity: sleep }

  - id: fisher
    name: fisher
    teaches: watercraft
    daily_goals:
      - { type: Produce, item: salt_fish, service: fish_rack }
    schedule:
      - { from: "04:30", to: "05:00", activity: eat }
      - { from: "05:00", to: "12:00", activity: work }
      - { from: "12:00", to: "13:00", activity: eat }
      - { from: "13:00", to: "17:00", activity: work }
      - { from: "18:00", to: "19:00", activity: eat }
      - { from: "19:00", to: "21:30", activity: socialize }
      - { from: "21:30", to: "04:30", activity: sleep }

  - id: boatman
    name: boatman
    teaches: watercraft
    schedule:
      - { from: "06:00", to: "06:30", activity: eat }
      - { from: "06:30", to: "12:00", activity: work }
      - { from: "12:00", to: "13:00", activity: eat }
      - { from: "13:00", to: "18:00", activity: work }
      - { from: "18:00", to: "19:00", activity: eat }
      - { from: "19:00", to: "21:30", activity: socialize }
      - { from: "21:30", to: "06:00", activity: sleep }

  - id: child
    name: child
    schedule:
      - { from: "07:00", to: "08:00", activity: eat }
      - { from: "12:00", to: "13:00", activity: eat }
      - { from: "18:00", to: "19:00", activity: eat }
      - { from: "19:00", to: "20:00", activity: home }
      - { from: "20:00", to: "07:00", activity: sleep }

  - id: hedge_witch
    name: hedge-witch
    teaches: medicine
    schedule:
      - { from: "06:00", to: "07:00", activity: pray, at: loc_skerrow_silver_grove }
      - { from: "07:00", to: "07:30", activity: eat }
      - { from: "07:30", to: "12:00", activity: work }
      - { from: "12:00", to: "13:00", activity: eat }
      - { from: "13:00", to: "17:00", activity: work }
      - { from: "18:00", to: "19:00", activity: eat }
      - { from: "19:00", to: "21:00", activity: home }
      - { from: "21:00", to: "06:00", activity: sleep }

  - id: scholar
    name: scholar
    teaches: lore
    schedule:
      - { from: "08:00", to: "08:30", activity: eat }
      - { from: "08:30", to: "13:00", activity: work }
      - { from: "13:00", to: "13:30", activity: eat }
      - { from: "13:30", to: "19:00", activity: work }
      - { from: "19:00", to: "19:30", activity: eat }
      # Once a week she comes down to the Hythe, and says it is for the ale.
      - { from: "19:30", to: "21:30", activity: socialize, days: [Fireday] }
      - { from: "19:30", to: "23:30", activity: work }
      - { from: "23:30", to: "08:00", activity: sleep }

  - id: lightkeeper
    name: lightkeeper
    schedule:
      - { from: "09:30", to: "10:00", activity: eat }
      - { from: "10:00", to: "14:00", activity: work }
      - { from: "14:00", to: "15:00", activity: eat }
      - { from: "17:00", to: "23:00", activity: socialize }
      - { from: "23:00", to: "09:30", activity: sleep }
