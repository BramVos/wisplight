# The three parts of Skerrow. The island has no map drawing of its own: you
# get about by the exits between places.

areas:
  - id: skerrow_hythe
    name: Skerrow Hythe
    kind: hamlet
    sound: { kind: sea, level: 0.45 }
    aliases: [the hythe, hythe, the hamlet, the village]
    fame: 2
    summary: The only hamlet on Skerrow, a dozen stone cottages round a little harbour, with the Salt Kettle for an inn.
    pos: [2.31, 2.22]

  - id: skerrow_shore
    name: the Shore
    kind: wilderness
    sound: { kind: surf, level: 0.55 }
    aliases: [the shore, the strand, south shore]
    fame: 1
    summary: The rocky south shore of Skerrow, where the currents throw up whatever the sea breaks.
    pos: [1.56, 1.59]

  - id: skerrow_heights
    name: the Heights
    kind: wilderness
    sound: { kind: wind, level: 0.55 }
    aliases: [the heights, the uplands, the high ground]
    fame: 1
    summary: The high ground of Skerrow, with the silver grove, the wyrm's barrow, the beacon and the old tower.
    # A storm at night on the Heights (M10.17): every step there is turned back until it blows over or day comes.
    barred:
      - when: [{ night: true }, { weather: storm }]
        text: The storm comes over the Heights in the dark so hard you cannot stand in it. You crouch against the rocks until it lets you go, back where you started.
    pos: [1.56, 3.16]

  # The open island between the places (M10.20): the wild of the region map.
  - id: skerrow
    name: Skerrow
    kind: wilderness
    aliases: [the island, skerrow]
    summary: The open island between the hamlet, the shore and the heights, salt grass and heather and cliff, with the sea all round.
    pos: [2, 3]
