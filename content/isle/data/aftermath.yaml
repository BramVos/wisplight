# The standard aftermath of Skerrow (design: signalen en nasleep): what follows
# a signal by the rules, always, also without AI. The people of the signal are
# $a and $b, its place $place, its claim $subject and $value. Since M10.3.

aftermath:
  # Heard that the stranger was asking after them (M10.3): the one it was about goes to find the stranger.
  - id: asked_about
    signal: asked_about
    about: first
    topic: asked_about
    expires: 2
    steps:
      - id: seek
        when: [{ same: [$a, $subject] }]
        do: { seek_player: $a, line: "You were asking after me. What do you want?", hours: 24 }

  # Someone needs something and thinks well of the stranger (M10.3): they go and find the stranger to ask.
  - id: request_open
    signal: request_open
    about: first
    topic: request
    expires: 1
    steps:
      - id: seek
        when: [{ attitude: $a, at_least: Friendly }]
        do: { seek_player: $a, line: "There you are. There's something I'd ask of you.", hours: 24 }

  # A friend of the stranger (M10.3): a tie, told as news, and a warmer greeting from now on.
  - id: befriended
    signal: befriended
    about: first
    topic: friendship
    expires: 1
    steps:
      - id: tie
        do: { set_tie: [$a, player], role: friend, bond: 2 }
      - id: mind
        do: { thought: $a, text: "The stranger is a friend of yours now.", days: 14 }

  # The stranger gave back or paid for what they took (M10.3): it makes up for some of it,
  # less when they were caught or found out first than when they came of their own accord.
  - id: theft_mended_own
    signal: theft_mended
    event: own_accord
    about: first
    topic: theft
    expires: 1
    steps:
      - id: regard
        do: { regard: [$a], to: player, affinity: 8 }
      - id: mind
        do: { thought: $a, text: "The stranger came back of their own accord and made it right. That counts for something.", days: 7 }

  - id: theft_mended_caught
    signal: theft_mended
    event: after_caught
    about: first
    topic: theft
    expires: 1
    steps:
      - id: regard
        do: { regard: [$a], to: player, affinity: 2 }
      - id: mind
        do: { thought: $a, text: "The stranger made it right, but only once they were caught.", days: 7 }

  # The stranger did not keep their word (M10.3): the one let down minds it, and the village hears of it.
  - id: broken_promise
    signal: broken_promise
    about: first
    topic: promise
    expires: 1
    steps:
      - id: word
        do:
          tell:
            kind: broken_promise
            about: [$a]
            place: $place
            belang: 2
            title: "the stranger's broken word to {a}"
            precise: "The stranger gave {a} their word to {value}, and never did."
            village: "Don't count on that stranger's word. Ask {a}."
            far: "A stranger who does not keep their word."
      - id: mind
        do: { thought: $a, text: "The stranger gave you their word, and it was worth nothing.", days: 7 }

  # The stranger kept their word (M10.3): a small thing, and people hear it.
  - id: promise_kept
    signal: promise_kept
    about: first
    topic: promise
    expires: 1
    steps:
      - id: word
        do:
          tell:
            kind: promise_kept
            about: [$a]
            place: $place
            belang: 1
            title: "the stranger keeping their word to {a}"
            precise: "The stranger gave {a} their word to {value}, and did."
            village: "That stranger keeps their word, {a} says."
            far: "A stranger who keeps their word."


  # The stranger made good a word they had broken (M10.14): done late, or paid for. Whom it was for
  # thinks better of it; the village hears that it came right in the end.
  - id: made_good
    signal: made_good
    about: first
    topic: promise
    expires: 1
    steps:
      - id: regard
        do: { regard: [$a], to: player, affinity: 3 }
      - id: word
        do:
          tell:
            kind: made_good
            about: [$a]
            place: $place
            belang: 1
            title: "the stranger making good their word to {a}"
            precise: "The stranger let {a} down over {value}, and made it good after all."
            village: "The stranger came back and set it right with {a}. Late, but they did."
            far: "A stranger who makes good what they owe."

  # The stranger reached a rank in a craft (M10.5): someone of the trade near takes note,
  # thinks better of them, and has it on their mind: a signal for the brain to work with.
  - id: craft_rank
    signal: craft_rank
    about: first
    topic: craft
    expires: 1
    steps:
      - id: regard
        do: { regard: [$a], to: player, affinity: 5 }
      - id: mind
        do: { thought: $a, text: "The stranger is {value} now. There may be work in that, or trouble.", days: 14 }

  # Skerrow mourns (M10.7, the drowning in the playtest of 28 September 2026). A death: Maren keeps the empty
  # place at the Kettle in mind for a week; the day after, the island gives the dead back to the Tidemother on
  # the headland, and whoever knew them comes, the grieving too; a cairn stays there with their name; and that
  # night the Kettle sings for them. Grief itself (home for a day, no feasts for a week) is the same as in every world.
  - id: death
    signal: death
    about: first
    topic: death
    expires: 3
    steps:
      - id: empty_place
        do: { thought: npc_maren, text: "{a}'s place by the fire is empty. You keep looking at it, and you say so to whoever sits down there.", days: 7 }
      - id: empty_stool
        do: { mark: loc_skerrow_salt_kettle, text: "A stool by the fire stands empty, and nobody sits on it; a cup is turned upside down on it for {a}.", days: 7 }
      # The mood of the hythe (M10.11): quiet for a few days, and grey on the map.
      - id: quiet
        do: { mood: loc_skerrow_salt_kettle, kind: grief, days: 3, line: "The harbour is quiet; people speak low, and nobody sings at the nets.", prompt: "Someone of the island has died; people speak low and think of the dead." }
      - id: announce
        do:
          tell:
            kind: burial
            about: [$a]
            place: { home_of: $a }
            belang: 2
            title: "{a} to be given back to the Tidemother"
            precise: "{a} goes back to the Tidemother tomorrow afternoon, from the headland at the ebb. Everyone is to come."
            village: "They're giving {a} back to the Tidemother tomorrow afternoon, up on the headland. Everyone's going."
            far: "Someone on Skerrow is to be buried."
      - id: burial
        at: { days: 1, hour: 15 }
        do: { feast: loc_skerrow_headland, kind: burial, hours: 2, guests: [{ family_of: $a }, { household_of: $a }, { neighbours_of: $a }] }
      - id: buried
        after: burial
        wait: 2
        do:
          tell:
            kind: burial
            about: [$a]
            place: loc_skerrow_headland
            belang: 2
            title: "the burial of {a}"
            precise: "The island gave {a} back to the Tidemother from the headland at the ebb, and everyone who could walk came up to see it done."
            village: "We gave {a} back to the Tidemother on the headland. The whole island came."
            far: "Someone was buried on Skerrow."
      - id: cairn
        after: burial
        wait: 2
        do: { mark: loc_skerrow_headland, text: "Among the old cairns at the cliff edge stands a new one of grey stones, with {a}'s name scratched on a slate." }
      - id: song
        after: burial
        wait: 5
        do:
          tell:
            kind: mourning
            about: [$a, npc_maren]
            place: loc_skerrow_salt_kettle
            belang: 1
            title: "a song for {a} at the Salt Kettle"
            precise: "That night at the Salt Kettle they sang the old ebb song for {a}, and Maren poured the first cup into the fire."
            village: "They sang for {a} at the Kettle last night. Maren poured a cup into the fire."
            far: "An island sang for its dead."

  # Lost with no body to bury (M10.7): a name on the harbour wall, and the empty place at the Kettle.
  - id: lost
    signal: lost
    about: first
    topic: death
    expires: 2
    steps:
      - id: empty_place
        do: { thought: npc_maren, text: "{a} is lost, and there is nothing to bury. The place by the fire stays empty.", days: 7 }
      - id: empty_stool
        do: { mark: loc_skerrow_salt_kettle, text: "A stool by the fire stands empty, and nobody sits on it; a cup is turned upside down on it for {a}.", days: 7 }
      # The mood of the hythe (M10.11): quiet for a few days, and grey on the map.
      - id: quiet
        do: { mood: loc_skerrow_salt_kettle, kind: grief, days: 3, line: "The harbour is quiet; people speak low, and nobody sings at the nets.", prompt: "Someone of the island has died; people speak low and think of the dead." }
      - id: name
        at: { days: 1, hour: 15 }
        do: { mark: loc_skerrow_harbour, text: "Someone has scratched {a}'s name into the harbour wall, low down, where the spray keeps it wet." }

  # Gone away for a while (M10.7): the Kettle is quieter, and Maren says so for a week.
  - id: departure
    signal: departure
    about: first
    topic: departure
    expires: 1
    steps:
      - id: empty_place
        when: [{ not: { same: [$a, npc_maren] } }]
        do: { thought: npc_maren, text: "{a} has gone off the island, and the Kettle is quieter for it. You mention it to anyone who asks.", days: 7 }
