# The standard aftermath of Skerrow (design: signalen en nasleep): what follows
# a signal by the rules, always, also without AI. The people of the signal are
# $a and $b, its place $place, its claim $subject and $value. Since M10.3.

aftermath:
  # Heard that the stranger was asking after them (M10.3): the one it was about goes to find the stranger.
  - id: asked_about
    signal: asked_about
    about: first
    topic: asked_about
    expires: 2
    steps:
      - id: seek
        when: [{ same: [$a, $subject] }]
        do: { seek_player: $a, line: "You were asking after me. What do you want?", hours: 24 }

  # Someone needs something and thinks well of the stranger (M10.3): they go and find the stranger to ask.
  - id: request_open
    signal: request_open
    about: first
    topic: request
    expires: 1
    steps:
      - id: seek
        when: [{ attitude: $a, at_least: Friendly }]
        do: { seek_player: $a, line: "There you are. There's something I'd ask of you.", hours: 24 }

  # The stranger did not keep their word (M10.3): the one let down minds it, and the village hears of it.
  - id: broken_promise
    signal: broken_promise
    about: first
    topic: promise
    expires: 1
    steps:
      - id: word
        do:
          tell:
            kind: broken_promise
            about: [$a]
            place: $place
            belang: 2
            title: "the stranger's broken word to {a}"
            precise: "The stranger gave {a} their word to {value}, and never did."
            village: "Don't count on that stranger's word. Ask {a}."
            far: "A stranger who does not keep their word."
      - id: mind
        do: { thought: $a, text: "The stranger gave you their word, and it was worth nothing.", days: 7 }

  # The stranger kept their word (M10.3): a small thing, and people hear it.
  - id: promise_kept
    signal: promise_kept
    about: first
    topic: promise
    expires: 1
    steps:
      - id: word
        do:
          tell:
            kind: promise_kept
            about: [$a]
            place: $place
            belang: 1
            title: "the stranger keeping their word to {a}"
            precise: "The stranger gave {a} their word to {value}, and did."
            village: "That stranger keeps their word, {a} says."
            far: "A stranger who keeps their word."

