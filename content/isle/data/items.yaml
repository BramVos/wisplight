# Things on Skerrow. Prices are in copper pieces (1 sp = 10 cp, 1 gp = 100 cp).

items:
  - id: marens_key
    name: brass key
    aliases: [key, brass key]
    description: A small brass key, green at the edges, the kind that opens a strongbox.
    tags: [key]
    value: 2

  - id: knife
    name: knife
    description: A sailor's knife with a cork grip, the blade dulled by salt.
    aliases: [blade, sailor's knife]
    value: 12
    weapon: { damage: 1d4, light: true }

  - id: ship_biscuit
    name: ship's biscuit
    plural: ship's biscuits
    description: A square of ship's biscuit, hard enough to drive nails with.
    aliases: [biscuit, biscuits, hardtack]
    tags: [food]
    value: 2
    food: 20

  - id: salt_fish
    name: salt fish
    plural: salt fish
    description: A split and salted pollock, stiff as a board.
    aliases: [fish, pollock, dried fish]
    tags: [food]
    value: 4
    food: 35

  - id: fish_stew
    name: bowl of fish stew
    plural: bowls of fish stew
    description: Fish, kelp and barley stewed together, with a crust of bread to push it round with.
    aliases: [stew, fish stew, meal, hot meal, bowl]
    tags: [food]
    value: 8
    food: 60

  - id: ale
    name: mug of ale
    plural: mugs of ale
    description: Thin brown ale, brewed from the island's barley and tasting a little of the sea.
    aliases: [ale, beer, mug]
    tags: [drink]
    value: 3
    food: 5

  - id: sailcloth
    name: bolt of sailcloth
    plural: bolts of sailcloth
    description: A heavy bolt of tarred canvas from the Grey Gull's hold, wet but whole.
    aliases: [sailcloth, canvas, sail, cloth]
    value: 150

  - id: pitch
    name: pot of pitch
    plural: pots of pitch
    description: A clay pot of black pine pitch, for paying the seams of a boat.
    aliases: [pitch, tar, pot of tar]
    value: 20

  - id: lamp_oil
    name: cask of lamp oil
    plural: casks of lamp oil
    description: A small cask of seal oil, the kind the beacon burns. It smells like it.
    aliases: [oil, lamp oil, cask, seal oil]
    value: 30

  - id: rope
    name: coil of rope
    plural: coils of rope
    description: A coil of good hemp rope, still wet from the sea.
    aliases: [rope, cordage, line]
    value: 10

  - id: rune_key
    name: rune key
    description: A key of black stone as long as your hand, cut with runes that are warm to the touch.
    aliases: [key, stone key, black key]
    value: 0

  - id: kelp_salve
    name: pot of kelp salve
    plural: pots of kelp salve
    description: Tamsin's salve of kelp, honey and something green. It stings, then it doesn't.
    aliases: [salve, ointment]
    value: 15
    remedy: { heal: 1d8, cures: [bleeding, sickened] }

  # M9.1: what Skerrow's own counters are made of.
  - id: heather
    name: bundle of heather
    plural: bundles of heather
    aliases: [heather]
    description: Tough purple heather from the Heights, for the Salt Kettle's ale.
    value: 1

  - id: kelp
    name: armful of kelp
    plural: armfuls of kelp
    aliases: [kelp, seaweed]
    description: Brown kelp from the strand, slick and smelling of the sea.
    value: 1

  # Weapons and armour (M9.1): the numbers of the Nethermarch's, in the island's
  # own shapes. Damage is the weapon die; Might adds to it for weapons used up close.

  - id: spear
    name: fishing spear
    plural: fishing spears
    description: An ash shaft with a barbed iron head, short enough to use with a shield.
    aliases: [spear]
    tags: [weapon]
    value: 16
    weapon: { damage: 1d6, crit: push, iron: true }

  - id: iron_hook
    name: iron boat-hook
    plural: iron boat-hooks
    description: A short, heavy boat-hook of black iron, the kind the Tidemother's keepers carry.
    aliases: [hook, boat-hook, boathook]
    tags: [weapon]
    value: 24
    weapon: { damage: 1d6, crit: prone, iron: true }

  - id: staff
    name: driftwood staff
    plural: driftwood staffs
    description: A staff of pale driftwood, worn smooth by the sea and then by a hand.
    aliases: [staff, stave, stick]
    tags: [weapon]
    value: 1
    weapon: { damage: 1d6, two_hands: true, crit: prone }

  - id: longbow
    name: yew bow
    plural: yew bows
    description: A tall bow of the old sea-watch, strung with gut, and a quiver of gull-feathered arrows.
    aliases: [bow, longbow]
    tags: [weapon]
    value: 50
    weapon: { damage: 1d8, kind: ranged, two_hands: true, range: far }

  - id: cutlass
    name: cutlass
    plural: cutlasses
    description: A short, broad sailor's sword with a basket guard gone green.
    aliases: [sword, short sword]
    tags: [weapon]
    value: 30
    weapon: { damage: 1d6, light: true, crit: bleeding, iron: true }

  - id: quilted_coat
    name: quilted coat
    plural: quilted coats
    description: A coat of quilted sailcloth stuffed with fleece, warm and dull-coloured.
    aliases: [coat, gambeson]
    tags: [armour]
    value: 10
    armour: { kind: light, defence: 1, cap: 4 }

  - id: sealskin_jerkin
    name: sealskin jerkin
    plural: sealskin jerkins
    description: A jerkin of oiled sealskin, stiff at the shoulders and smelling of the sea.
    aliases: [jerkin, sealskin]
    tags: [armour]
    value: 20
    armour: { kind: light, defence: 2, cap: 3 }

  - id: scale_vest
    name: scale vest
    plural: scale vests
    description: Small plates of iron riveted inside a canvas vest, from some drowned ship's stores.
    aliases: [scales, vest]
    tags: [armour, iron]
    value: 60
    armour: { kind: medium, defence: 3, cap: 2 }

  - id: ring_shirt
    name: ring shirt
    plural: ring shirts
    description: A shirt of riveted rings, greased against the salt.
    aliases: [mail, chain, chain shirt]
    tags: [armour, iron]
    value: 100
    armour: { kind: heavy, defence: 4, cap: 1 }

  - id: round_shield
    name: round shield
    plural: round shields
    description: A round shield of limewood with an iron boss and a painted gull.
    aliases: [shield]
    tags: [armour]
    value: 16
    armour: { kind: shield, defence: 2 }

  - id: conch
    name: great conch
    plural: great conchs
    description: A spiral shell as long as your forearm; blown, it sounds like the tide turning.
    aliases: [conch, shell, horn]
    tags: [tool]
    value: 5

  # M10.5: what a chest the chronicler places may hold.
  - id: diary
    name: diary
    plural: diaries
    aliases: [diary, journal book, dagboek, notebook]
    description: A small book bound in worn leather, the pages full of a cramped private hand. Whose it is, it says inside the cover.
    tags: [paper]
    value: 2

  - id: letters
    name: bundle of letters
    plural: bundles of letters
    aliases: [letters, bundle, brieven]
    description: Letters folded small and tied with a string, the seals broken long ago.
    tags: [paper]
    value: 1
