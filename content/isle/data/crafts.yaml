# Crafts of Skerrow (M10.5): learnt by doing and from someone of the trade.
# Fishing with Wenna's coracle, and salve-making at Tamsin's hearth.

crafts:
  - id: fishing
    name: fishing
    maker: fisher
    skill: watercraft
    professions: [fisher, boatman]
    techniques:
      - { id: hand_lines, name: hand lines }
    # What a bad day on the water leaves (M10.14): small fry; a very bad one tears the coracle's hide.
    failure:
      outcome: poor
      item: small_fry
      why: "You fished in the lee of the wall, where the gulls have had the best of it. Go out past the second rock, where the water turns green."
      critical: damaged

  - id: salve_making
    name: salve-making
    maker: salve-maker
    skill: medicine
    professions: [hedge_witch]
    techniques:
      - { id: kelp_salve, name: kelp salve }
    failure:
      outcome: poor
      item: thin_salve
      why: "You let it boil. Salve wants a slow heat, or the kelp gives up nothing but slime."
    # The hearth needs rest after too many spoilt pots (M10.29, crafts.fail_cooldown in world.yaml).
    cooldown_text: The pot has scorched black and the hearth is too hot. Let the fire die down before you try again.
