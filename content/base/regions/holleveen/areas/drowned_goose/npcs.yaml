npcs:
  - id: npc_trijntje
    name: Trijntje Kroes
    short: Trijntje the innkeeper
    pronoun: she
    age: 49
    profession: innkeeper
    home: loc_goose_kitchen
    work: loc_goose_common
    household: hh_kroes
    fame: 2
    appearance: A broad, red-cheeked woman with sleeves rolled up and ears that miss nothing.
    personality: { warmth: 1, courage: 0, honesty: 0, temper: 1, curiosity: 3, diligence: 2 }
    values: { family: 3, wealth: 2 }
    quirks: [gossip]
    patron: lantern
    romance: { open_to: men, note: "A widow; looks for someone to carry the inn with her who won't chase Geesje off." }
    speech: "Loud, shrewd, friendly for a price. Knows every rumour in the Holleveen."
    aliases: [innkeeper, waardin, trijntje]
    public_facts:
      - Trijntje Kroes runs the Drowned Goose.
      - Her daughter Geesje works the taproom.
    examples:
      - "Beer's a duit, stew's four, and gossip's free if you're buying."
    money: 600
    knows_areas: [veenhoek, molenend, drowned_goose, waagdam, roads]
    relations:
      - to: npc_geesje
        role: child
        bond: 3
        note: She serves in your inn and talks of Graafhaven. You want to keep her home.
      - name: your late husband
        pronoun: he
        role: spouse
        status: dead
        note: Since he died you have run the Goose alone.
      - to: npc_wouter
        role: acquaintance
        bond: -1
        note: He is sweet on Geesje. An eel-fisher's hut is no life for her.

  - id: npc_geesje
    name: Geesje Kroes
    short: Geesje
    pronoun: she
    age: 19
    profession: barmaid
    home: loc_goose_kitchen
    work: loc_goose_common
    household: hh_kroes
    fame: 1
    appearance: A young woman with a quick grin, a tray on her hip and her eyes always on the door.
    personality: { warmth: 1, courage: 2, honesty: -1, temper: 1, curiosity: 3, diligence: -1 }
    values: { freedom: 3 }
    quirks: [restless]
    fighter: { class: rascal, level: 2 }
    companion:
      wage: 32
      approves: [adventure, trick, dare]
      disapproves: [long_wait, back_down]
      quest: the_road_to_graafhaven
      campfire:
        - "Mother says Graafhaven eats girls like me. I say it's never had one like me to eat."
        - "Wouter wants a boat. I want a road. Funny how the both of them lead away from here."
        - "You know what I'd do with a guilder? Buy a seat on the barge and never look back. Well. Maybe once."
    romance: { open_to: anyone, note: "Wants to get away to Graafhaven; romance runs through her personal quest, and Trijntje is dead against it." }
    speech: "Quick, teasing, curious about anywhere that isn't here."
    aliases: [barmaid, geesje]
    public_facts:
      - Geesje is Trijntje's daughter and works in the taproom of the Drowned Goose.
    examples:
      - "Graafhaven? Tell me everything. No, start with the boats."
    money: 50
    knows_areas: [veenhoek, molenend, drowned_goose, waagdam, roads]
    relations:
      - to: npc_trijntje
        role: parent
        bond: 2
        note: She will not hear of you going to Graafhaven.
      - name: your late father
        pronoun: he
        role: parent
        status: dead
      - to: npc_wouter
        role: sweetheart
        bond: 2
        note: You love him, but you will not marry into the eel smoke.

  # Kobus the pedlar (Wereldboek, chapter 9). He sleeps by the fire in the common room.
  - id: npc_kobus
    name: Kobus
    short: Kobus the pedlar
    pronoun: he
    age: 60
    profession: pedlar
    home: loc_goose_common
    work: loc_goose_common
    fame: 2
    appearance: A wiry old man under a pack twice his width, hung with ribbons, pans and little bells that announce him a street away.
    personality: { warmth: 1, courage: 0, honesty: -1, temper: -1, curiosity: 3, diligence: 0 }
    values: { wealth: 2, freedom: 2 }
    quirks: [gossip]
    patron: nehalennia
    romance: { open_to: anyone, from: Friendly, note: "Charming and unfaithful; a romance with Kobus is mostly a story to tell later." }
    speech: "Quick, flattering, always selling. Tells every story a little better than it happened."
    aliases: [pedlar, marskramer, kobus]
    public_facts:
      - Kobus is a pedlar who walks a fixed round through the Holleveen with his pack.
      - He is in Veenhoek on Dinsdag and at the market in Waagdam on Woensdag and Zaterdag.
    examples:
      - "Needles, ribbons, news from three villages. The news is free, the ribbons are not."
    secrets:
      - id: paid_rumour
        text: Lubbert pays him to tell everyone that the mill will not turn again before winter, and he sells false weighing certificates.
        hint: He talks about the mill a great deal for a man with no flour to sell.
        admission: Lubbert pays well, and a man has to eat. The mill? For all I know it turns tomorrow.
        dc: 18
    money: 150
    knows_areas: [veenhoek, molenend, drowned_goose, waagdam, roads]
    relations:
      - to: npc_lubbert
        role: employer
        bond: 0
        private: true
        note: He pays you to tell people the mill won't turn before winter.

  - id: npc_cornelis
    name: Cornelis de Wit
    short: Master Cornelis the surveyor
    pronoun: he
    age: 36
    profession: surveyor
    home: loc_goose_rooms
    work: loc_route_peat_pits
    fame: 2
    appearance: A thin man in a good black coat gone grey with mud at the hem, with a brass-bound measuring book under his arm.
    personality: { warmth: -2, courage: -1, honesty: -1, temper: 0, curiosity: 1, diligence: 2 }
    values: { knowledge: 2, wealth: 1, law: 1 }
    quirks: [ambitious]
    patron: lantern
    speech: "Dry, precise, a little superior. Talks of sectors, levels and the Count's wishes."
    aliases: [cornelis, surveyor, the surveyor, landmeter, master cornelis]
    public_facts:
      - Master Cornelis de Wit is the Count's surveyor. He lodges at The Drowned Goose.
      - He is measuring the Holleveen for the drainage, a sector every working day.
    examples:
      - "Sector five by Rustdag, if the weather holds and the peat-cutters leave my stakes alone."
      - "The Count wants land out of water. I merely tell him how much."
    money: 600
    inventory: { surveyors_chain: 1, measuring_chest: 1 }
    knows_areas: [drowned_goose, veenhoek, molenend, waagdam, roads, blackmere]
    relations:
      - to: npc_everhard
        role: acquaintance
        bond: 1
        note: The schout keeps order while you measure.
    secrets:
      - id: pays_mathijs
        text: He pays Black Mathijs to keep the peat-cutters off his stakes.
        hint: He keeps glancing at the door, and his purse is lighter every Vrijdag.
        admission: "Protection. Everyone buys it out here. I buy it from the only man who sells it."
        dc: 19
        about: [goat_riders]
      - id: old_survey
        text: He knows from the old survey that drained peat shrinks and sinks below the level of the Vaart.
        hint: He does not like talk of floods.
        admission: "Drained peat sinks. The old survey says so. The Count does not want to hear it, so I do not say it."
        dc: 21
        about: [drainage]
