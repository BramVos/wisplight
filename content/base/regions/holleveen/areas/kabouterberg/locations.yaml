# The Kabouterberg (Wereldboek, chapter 7). Taboo: you leave milk, you do not dig.
locations:
  - id: loc_kabouterberg
    name: The Kabouterberg
    area: kabouterberg
    # M10.16: acts the rules do not know may be improvised here. Milk and bread for the kabouters: they notice.
    improvise:
      domain: offering
      may:
        - { standing: kabouters }
        - { condition: [cursed] }
        - { fact: true }
      fallback: The hill keeps its silence. Whatever you meant by it, the kabouters keep their own counsel.
      takes: true
    tags: [fae, landmark, edge]
    aliases: [kabouter hill, the hill]
    summary: A sandy hill with an old oak and a hollow in it, where people leave milk for the kabouters.
    description:
      day: |
        A low hill of pale sand rises out of the fields, crowned by an oak
        older than anyone's grandfather. Between its roots a hollow opens into
        the hill, and someone has left a bowl of milk at its mouth. It is very
        quiet here; even the wind seems to go round. Veenhoek lies north-east
        across the fields.
    exits:
      up: { to: loc_kabouterberg_oak, minutes: 2 }
      northeast: { to: loc_route_crossroads, minutes: 30 }
    details:
      - words: [oak, old oak, tree]
        look: The oak is broad and low, older than anyone's grandfather, and its roots grip the top of the hill. From down here you can just see the pale bowl between them. UP takes you to it.
        verbs:
          climb: You set a foot on a low root and think better of it. Whatever lives under this tree was here long before you.
      - words: [hollow, hole, mouth]
        look: The hollow opens between the roots of the oak, up on the hilltop, a dark mouth in the pale sand no higher than your knee. To see more you would have to go UP to the oak, and IN.
        verbs:
          dig: You kneel and put your hands to the sand, and stop. Nobody digs in the Kabouterberg; anyone in Veenhoek could tell you why.
      - words: [bowl, milk, bowl of milk]
        look: A wooden bowl of milk at the mouth of the hollow, full to the brim. Someone from Veenhoek put it there for the kabouters, and for nobody else.
        take: You leave the bowl where it is. It was put there for the kabouters, not for you.
        verbs:
          drink: You bend over the bowl, and the whole hill seems to hold its breath. You straighten up again. That milk is not yours to drink.
          leave: The bowl is full already. Milk for the kabouters goes out once a night, after dark, by whoever brings it.
      - words: [sand, hill]
        look: Pale, fine sand, dry even after rain. It has been swept smooth round the bowl, and there are no footprints in it but yours.
        verbs:
          dig: You kneel and put your hands to the sand, and stop. Nobody digs in the Kabouterberg; anyone in Veenhoek could tell you why.
    arrival:
      text: The pale hill rises out of the fields like the back of something asleep, and the old oak on top holds the sky in its branches. You find yourself walking more quietly as you climb, and the wind seems to go round you.
      mist: The oak comes out of the mist before the hill does, a black shape with its arms out, and for a moment you would swear it moved. Then the pale sand is under your feet, and it is very quiet.
      night: In the dark the hill is only a hump against the stars, and the oak a deeper black on top of it. Something small rustles away from the milk bowl as you come.
      far: Across the fields a low pale hill rises with a single great oak on top, alone and very old. Even from here it looks like a place where you ask leave before you go in.

  - id: loc_kabouterberg_oak
    name: The Old Oak
    area: kabouterberg
    # M10.16: acts the rules do not know may be improvised here. Milk and bread for the kabouters: they notice.
    improvise:
      domain: offering
      may:
        - { standing: kabouters }
        - { condition: [cursed] }
        - { fact: true }
      fallback: The hill keeps its silence. Whatever you meant by it, the kabouters keep their own counsel.
      takes: true
    tags: [fae]
    aliases: [old oak, oak, milk place, milk bowl]
    summary: The old oak on top of the Kabouterberg, with the milk place between its roots.
    description:
      day: |
        The oak is broad and low, its lower branches bent almost to the sand,
        and its roots grip the hilltop like fingers. Between two of them lies
        a flat stone with a wooden bowl on it, and the milk in the bowl is
        fresh. Overhead the leaves hiss in a wind you cannot feel down here,
        and the sand round the bowl has been swept smooth. The hollow opens
        under the roots; the slope runs down to the foot of the hill.
      night: |
        The oak is a great black shape against the sky, and the bowl between
        its roots shows pale. Now and then a small sound comes from the
        hollow, like a spoon against a pot, and stops. You have the feeling
        that you should not look too closely. The slope runs down behind you.
    exits:
      down: { to: loc_kabouterberg, minutes: 2 }
      in: { to: loc_kabouterberg_hollow }
    details:
      - words: [bowl, milk, wooden bowl, bowl of milk]
        look: A wooden bowl, worn smooth by many hands, with fresh milk in it to the brim. Not a drop has been spilt on the stone.
        take: You leave the bowl where it is. It was put there for the kabouters, not for you.
        verbs:
          drink: You bend over the bowl, and the leaves overhead go quiet. You straighten up again. That milk is not yours to drink.
      - words: [stone, flat stone]
        look: A flat grey stone, the only stone on the whole hill, set between two roots like a table. Its top is worn smooth where bowls have stood for longer than anyone remembers.
        take: The stone is set deep between the roots. It stays where it is.
      - words: [roots, root, oak, old oak, tree]
        look: The roots grip the hilltop like fingers, grey and smooth, and under them the hollow opens into the dark. IN takes you there.
        verbs:
          climb: The lowest branches bend almost to the sand, easy to climb. You look at the bowl, and at the hollow, and decide against it.
          set: The path under the oak would take a snare, if you had rope for one.
      - words: [leaves, branches, wind]
        look: The leaves hiss overhead in a wind you cannot feel down here, and the lowest branches bend almost to the sand.
        verbs:
          climb: The lowest branches bend almost to the sand, easy to climb. You look at the bowl, and at the hollow, and decide against it.
      - words: [sand]
        look: The sand round the bowl has been swept smooth, and in it are small marks, like the strokes of a very small broom.
        verbs:
          dig: You kneel and put your hands to the sand, and stop. Nobody digs in the Kabouterberg; anyone in Veenhoek could tell you why.

  - id: loc_kabouterberg_hollow
    name: The Hollow under the Oak
    area: kabouterberg
    tags: [fae, taboo]
    aliases: [hollow, the hollow]
    summary: A hollow in the sand under the roots of the old oak, where the kabouters are said to live.
    description:
      day: |
        You crouch into a hollow under the roots, where the sand is dry and
        cool and the light comes in green. Roots hang from the roof like
        ropes, and among them hangs a row of tiny tools: a hook, a knife no
        longer than your thumb, a spade. The air smells of earth and milk.
        Further in, the hollow narrows into a dark you could never fit
        through; the way out is back up into the light.
      night: |
        In the hollow it is pitch dark and oddly warm. You hear small feet
        somewhere further in, and a whisper that stops when you hold your
        breath. The way out is up, towards the lighter dark.
    exits:
      out: { to: loc_kabouterberg_oak }
    details:
      - words: [tools, tiny tools, hook, knife, spade]
        look: A hook, a knife no longer than your thumb and a spade the size of a spoon, hung in a neat row from the roots. They are sharp and clean and cared for, and they are not toys.
        take: Your hand stops short of the little knife. Taking a kabouter's tools from its own house is the kind of thing people in Veenhoek tell stories about, and not happy ones.
      - words: [roots, root]
        look: Roots hang from the roof like ropes, pale and hairy, and the sand between them is dry and cool.
      - words: [dark, further in]
        look: Further in, the hollow narrows into a dark no wider than a cat. Something moves in there, or the sand settles.
        verbs:
          dig: You kneel and put your hands to the sand, and stop. Nobody digs in the Kabouterberg, and least of all in here.
