npcs:
  - id: npc_harmen
    name: Harmen Molenaar
    short: Harmen the miller
    pronoun: he
    age: 55
    profession: miller
    home: loc_molenend_house
    work: loc_molenend_mill
    fame: 1
    appearance: A heavy man with a floury beard and small, careful eyes that keep counting things.
    personality: { warmth: -1, courage: 0, honesty: -1, temper: 1, curiosity: 0, diligence: 2 }
    values: { wealth: 2, craft: 2 }
    quirks: [greedy]
    patron: lantern
    speech: "Gruff, grumbling about money, the storm and his sails."
    aliases: [miller, molenaar]
    public_facts:
      - Harmen Molenaar owns the mill De Zwaan at Molenend.
      - The storm tore his sails; the mill is standing still.
    examples:
      - "No sails, no flour. No flour, no money. You follow?"
    money: 240
    inventory: { rye_grain: 3, saw: 1 }
    knows_areas: [veenhoek, molenend, drowned_goose, waagdam, roads]
    relations:
      - to: npc_mirte
        role: debtor
        bond: 0
        private: true
        note: She owes you three guilders.
      - to: npc_aaltje
        role: neighbour
        bond: -1
        note: Her field borders yours.
    # Small true stories they may tell when the talk comes to it (M10.35 A).
    tales:
      - text: "Harmen's grandfather built De Zwaan, and Harmen says the sails have been mended so often that not one thread of the first ones is left."
        about: [loc_molenend_mill]
      - text: "He says Klaas is the best lad he ever had at the sails, and the worst at keeping his mind on them."
        about: [npc_klaas]
      - text: "Mirte owes him three guilders, and he says he would sooner have them in bread, if she would only offer."
        about: [npc_mirte]

  - id: npc_klaas
    name: Klaas
    short: Klaas the miller's lad
    pronoun: he
    age: 16
    profession: miller_hand
    home: loc_molenend_house
    work: loc_molenend_mill
    household: hh_molenaar
    child: true
    fame: 0
    appearance: A gangly lad white to the elbows with flour, with a fringe he keeps blowing out of his eyes.
    personality: { warmth: 1, courage: -1, honesty: 1, temper: 0, curiosity: 1, diligence: 1 }
    values: { family: 1 }
    quirks: [shy]
    patron: lantern
    speech: "Mumbles, blushes, says sorry a lot. Speaks up only about the mill and its sails."
    aliases: [klaas, miller's lad, lad, knecht]
    public_facts:
      - Klaas is the miller's lad at De Zwaan in Molenend.
    examples:
      - "The sails want new cloth, but don't tell Master Harmen I said so."
      - "Lights? Over the field? I never looked. Not properly."
    money: 6
    knows_areas: [molenend, veenhoek, drowned_goose]
    relations:
      - to: npc_harmen
        role: employer
        bond: 0
    # Small true stories they may tell when the talk comes to it (M10.35 A).
    tales:
      - text: "Klaas can tell from the sound of the sails how strong the wind is, to within a knot, he says, and he is usually right."
        about: [loc_molenend_mill]
      - text: "He says Master Harmen talks to the mill when it sticks, and that the mill seems to answer him back."
        about: [npc_harmen]
      - text: "He walks the long way round to Veenhoek on market days, past the Vissers' house, and says it is for the view."
        about: [loc_visser_house]
