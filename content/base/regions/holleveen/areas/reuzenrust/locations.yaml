# Reuzenrust (Wereldboek, chapter 7): the giant-bed where the heath begins,
# the three barrows of the White Women, and the road on to Hunnenloo.
locations:
  - id: loc_reuzenrust_hunebed
    name: The Giant-Bed at Reuzenrust
    area: reuzenrust
    tags: [holy, haunted, landmark, hazard:fog, edge]
    aliases: [giant-bed, hunebed, the stones]
    summary: A giant-bed of great grey stones and three burial mounds on the edge of the heath.
    description:
      day: |
        Great grey stones lie in a row on the heath, a capstone balanced on
        them like a table for giants. Three burial mounds rise beyond, furred
        with heather. The wind carries the smell of sheep and sand. The road
        to [Hunnenloo] runs away north-east; Waagdam lies to the south-west.
    exits:
      east: { to: loc_reuzenrust_barrows, minutes: 5 }
      south: { to: loc_reuzenrust_heath, minutes: 10 }
      northeast: { to: loc_reuzenrust_road, minutes: 5 }
    details:
      - words: [capstone, stones, grey stones, giant-bed, hunebed]
        look: The capstone is one slab of grey rock, longer than a cart, balanced on the stones below it. People say giants lifted it there.
        take: Not even a giant would carry that off.
        verbs:
          climb: You set a foot on the stones and a cold feeling goes through you. You step down again.
      - words: [mounds, burial mounds]
        look: Three burial mounds rise beyond the stones, furred with heather.

  - id: loc_reuzenrust_barrows
    name: The Three Barrows
    area: reuzenrust
    tags: [holy, haunted, "hazard:fog"]
    aliases: [three barrows, barrows, burial mounds, grave mounds, grafheuvels]
    summary: Three burial mounds beyond the giant-bed at Reuzenrust, where the White Women are seen in the mist.
    description:
      day: |
        Three round barrows rise from the heather, each as high as a house and
        furred with heath and moss. Someone has worn a narrow path between
        them, but none up their sides. The wind drops as you come among them,
        until you can hear the heather tick. The giant-bed lies back to the
        west.
      night: |
        Mist gathers between the barrows even when the heath around is clear,
        and it moves more than the wind can explain. For a moment you see
        shapes in it, tall and pale, that are gone when you look straight at
        them. It is very cold. The giant-bed is west, and they say you should
        not look back as you go.
    exits:
      west: { to: loc_reuzenrust_hunebed, minutes: 5 }
    details:
      - words: [path, narrow path]
        look: A narrow path worn between the barrows by feet that did not dare go up their sides.
      - words: [barrows, barrow, mounds]
        look: Three round barrows, each as high as a house, furred with heather and moss. Nobody has dug into them.
        verbs:
          climb: Nobody climbs the barrows, and standing among them you understand why.
          dig: Nobody digs here. Standing among the barrows, you understand why.

  - id: loc_reuzenrust_heath
    name: The Edge of the Heath
    area: reuzenrust
    tags: [wilderness]
    aliases: [heath edge, edge of the heath, heiderand]
    summary: Where the heath of Reuzenrust falls away to the fields and the fen, with a wide view on a clear day.
    description:
      day: |
        Here the heath ends in a low bank of sand and heather, and below it
        the fields and the fen run away south as far as the eye goes. On a
        clear day you can make out the tower of the Waag at [Waagdam] to the
        south-west, small and grey. The wind hisses in the heather, and
        something slides away through it at your feet, too quick to see. The
        giant-bed is north, back up on the heath.
      night: |
        The edge of the heath is a black line against a sky only a little less
        black. Far off to the south-west a few lights show where Waagdam must
        be. The wind is cold and smells of heather. The giant-bed is north.
    exits:
      north: { to: loc_reuzenrust_hunebed, minutes: 10 }
    details:
      - words: [bank, sand]
        look: A low bank of sand and heather where the heath ends, with the fields and the fen spread out below it.
      - words: [tower, waag]
        look: Far off to the south-west, small and grey, the tower of the Waag at Waagdam.

  - id: loc_reuzenrust_road
    name: The Road to Hunnenloo
    area: reuzenrust
    pos: [122.6, 108.4]
    tags: [route, "hazard:fog", edge]
    aliases: [road to hunnenloo, hunnenloo road, heideweg]
    summary: Where the heath road leaves Reuzenrust and runs on north-east towards Hunnenloo, many days away.
    description:
      day: |
        Past the giant-bed the road goes on across the heath, two sandy ruts
        curving away north-east between the heather until the land swallows
        them. It is many days' walk to [Hunnenloo], over country you do not
        know. The wind comes over the heath with nothing to stop it and smells
        of sand and sheep. The stones of the giant-bed stand close by to the
        south-west.
      night: |
        The road is a pale thread across the dark heath, and it runs on into
        nothing. Mist lies low in the hollows on either side. Behind you, to
        the south-west, the giant-bed stands black against the sky.
    exits:
      southwest: { to: loc_reuzenrust_hunebed, minutes: 5 }
