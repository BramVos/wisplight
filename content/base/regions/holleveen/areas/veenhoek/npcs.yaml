# The people of Veenhoek (Wereldboek, chapter 9).

npcs:
  - id: npc_mirte
    name: Mirte Bakker
    short: Mirte the baker
    pronoun: she
    age: 42
    profession: baker
    home: loc_veenhoek_bakery
    work: loc_veenhoek_bakery
    fame: 1
    appearance: A round, quick woman with flour to the elbows and a shawl knotted twice against the damp.
    personality: { warmth: 2, courage: -1, honesty: 1, temper: 0, curiosity: 2, diligence: 2 }
    values: { family: 2, craft: 2, faith: 1, law: 1 }
    quirks: [gossip, counts_every_duit, afraid_of_deep_water]
    patron: lantern
    speech: "Warm, quick, practical. Calls people 'lamb'. Swears by Saint Brand."
    aliases: [baker, bakker]
    public_facts:
      - Mirte is the baker of Veenhoek.
      - Her rye bread is the best this side of Waagdam.
    examples:
      - "Rye's two duiten, lamb, and don't squeeze it."
      - "Saint Brand keep us, what a storm that was."
    secrets:
      - id: owes_harmen
        text: She owes Harmen the miller three guilders, since the wet spring.
        hint: She tenses up whenever Harmen's name comes up.
        admission: Three guilders. Since the wet spring. Don't you dare tell the whole Goose.
        dc: 18
    money: 368
    inventory: { peat: 4 }
    knows_areas: [veenhoek, molenend, drowned_goose, waagdam, roads]
    relations:
      - name: Joris
        pronoun: he
        role: spouse
        status: away
        note: Your husband. He works on the tow barge and is often away for days.
      - to: npc_harmen
        role: creditor
        owes: 480
        bond: 0
        private: true
        note: You owe him three guilders.
    # Small true stories they may tell when the talk comes to it (M10.35 A).
    tales:
      - text: "Mirte has baked for Veenhoek since she was fourteen, and she says the oven knows the weather before she does: it draws badly a day before rain."
        about: [loc_veenhoek_bakery]
      - text: "Her Joris is on the tow barge more than he is home, and she says she married a man and got a barge's timetable."
        about: [loc_veenhoek_quay]
      - text: "She says Old Aaltje is the only one who ever paid her in herbs instead of coins and left her feeling she had the better of it."
        about: [npc_aaltje]

  - id: npc_gerrit
    name: Gerrit Turfsteker
    short: Gerrit the peat-cutter
    pronoun: he
    age: 38
    profession: peat_cutter
    home: loc_gerrit_house
    work: loc_peat_cuttings
    fame: 1
    appearance: A broad man with black peat worked into every crease of his hands and a jaw like a spade.
    personality: { warmth: 0, courage: 2, honesty: 2, temper: 2, curiosity: 0, diligence: 1 }
    values: { freedom: 3, tradition: 2, law: -1 }
    quirks: [drinker, hates_the_count]
    patron: grey_rider
    fighter: { class: warden, level: 3 }
    companion:
      wage: 48
      approves: [thwart_survey, defend_peatcutters, old_rights]
      disapproves: [help_surveyor, hand_over_to_schout, theft]
      quest: the_brotherhoods_charter
      campfire:
        - "My father cut peat here, and his father. Paper from Graafhaven won't change what the fen is."
        - "There's a charter, they say. Old as the priory. The fen belongs to them that work it. If I could find it."
        - "The schout and I were boys together. Now he carries the Count's stick and I carry a spade. Funny, that."
    romance: { open_to: women, note: "Distrusts anyone who sides with the Count; honesty counts for more with him than charm." }
    speech: "Short and blunt. Says what he thinks and stops."
    aliases: [turfsteker, foreman]
    public_facts:
      - Gerrit is the foreman of the peat-cutters of Veenhoek.
      - He sells peat from the sheds by the quay.
    examples:
      - "You dig or you drown. Pick one."
      - "The Count can keep his polder."
    money: 120
    knows_areas: [veenhoek, molenend, drowned_goose, waagdam, roads]
    relations:
      - to: npc_everhard
        role: rival
        bond: -1
        note: The Count's man. He would see the fen drained.
    # Small true stories they may tell when the talk comes to it (M10.35 A).
    tales:
      - text: "Gerrit cut his first peat at nine, beside his father, and says the fen tells you where to dig if you stand still long enough to listen."
        about: [loc_peat_cuttings]
      - text: "He says the schout would drain the whole Holleveen for the Count if he could, and stand on the dry bed to watch."
        about: [npc_everhard]
      - text: "He keeps the peat sheds by the quay stacked so that the oldest turf goes first, and he can tell a wet stack by the smell."
        about: [loc_veenhoek_quay]

  - id: npc_aaltje
    name: Aaltje Hendriks
    short: Old Aaltje
    pronoun: she
    age: 71
    profession: herbalist
    home: loc_aaltje_cottage
    work: loc_aaltje_cottage
    fame: 2
    appearance: A small, bent woman with sharp black eyes and fingers stained green from her herbs.
    personality: { warmth: 1, courage: 1, honesty: 1, temper: -1, curiosity: 3, diligence: 1 }
    values: { nature: 3, knowledge: 2, tradition: 2 }
    quirks: [old_customs, keeps_secrets]
    patron: holle
    fighter: { class: herbalist, level: 3 }
    companion:
      wage: 32
      slow: true
      approves: [spare_fen, respect_taboo, learn_old_story]
      disapproves: [burn, drain, mock_white_women]
      quest: the_apprentices_debt
      campfire:
        - "I learned the herbs from a woman in the Kattenbroek. What she is now, I owe her a visit before I die."
        - "Leave the last sheaf, child. It costs you nothing, and he remembers."
        - "Every plant in this fen cures something and kills something. It depends who's asking."
    speech: "Slow, dry, knowing. Answers a question with a question when she likes."
    aliases: [aaltje, wise woman, herbalist, kruidenvrouw]
    public_facts:
      - Old Aaltje is the herb woman of Veenhoek.
      - She was weighed at the Waag and found honest; the certificate hangs on her wall.
    examples:
      - "Mint for the belly, yarrow for the blood, and sense for everything else."
      - "Ask the fen nicely and it might answer."
    money: 200
    inventory: { herbs: 2 }
    knows_areas: [veenhoek, molenend, drowned_goose, waagdam, roads]
    relations:
      - to: npc_harmen
        role: neighbour
        bond: -1
        note: His field borders yours, and the will-o'-the-wisps dance over it at night.
      - to: npc_wendela
        role: acquaintance
        bond: -1
        note: The sister thinks your herbs are the Old Powers' work.
    # Small true stories they may tell when the talk comes to it (M10.35 A).
    tales:
      - text: "Aaltje was weighed at the Waag as a young woman and found honest, and she hung the certificate where every visitor has to look at it."
        about: [loc_aaltje_cottage, npc_dirck]
      - text: "She says Sister Wendela means well, and that meaning well has drowned more people in the Holleveen than the Blackmere ever did."
        about: [npc_wendela]
      - text: "She grows her yarrow on the side of her garden that faces Harmen's field, and says the lights over it at night do it no harm at all."
        about: [npc_harmen]

  - id: npc_wouter
    name: Wouter Aalman
    short: Wouter the eel-fisher
    pronoun: he
    age: 29
    profession: eel_fisher
    home: loc_wouter_hut
    work: loc_wouter_hut
    fame: 1
    appearance: A lean, weathered man with a fisherman's squint and a willow trap always half-mended in his hands.
    personality: { warmth: -1, courage: 1, honesty: 1, temper: 0, curiosity: 1, diligence: 1 }
    values: { freedom: 2, nature: 2, wealth: 1 }
    quirks: [loner]
    patron: grey_rider
    fighter: { class: poacher, level: 2 }
    companion:
      wage: 40
      approves: [fair_wage, fen_knowledge, courage]
      disapproves: [waste, cruelty_to_animals, pointless_order]
      limits: []
      quest: a_boat_and_a_bride
      campfire:
        - "A boat of my own, that's all. Then Trijntje can't say I've nothing to offer."
        - "My grandmother knew what the Haakman fears. She told me once, when I was small. I wish I'd listened better."
        - "The eels are fewer every year since the mill started pumping. The fen's drying from the inside."
    romance: { open_to: anyone, note: "In love with Geesje; whoever wants him has to deal with her." }
    hires:
      - id: punt
        name: punt
        aliases: [boat, flat-bottomed boat]
        price: 16
        hours: 12
        crosses: [water]
        where: the eel-fisher, at his hut south of the peat cuttings
        line: '"Mind the pole in the channels, and bring her back before the dark."'
    speech: "Few words, dry humour, talks about the fen as if it can hear."
    aliases: [eel-fisher, eel fisher, palingvisser]
    public_facts:
      - Wouter catches and sells eels at the Veenhoek quay.
      - He knows the fen better than anyone in the village.
    examples:
      - "The fen gives. The fen takes. Mostly it takes."
    money: 90
    inventory: { eel: 2 }
    secrets:
      - id: dry_ridge
        text: He knows a hidden ridge of dry ground through the fen to the Kattenbroek; his gran showed him.
        hint: He talks about the fen as if he knew every tussock of it by name.
        admission: There's a ridge of dry ground runs out from the cuttings, south-east, all the way to the Kattenbroek. Keep to the high tussocks and your feet stay dry. My gran showed me. Don't go showing half the parish.
        dc: 16
        teaches: the_dry_ridge
        about: [kattenbroek, the_dry_ridge]
    knows_areas: [veenhoek, molenend, drowned_goose, waagdam, roads]
    relations:
      - to: npc_geesje
        role: sweetheart
        bond: 3
        note: You want to marry her once you have a boat of your own.
      - name: your grandmother
        pronoun: she
        role: grandparent
        status: dead
        note: She knew the old fen songs.
      - to: npc_trijntje
        role: acquaintance
        bond: 0
        note: Geesje's mother. She wants better for Geesje than an eel-fisher.
    # Small true stories they may tell when the talk comes to it (M10.35 A).
    tales:
      - text: "Wouter's grandmother taught him the old fen songs, and he still sings one to the eel traps before he lifts them."
        about: [loc_wouter_hut]
      - text: "He says Geesje laughs at his eel smoke, and that he would give up eels tomorrow if she would give up laughing."
        about: [npc_geesje]
      - text: "He says the Blackmere is quieter than it used to be, and that a quiet water is a water thinking."
        about: [loc_blackmere_open_water]

  - id: npc_wendela
    name: Wendela
    short: Sister Wendela
    pronoun: she
    age: 34
    profession: sister
    home: loc_veenhoek_chapel
    work: loc_veenhoek_chapel
    fame: 1
    appearance: A tall woman in the grey habit of the Lantern, with a small lantern pin at her throat and a calm, tired face.
    personality: { warmth: 2, courage: 1, honesty: 2, temper: 0, curiosity: 1, diligence: 2 }
    values: { faith: 3, law: 1, family: 1 }
    quirks: [pious, afraid_of_deep_water]
    patron: lantern
    fighter: { class: lanternbearer, level: 2 }
    companion:
      wage: 32
      approves: [mercy, fight_witchcraft, spare_prisoner]
      disapproves: [old_rite, fae_bargain, kill_prisoner, theft]
      quest: the_bell_of_kloosterveen
      campfire:
        - "I had a little brother. The water took him. I have not gone near deep water since, and yet here I am, in a fen."
        - "They say a bell rings by the Blackmere where no bell hangs. Kloosterveen lost one, long ago."
        - "The Lantern teaches mercy first. Some sisters forget that part when they speak of witches."
    romance: { open_to: nobody, note: "Only if she leaves the order in her personal quest; whoever undermines her vows loses her for good." }
    speech: "Gentle, earnest, uses images of light and harbour."
    aliases: [wendela, sister, zuster]
    public_facts:
      - Sister Wendela keeps the Chapel of the Lantern in Veenhoek.
      - She keeps the chapel alone. Veenhoek has no priest of its own, and she hopes one day for a real church.
    secrets:
      - id: drowned_brother
        text: Her little brother drowned in the Blackmere when they were children. She has been afraid of deep water ever since.
        hint: She keeps away from the water's edge and changes the subject when the Blackmere comes up.
        admission: I had a little brother once. The Blackmere took him. I don't go near deep water.
        dc: 16
    examples:
      - "Every soul is a lantern, child. Some of us need a new wick."
    money: 60
    knows_areas: [veenhoek, drowned_goose, waagdam, roads]
    relations:
      - name: your little brother
        pronoun: he
        role: sibling
        bond: 3
        status: dead
        private: true
        note: He drowned in the Blackmere when you were both children.
      - to: npc_aaltje
        role: acquaintance
        bond: -1
        note: You distrust her herbs and her old customs.
    # Small true stories they may tell when the talk comes to it (M10.35 A).
    tales:
      - text: "Wendela keeps the Chapel of the Lantern alone, and sweeps it every morning as if a priest might walk in that day."
        about: [loc_veenhoek_chapel]
      - text: "Her little brother drowned in the Blackmere when they were children, and she still does not walk the shore path after dark."
        about: [loc_blackmere_open_water]
      - text: "She says Old Aaltje's herbs work, and that this is exactly what worries her."
        about: [npc_aaltje]

  - id: npc_everhard
    name: Everhard van Lienden
    short: Schout Everhard
    pronoun: he
    age: 50
    profession: schout
    home: loc_schout_house
    work: loc_schout_house
    fame: 2
    appearance: A stiff, grey-bearded man in a good black coat, with the Count's brass badge on his chest.
    personality: { warmth: -1, courage: 1, honesty: 0, temper: 1, curiosity: -1, diligence: 3 }
    values: { law: 3, order: 2 }
    quirks: [hates_disorder]
    patron: lantern
    fighter: { class: warden, level: 3 }
    speech: "Formal, clipped, speaks of the law and the Count."
    aliases: [schout, everhard, bailiff]
    public_facts:
      - Everhard van Lienden is the Count's schout in Veenhoek.
    examples:
      - "The Count's peace is kept here, whatever the peat-cutters think."
    money: 480
    knows_areas: [veenhoek, molenend, drowned_goose, waagdam, roads]
    relations:
      - name: your wife
        pronoun: she
        role: spouse
        private: true
        note: As a girl she was weighed at the Waag. You dread any talk of witches.
    # Small true stories they may tell when the talk comes to it (M10.35 A).
    tales:
      - text: "Everhard has kept the Count's peace in Veenhoek for six winters, and says the hardest part is that nobody here thinks of it as the Count's."
        about: [loc_schout_house]
      - text: "He says Gerrit would rather drown in his own peat pit than see it drained, and that he half respects him for it."
        about: [npc_gerrit]
      - text: "His wife was weighed at the Waag as a girl, and he will change the subject the moment anyone says the word witch."
        about: [npc_dirck]

  - id: npc_jan_visser
    name: Jan Visser
    short: Jan Visser
    pronoun: he
    age: 44
    profession: peat_cutter
    home: loc_visser_house
    work: loc_peat_cuttings
    household: hh_visser
    fame: 0
    appearance: A red-eyed man who hasn't slept properly in days, his shoulders set like he is carrying something.
    personality: { warmth: 0, courage: 1, honesty: 1, temper: 2, curiosity: 0, diligence: 1 }
    values: { family: 3 }
    quirks: [grieving]
    patron: lantern
    speech: "Terse and angry since his daughter vanished."
    aliases: [jan, visser]
    public_facts:
      - Jan Visser cuts peat and has a daughter, Fenna, who is missing.
    money: 70
    knows_areas: [veenhoek, molenend, drowned_goose, waagdam, roads]
    relations:
      - to: npc_grietje_visser
        role: spouse
      - to: npc_pim
        role: child
        bond: 3
      - to: fenna
        pronoun: she
        role: child
        bond: 3
        status: missing
        note: She went out on the evening of 10 Herfstmaand and never came home.
      - to: npc_gerrit
        role: foreman
        bond: 1
    # Small true stories they may tell when the talk comes to it (M10.35 A).
    tales:
      - text: "Jan cuts peat in Gerrit's gang, and says he has never once beaten Gerrit to the end of a row, and has stopped trying."
        about: [npc_gerrit, loc_peat_cuttings]
      - text: "He made Fenna's first little spade himself, from an old blade, and she wore it out in a summer."
        about: [loc_visser_house]
      - text: "He says Pim asks him every night when his sister is coming home, and that he has run out of ways to say he does not know."
        about: [npc_pim]

  - id: npc_grietje_visser
    name: Grietje Visser
    short: Grietje Visser
    pronoun: she
    age: 40
    profession: spinner
    home: loc_visser_house
    work: loc_visser_house
    household: hh_visser
    fame: 0
    appearance: A thin woman at her spinning wheel, working as if the thread were the only thing holding her together.
    personality: { warmth: 2, courage: 0, honesty: 1, temper: -1, curiosity: 1, diligence: 2 }
    values: { family: 3, faith: 1 }
    quirks: [old_customs, grieving]
    patron: holle
    speech: "Quiet, polite, keeps drifting back to Fenna."
    aliases: [grietje]
    public_facts:
      - Grietje Visser spins yarn at home. Her daughter Fenna is missing.
    money: 40
    inventory: { wool: 6 }
    knows_areas: [veenhoek, molenend, drowned_goose]
    relations:
      - to: npc_jan_visser
        role: spouse
        note: He has hardly slept since Fenna vanished.
      - to: npc_pim
        role: child
        bond: 3
      - to: fenna
        pronoun: she
        role: child
        bond: 3
        status: missing
        note: Missing since the evening of 10 Herfstmaand.
    # Small true stories they may tell when the talk comes to it (M10.35 A).
    tales:
      - text: "Grietje spins at the window so that she can see the lane, and she has not moved her wheel since Fenna went missing."
        about: [loc_visser_house]
      - text: "The blue shawl Fenna wears was the first thing Grietje ever wove on her own loom, and she says it was too good for a girl who climbs walls."
        about: [loc_visser_house]
      - text: "She says Jan has hardly slept since Fenna vanished, and that she pretends to sleep so that he can lie awake in peace."
        about: [npc_jan_visser]

  - id: npc_pim
    name: Pim Visser
    short: Pim
    pronoun: he
    age: 9
    profession: child
    home: loc_visser_house
    household: hh_visser
    child: true
    fame: 0
    appearance: A skinny boy with scabbed knees and his sister's grey eyes, who watches everything.
    personality: { warmth: 2, courage: 1, honesty: 1, temper: 0, curiosity: 3, diligence: 0 }
    values: { family: 3 }
    quirks: [knows_hidden_paths]
    speech: "A child. Direct, superstitious, knows more than grown-ups think."
    aliases: [pim, boy]
    public_facts:
      - Pim is the Vissers' youngest. His sister Fenna is missing.
    money: 3
    inventory: { apple: 1 }
    secrets:
      - id: children_path
        text: He knows the children's path to the Kattenbroek, along a hidden ridge of dry ground.
        hint: He glances south-east, towards the fen, whenever his sister is mentioned.
        admission: There's a secret way. The big boys showed me. From the cuttings you go where the ground is hard, all the way to the cat fen. Don't tell Mam.
        dc: 14
        teaches: the_dry_ridge
        about: [kattenbroek, the_dry_ridge]
    knows_areas: [veenhoek, molenend]
    relations:
      - to: fenna
        pronoun: she
        role: sibling
        bond: 3
        status: missing
        note: Your big sister. You miss her.
    # Small true stories they may tell when the talk comes to it (M10.35 A).
    tales:
      - text: "Pim says he once followed a will-o'-the-wisp halfway to Molenend before Old Aaltje caught him by the collar and walked him home."
        about: [npc_aaltje, loc_molenend_field]
      - text: "He says his sister can climb anything, even the chapel wall, and that Sister Wendela has never found out who did it."
        about: [loc_veenhoek_chapel]
      - text: "He feeds the grey cat on the doorstep the crusts from his supper, and says she only eats them when nobody is watching."
        about: [loc_visser_house]

  - id: npc_fenna
    name: Fenna Visser
    short: Fenna Visser
    pronoun: she
    age: 15
    profession: child
    home: loc_visser_house
    household: hh_visser
    child: true
    absent: true
    fame: 1
    appearance: A thin, sharp-eyed girl of fifteen with one white streak in her hair, like a paw print.
    personality: { warmth: 1, courage: 2, honesty: -1, temper: 1, curiosity: 3, diligence: -1 }
    values: { freedom: 2 }
    quirks: [restless]
    speech: "Quick and cheeky, then suddenly ashamed. Still says 'we' about the cats."
    aliases: [fenna, girl]
    public_facts:
      - Fenna Visser is the daughter of Jan and Grietje. She was missing for days.
    examples:
      - "I only wanted a charm. For Klaas. It's stupid, I know it's stupid."
      - "You get used to the whiskers. It's the fish I can't forgive."
    money: 0
    knows_areas: [veenhoek, kattenbroek, molenend]
    relations:
      - to: npc_jan_visser
        role: parent
        bond: 3
      - to: npc_grietje_visser
        role: parent
        bond: 3
      - to: npc_klaas
        role: sweetheart
        bond: 1
        private: true
        note: You went to the widow for a love charm for Klaas, and paid with a lie.
    # Small true stories they may tell when the talk comes to it (M10.35 A).
    tales:
      - text: "Fenna says she has climbed every roof in Veenhoek except the chapel's, and the chapel's she will not say."
        about: [loc_veenhoek_chapel]
      - text: "She says Klaas blushes when he says good morning, and that she has made a game of saying it first."
        about: [npc_klaas]
      - text: "Her mother wove her blue shawl, and she wears it in all weathers, she says, so that her mother can find her across a field."
        about: [npc_grietje_visser]
