# The people of Veenhoek (Wereldboek, chapter 9).

npcs:
  - id: npc_mirte
    name: Mirte Bakker
    short: Mirte the baker
    pronoun: she
    age: 42
    profession: baker
    home: loc_veenhoek_bakery
    work: loc_veenhoek_bakery
    fame: 1
    appearance: A round, quick woman with flour to the elbows and a shawl knotted twice against the damp.
    personality: { warmth: 2, courage: -1, honesty: 1, temper: 0, curiosity: 2, diligence: 2 }
    values: { family: 2, craft: 2, faith: 1, law: 1 }
    quirks: [gossip, counts_every_duit, afraid_of_deep_water]
    speech: "Warm, quick, practical. Calls people 'lamb'. Swears by Saint Brand."
    aliases: [baker, bakker]
    public_facts:
      - Mirte is the baker of Veenhoek.
      - Her rye bread is the best this side of Waagdam.
    examples:
      - "Rye's two duiten, lamb, and don't squeeze it."
      - "Saint Brand keep us, what a storm that was."
    money: 368
    inventory: { peat: 4 }
    knows_areas: [veenhoek, molenend, drowned_goose, waagdam, roads]

