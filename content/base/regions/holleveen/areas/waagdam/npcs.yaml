    examples:
      - "Flour's dear since the storm, friend. Supply and demand."
    inventory: { lubberts_key: 1 }
    money: 1600
    knows_areas: [waagdam, drowned_goose, roads, veenhoek, molenend]

  - id: npc_teunis
    name: Teunis Ros
    short: Teunis the horse-miller
    pronoun: he
    age: 58
    profession: horse_miller
    home: loc_waagdam_horse_mill
    work: loc_waagdam_horse_mill
    fame: 1
    appearance: A slow, stooped man who walks a little like his horse, with a kind face under a flour-white cap.
    personality: { warmth: 1, courage: 0, honesty: 2, temper: -2, curiosity: 0, diligence: 2 }
    values: { craft: 2 }
    quirks: [talks_to_his_horse]
    patron: lantern
    speech: "Slow and friendly, talks as much to the horse as to you."
    aliases: [teunis, horse-miller, rosmolenaar]
    public_facts:
      - Teunis Ros runs the horse mill in Waagdam and grinds grain for a stuiver a sack.
    examples:
      - "Easy, Bles. We're not in a hurry. Nobody is, in Waagdam."
    money: 150
    # Oude Zijl too (M10.6): he takes flour out along the dyke road, where he came upon the leak.
    knows_areas: [waagdam, drowned_goose, roads, veenhoek, molenend, oude_zijl]

  - id: npc_dirck
    name: Dirck Schaal
    short: Weighmaster Dirck
    pronoun: he
    age: 60
    profession: weighmaster
    home: loc_waagdam_dirck_house
    work: loc_waagdam_waag
    fame: 3
    appearance: A neat, silver-haired man with a black ribbon at his throat and hands that never fidget.
    personality: { warmth: 1, courage: 1, honesty: 3, temper: -1, curiosity: 1, diligence: 3 }
    values: { justice: 3, knowledge: 1 }
    quirks: [precise]
    patron: lantern
    speech: "Measured, courteous, exact. Chooses every word like a weight."
    aliases: [weighmaster, dirck, waagmeester]
    public_facts:
      - Dirck Schaal is the weighmaster of Waagdam. His certificates are honoured throughout the land.
    examples:
      - "The scale is honest. People are merely heavier or lighter than they fear."
    money: 400
    knows_areas: [waagdam, drowned_goose, roads, veenhoek, molenend]

  - id: npc_hendrik
    name: Hendrik Smid
    short: Hendrik the smith
    pronoun: he
    age: 40
    profession: smith
    home: loc_waagdam_smithy
    work: loc_waagdam_smithy
    fame: 1
    appearance: A big, soot-streaked man with a leather apron and burn scars like freckles up both forearms.
    personality: { warmth: 1, courage: 1, honesty: 1, temper: 1, curiosity: 0, diligence: 2 }
    values: { craft: 3 }
    quirks: [old_customs]
    patron: grey_rider
    romance: { open_to: anyone, note: "Shy; values craft and patience." }
    speech: "Hearty, plain, proud of his work."
    aliases: [smith, hendrik, smid]
    public_facts:
      - Hendrik Smid is the smith of Waagdam.
      - He forges the iron nails that wise women hammer into doorsteps.
    examples:
      - "Iron keeps more than doors shut, if you ask the old women."
    money: 300
    knows_areas: [waagdam, drowned_goose, roads, veenhoek, molenend]

  - id: npc_aleid
    name: Aleid Vos
    short: Burgomaster Aleid Vos
    pronoun: she
    age: 52
    profession: mayor
    home: loc_waagdam_town_hall
    work: loc_waagdam_town_hall
    fame: 2
    appearance: A broad, handsome woman with a chain of office over a plain brown gown and ink on her thumb.
    personality: { warmth: 0, courage: 1, honesty: 1, temper: 0, curiosity: 1, diligence: 2 }
    values: { order: 2, wealth: 2 }
    quirks: [careful]
    patron: lantern
    speech: "Formal, practical, talks of the town's money and the council's rules."
    aliases: [aleid, burgomaster, mayor, burgemeester, vos]
    public_facts:
      - Aleid Vos is the burgomaster of Waagdam.
    examples:
      - "The council will hear you on Woensdag, after the market. Bring something better than a complaint."
      - "Waagdam could be the seat of the new polder board. That would be worth something."
    money: 300
    knows_areas: [waagdam, drowned_goose, veenhoek, roads, oude_zijl]
    relations:
      - name: her husband
        pronoun: he
        role: spouse
        bond: 2
    secrets:
      - id: town_broke
        text: The town is broke.
        hint: She speaks of money a little too often.
        admission: "The coffers are empty. If the polder board comes to Waagdam, so will the money."
        dc: 18
        about: [drainage]

  - id: npc_pen
    name: Pieter Pen
    short: Master Pen the notary
    pronoun: he
    age: 58
    profession: notary
    home: loc_waagdam_notary
    work: loc_waagdam_notary
    fame: 1
    appearance: A stooped, spectacled man with ink up to the second knuckle and a quill behind each ear.
    personality: { warmth: 0, courage: -1, honesty: 2, temper: -1, curiosity: 3, diligence: 2 }
    values: { knowledge: 3, law: 2 }
    quirks: [bookish]
    patron: lantern
    speech: "Pedantic and kind. Quotes registers and dates, loses the thread of his own sentences."
    aliases: [pen, notary, pieter, master pen, notaris]
    public_facts:
      - Master Pieter Pen is the notary of Waagdam. He is writing a chronicle of the Holleveen.
    examples:
      - "Everything that matters was written down once. The trick is finding where."
      - "A charter is a promise that outlives the people who made it."
    money: 250
    knows_areas: [waagdam, kloosterveen, veenhoek, drowned_goose]
    secrets:
      - id: charter_note
        text: He once saw a note in a register that the Fen Charter lies in the library at Kloosterveen.
        hint: At the word charter his eyes go to a shelf of registers.
        admission: "There is a register entry, from before the Wolf. The Fen Charter was given into the keeping of the priory. Kloosterveen, if it still exists."
        dc: 16
        about: [drainage, fen_charter]

  # The landlady of De Schaal (M7.2): the world book names the inn but not who keeps it.
  - id: npc_neeltje
    name: Neeltje Kuiper
    short: Neeltje the landlady
    pronoun: she
    age: 44
    profession: innkeeper
    home: loc_waagdam_de_schaal
    work: loc_waagdam_de_schaal
    fame: 1
    appearance: A small, sharp-eyed woman with a cooper's daughter's forearms and a slate of debts behind the tap.
    personality: { warmth: 0, courage: 1, honesty: 1, temper: 0, curiosity: 2, diligence: 2 }
    values: { wealth: 2, law: 1 }
    quirks: [counts_every_duit]
    patron: nehalennia
    speech: "Dry and quick; a townswoman who counts in stuivers and remembers every slate."
    aliases: [landlady, neeltje, waardin van de schaal]
    public_facts:
      - Neeltje Kuiper keeps De Schaal, the town inn of Waagdam behind the church.
      - The burghers drink at her tap where the prior's men cannot see them.
    examples:
