npcs:
  - id: npc_lubbert
    name: Lubbert Graanhandel
    short: Lubbert the grain merchant
    pronoun: he
    age: 45
    profession: grain_merchant
    home: loc_waagdam_graanhandel
    work: loc_waagdam_graanhandel
    fame: 1
    appearance: A soft-handed man in a good coat with flour dust on the shoulders and a ledger under his arm.
    personality: { warmth: -1, courage: -1, honesty: -2, temper: 0, curiosity: 0, diligence: 1 }
    values: { wealth: 3 }
    quirks: [greedy]
    patron: lantern
    speech: "Smooth, calculating, always talking about prices and shortages."
    aliases: [lubbert, grain merchant, graanhandelaar]
