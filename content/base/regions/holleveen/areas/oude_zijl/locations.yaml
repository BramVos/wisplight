# Oude Zijl (Wereldboek, chapter 7): the sluice at the west end of the Vaart,
# the dyke house of the Dyke Board, and the tow path on towards Graafhaven.
locations:
  - id: loc_oude_zijl_sluice
    name: The Old Sluice
    area: oude_zijl
    tags: [public, landmark, edge]
    aliases: [sluice, the sluice, oude zijl]
    summary: The sluice gates where the Graafse Vaart meets the dyke, with Heemraad Sijbrand's dyke house beside them.
    description:
      day: |
        Two great sluice gates of tarred oak hold back the Vaart where it
        meets the dyke. Water leaks through the seams with a steady hiss, and
        gulls cry from the dyke top. A dyke house stands to one side with its
        shutters closed. The tow path runs east along the Vaart to Veenhoek.
    exits:
      north: { to: loc_oude_zijl_dykehouse }
      up: { to: loc_oude_zijl_dyke, minutes: 2 }
      west: { to: loc_oude_zijl_ferry, minutes: 10 }

  - id: loc_oude_zijl_dykehouse
    name: The Dyke House
    area: oude_zijl
    tags: [private]
    aliases: [dyke house, dijkhuis]
    summary: The dyke house of the Dyke Board at Oude Zijl, where Heemraad Sijbrand lives and keeps the board's books.
    description:
      day: |
        A square brick house with small windows, built into the side of the
        dyke so that its back wall is earth. Inside, a long table is covered
        with rolled plans of dykes and ditches, held flat at the corners with
        stones. It smells of lamp oil and damp plaster, and somewhere behind
        the back wall water ticks. The door opens south onto the sluice.
      night: |
        The shutters are closed and the house is dark. Water ticks behind the
        back wall, where the dyke presses against it. The sluice is south.
    exits:
      south: { to: loc_oude_zijl_sluice }

  - id: loc_oude_zijl_dyke
    name: On the Great Dyke
    area: oude_zijl
    tags: [public]
    aliases: [great dyke, the dyke, dyke top]
    summary: The top of the Great Dyke above the sluice at Oude Zijl, with grey water beyond it.
    description:
      day: |
        From the top of the dyke you see the Holleveen spread out on one
        side, flat and green and lower than it has any right to be. On the
        other side grey water runs out to a grey sky, and the wind off it
        tastes of salt and leans on you without a pause. Sheep have cropped
        the grass short, and their droppings are everywhere. The sluice lies
        below you, down the slope.
      night: |
        Up on the dyke the wind never stops. Out over the water there is
        nothing at all, not one light, only the sound of it working at the
        stones below. The sluice is down the slope behind you.
    exits:
      down: { to: loc_oude_zijl_sluice, minutes: 2 }

  - id: loc_oude_zijl_ferry
    name: The Ferry Landing
    area: oude_zijl
    tags: [public, route]
    aliases: [ferry, ferry landing, landing]
    summary: A ferry landing on the tow path west of the sluice, where the way runs on towards Graafhaven.
    description:
      day: |
        West of the sluice the tow path runs on along the water towards
        [Graafhaven], two days away. Here a flat ferry boat is tied to a
        landing of black planks, and a rope runs from a post across the water
        to the far bank. The rope drips and creaks when the wind leans on it.
        The sluice is back to the east.
      night: |
        The landing is a few dark planks over dark water, and the ferry
        knocks against them as the water moves. The rope across the water
        creaks. The sluice is east.
    exits:
      east: { to: loc_oude_zijl_sluice, minutes: 10 }
