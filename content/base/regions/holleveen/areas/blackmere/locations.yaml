# The Blackmere (Wereldboek, chapter 7): deep water, the Haakman's.
locations:
  - id: loc_blackmere_weirs
    name: Wouter's Eel Weirs
    area: blackmere
    tags: [wilderness, workshop, edge]
    aliases: [weirs, eel weirs, the weirs]
    pos: [112, 99]
    summary: Wouter's eel weirs, rows of willow stakes and traps where the fen path meets the Blackmere.
    description:
      day: |
        Rows of willow stakes march out into the water, hung with eel traps
        of woven withy. A plank walk runs along them, slick and bowed, and you
        hear the water slap against the stakes. A rusty nail is driven into
        the first stake, against the [Haakman]. The fen path runs north to
        Veenhoek and east towards the Kattenbroek; the open shore is south.
    exits:
      south: { to: loc_blackmere_shore, minutes: 10 }

  - id: loc_blackmere_shore
    name: The Shore of the Blackmere
    area: blackmere
    tags: [wilderness, haunted, fae, hazard:deep_water, edge]
    aliases: [blackmere shore, the shore, the lake]
    summary: The black shore of the Blackmere, with drowned willows standing in the shallows.
    description:
      day: |
        The fen ends at black water that gives back no reflection. Drowned
        willows stand out in the shallows like men wading, and the reeds
        whisper though there is no wind. The water smells of iron and old
        leaves. The eel weirs are north along the shore.
      night: |
        The Blackmere is darker than the sky, and very still. Out on the
        water something breaks the surface once and is gone, and the ripples
        reach your feet a long while after. The cold comes off it like breath.
        The weirs are north, if you can find them.
    exits:
      north: { to: loc_blackmere_weirs, minutes: 10 }
      west: { to: loc_blackmere_willows, minutes: 5 }
      south: { to: loc_blackmere_hookstone, minutes: 5 }
      east: { to: loc_blackmere_channel, minutes: 10 }

  - id: loc_blackmere_willows
    name: The Drowned Willows
    area: blackmere
    tags: [wilderness, haunted, "hazard:bog"]
    aliases: [drowned willows, willows]
    summary: Old willows standing dead in the shallows of the Blackmere.
    description:
      day: |
        You wade out among the drowned willows, and the mud takes your feet to
        the ankle at every step. The trees are long dead, grey and split, and
        their bare branches hang down to the water. Up close they creak,
        though the air is still, and it is hard not to hear voices in it. The
        shore is back to the east.
      night: |
        Among the drowned willows the dark is full of shapes, and every one
        of them looks like a man standing up to his waist in the water. The
        mud sucks at your boots. The shore is east.
    exits:
      east: { to: loc_blackmere_shore, minutes: 5 }

  - id: loc_blackmere_hookstone
    name: The Haaksteen
    area: blackmere
    tags: [wilderness, haunted, fae]
    aliases: [haaksteen, hook stone, hookstone, offering stone]
    summary: A grey stone in the shallows of the Blackmere, where people leave bread and beer for the Haakman at the new moon.
    description:
      day: |
        A grey stone stands a little way out in the shallows, flat on top,
        and the water round it is darker than anywhere else. On it lie a crust
        of bread gone soft and a cup with a little beer left in it, gifts for
        the [Haakman], and the top of the stone is greasy with older ones. It
        smells of wet stone and sour beer. The shore is north; south of the
        stone, the bottom drops away into deep water.
      night: |
        The stone is a pale shape in the black water. Now and then the water
        beside it moves, slowly, as if something large has turned over
        underneath. You smell sour beer. The shore is north.
    exits:
      north: { to: loc_blackmere_shore, minutes: 5 }
      south: { to: loc_blackmere_open_water, minutes: 15 }

  - id: loc_blackmere_channel
    name: The Drainage Channel
    area: blackmere
    tags: [wilderness, "hazard:bog"]
    aliases: [drainage channel, mill channel, channel]
    summary: A straight channel dug from the Blackmere towards Molenend, where the mill draws the water off and the mere is shrinking.
    description:
      day: |
        A channel has been dug from the mere as straight as a stretched rope,
        running north towards [Molenend] and the mill that draws the water
        off. Along the shore the old waterline shows as a dark band on the
        reeds, well above the water, and below it lies a strip of raw black
        mud that stinks of rot. Dead mussels crack under your boots. The
        shore is back to the west.
      night: |
        The channel is a black line cut into the dark, and water trickles
        along it towards the north with a small, steady sound. The mud on
        either side breathes out a smell of rot. The shore is west.
    exits:
      west: { to: loc_blackmere_shore, minutes: 10 }

  - id: loc_blackmere_open_water
    name: The Open Water
    area: blackmere
    tags: [wilderness, haunted, hazard:deep_water]
    aliases: [open water, middle of the mere]
    summary: The deep black water in the middle of the Blackmere, the Haakman's own.
    description:
      day: |
        Past the stone the bottom drops away, and you are up to your chest in
        water so cold it hurts, then over your head at a single misstep. The
        water is black and clear at once, and far below you something pale
        lies on the bottom that could be a branch, or bones. There is no
        sound out here but your own breathing and the lap of the water. The
        stone and the shallows are back to the north.
      night: |
        Out on the open water the dark is total, above and below. The cold
        climbs your legs. Something brushes past your knee, slow and
        deliberate, and moves away. The shallows are north, if you can still
        tell which way north is.
    exits:
      north: { to: loc_blackmere_hookstone, minutes: 15 }
