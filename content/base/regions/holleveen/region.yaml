# The Holleveen (Wereldboek, chapter 7): the zone drawing for the region map
# (FO, chapter 4). Each character is a zone of 0.5 km east-west by 1 km north-south;
# the top row is 20 km north, the bottom row 0. The generator makes 120 by 80
# hexes of 250 m from it, with the rules below. Names in the drawing are only
# labels: the hexes under them take the land around them.

regions:
  - id: holleveen
    name: the Holleveen
    area: holleveen
    # Where the south-west corner lies on the map of the land, in km.
    origin: [95, 90]
    size: [30, 20]
    hex: 0.25
    seed: 211
    legend:
      T: woods
      '.': fields
      '"': fen
      '~': water
      '^': heath
      ':': road
      '=': canal
      ',': path
    zones: |
      T T T T T T T T T T T T . . . . . . . . . . . ^ heath ^ : ^ ^
       T T T T T T T T T T T . . . . . . . . . . . . ^ ^ ^ ^ : ^ ^
      T T T T T T T T T T + Kloosterveen  . . .  Reuzenrust n ^ ^ ^
       T T T T T T T T T T T,,,, . . . . . . . . . . ^ ^ ::^ ^ ^ ^
