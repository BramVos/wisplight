    # The routes of the Wereldboek (chapter 7) as lines through the zones, by
    # area or by point (km from the south-west corner). The line characters in
    # the drawing above only show where they run.
    paths:
      - kind: canal
        name: the tow path
        via: [oude_zijl, veenhoek, [18, 14.4], waagdam]
      - kind: road
        name: the peat road
        via: [veenhoek, [15.8, 15.6], molenend]
      - kind: road
        name: the Waagdam road
        via: [[15.8, 15.6], drowned_goose, [19, 13.8], waagdam]
      - kind: road
        name: the heath road
        via: [waagdam, [22, 15], [23.5, 17], reuzenrust, [30, 20]]
      - kind: road
        name: the east road
        via: [waagdam, [25, 13], [30, 13]]
      - kind: path
        name: the fen path
        via: [veenhoek, [15.8, 13.5], [16.2, 12], [16.8, 10.5], [17, 9], [21.5, 9], [25, 9], kattenbroek]
      - kind: path
        name: the priory path
        via: [veenhoek, [13.5, 16], [12, 17], kloosterveen]
      - kind: path
        name: the path to the Kabouterberg
        via: [veenhoek, [14, 13.5], kabouterberg]
    rules:
      # A hidden dry ridge runs from Veenhoek to the widow's hut; only Wouter, Pim
      # and the widow know it. Whoever learns it can walk it.
      - kind: hidden_path
        topic: the_dry_ridge
        from: veenhoek
        to: kattenbroek
      # In fog the Kattenbroek shows no more than one hex around you.
      - kind: sight
        area: kattenbroek
        radius: 3
        fog: 1
      # Between the Blackmere and the Reed Maze lie channels only a punt crosses.
      - kind: channels
        from: blackmere
        to: rietdoolhof
      # Around Reuzenrust the heath shows four hexes, except in fog.
      - kind: sight
        area: reuzenrust
        radius: 2
        clear: 4
    # What you can see from afar, and how far (km).
    landmarks:
      - { area: molenend, text: "the tall mill De Zwaan above the reeds", range: 4 }
      - { area: veenhoek, text: "the roofs and the peat smoke of Veenhoek", range: 3 }
      - { area: waagdam, text: "the tower of the Waag of Waagdam", range: 5 }
      - { area: kloosterveen, text: "the bell tower of the priory above the trees", range: 3 }
      - { area: reuzenrust, text: "the grey stones of the giant-bed on the heath", range: 3 }
      - { area: kattenbroek, text: "a dark wall of reed and alder", range: 2 }
      - { area: blackmere, text: "the black water of the Blackmere", range: 2 }
      - { area: kabouterberg, text: "the old oak on the Kabouterberg", range: 2 }
    # What lies beyond each edge of the map (M10.21), from the world book
    # (chapters 2 and 7): the line at the edge, and the far places that way,
    # which the stranger may go on to. Beyond the last land the book names,
    # nothing is made.
    beyond:
      - side: west
        text: "West, the fen runs on to the Great Dyke, and behind it lies the grey sea. Graafhaven, the Count's city by the sea, is some seventy kilometres on: two days on foot by the tow path, or a day on the barge from Oude Zijl."
        toward: [graafhaven]
      - side: north
        text: "North, past the priory woods, the peat gives way to the open water of the Zuyder Mere. Stavermouth, the silting harbour on its shore, lies two days and a crossing away."
        toward: [stavermouth]
      - side: east
        text: "East, the fen dries into heath and forest. The Oostweg runs two days on to Zwolderkamp, the trading town on the river, and the heath road climbs north-east past the giant-beds to Hunnenloo, three days off."
        toward: [zwolderkamp, hunnenloo]
      - side: south
        text: "South, the fen goes on into reed and black water, and beyond it lies the delta of the Three Rivers, where drowned Saeftinge shows at low tide. No road you know of goes that way."
