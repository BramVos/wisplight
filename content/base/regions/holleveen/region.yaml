       . . . . . . . . . . . . .,, . ,,. . . ===* Waagdam :::::::::
      . . . . .  Kabouterberg k,. . . , . . . . . . . . " " " " "~~
       . . . . . . . . . . . . . . . . , . . . . . . . . " "~~ " "
      " " " " " " " " " " " " " " " " "," " " " " " " " " " " " " "
       " " " " " " " " " " " " "  weirs e,,,,,,,,, Kattenbroek w "
      " " " " " " " " " " " " " " " " "~~~~~~~~~~~" " " " " " "~~ "
       " " " " " " " " " " " " " " " ~~~Blackmere~~~ " " " ~~" " "
      " " " " " " " " " " " " " " " " "~~~~~~~~~~~" " " " " " " " "
       " " " " " " " " " " " " " " " " " " " " " " " " " " " " " "
      " " " " " " " " " " " " " " " " " " " " " " " x Rietdoolhof " "
       " " " " " " " " " " " " " " " " " " " " " " " " " " " " " "
      " " " " " " " " " " " " " " " " " " " " " " " " " " " " " " "
