# Objects publish what they let people do (FO, chapter 4: affordances).
# Templates: {name} is the NPC's first name, {they}/{their}/{them} pronouns.

object_types:
  - id: strongbox
    name: strongbox
    aliases: [chest, box, strongbox, kist, geldkist]
    description: A squat box of oak bound in iron, with a lock as big as a fist.

  - id: bread_oven
    name: bread oven
    aliases: [oven, bakoven]
    description: A brick oven shaped like a beehive, black at the mouth. It holds warmth long after the fire is out.
    affordances:
      - id: bake_bread
        verb: bake
        label: baking bread
        actors: [npc]
        access: owner
        consumes: { flour: 1, peat: 1 }
        produces: { rye_bread: 6 }
        duration: 90
        satisfies: { work: 25 }
        narrate_start: "{name} rakes the embers and slides a tray of loaves into the oven."
        narrate_end: "{name} pulls a row of dark loaves from the oven. The smell of warm rye fills the air."
      # M10.5: the stranger's baking, with the baker's leave. The fee is for the peat fire and the wear.
      - id: bake_rye
        verb: bake
        label: baking rye loaves
        actors: [player]
        access: owner
        craft: baking
        technique: rye_loaf
        consumes: { flour: 1, peat: 1 }
        produces: { rye_bread: 6 }
        duration: 90
        fee: 2
        check: { dc: 10 }
        xp: 5
        player_text: You knead the dough on the board, shape six loaves and slide them in on the long peel. An hour and a half later they come out dark and heavy.
      - id: bake_apple_cake
        verb: bake
        label: baking apple cake
        actors: [player]
        access: owner
        craft: baking
        technique: sweet_dough
        consumes: { flour: 1, apple: 3, peat: 1 }
        produces: { apple_cake: 4 }
        duration: 120
        fee: 2
        check: { dc: 14 }
        xp: 10
        player_text: You work the apples into a softer dough and bake it low and slow, watching the crust. The yard smells of it.
      - id: bake_feast_bread
        verb: bake
        label: baking a feast bread
        actors: [player]
        access: owner
        craft: baking
        technique: feast_bread
        rank: expert
        masterwork: true
        consumes: { flour: 2, milk: 1, apple: 2, peat: 1 }
        produces: { feast_bread: 1 }
        duration: 180
        fee: 2
        check: { dc: 19 }
        xp: 30
        player_text: You braid the dough into a ring as broad as a cartwheel, glaze it with milk and set apples in it like stones in a crown. It comes out golden.

  - id: windmill
    name: windmill
    aliases: [mill, molen, de zwaan]
    description: A tall wooden post mill with four sails. It grinds grain and, through a scoop wheel below, pumps the polder dry.
    affordances:
      - id: grind
        verb: grind
        label: grinding rye
        actors: [npc, player]
        access: public
        consumes: { rye_grain: 1 }
        produces: { flour: 1 }
        duration: 20
        fee: 4
        requires_state: { broken: false }
        broken_text: The sails hang in shreds. This mill won't turn until someone brings new sailcloth.
        player_text: The millstones rumble. A while later you have a sack of flour.
      # M10.5: the stranger at the stones, with the miller's leave.
      - id: mill_rye
        verb: mill
        label: milling rye
        actors: [player]
        access: owner
        craft: milling
        technique: grinding
        consumes: { rye_grain: 2 }
        produces: { flour: 2 }
        duration: 40
        fee: 2
        requires_state: { broken: false }
        broken_text: The sails hang in shreds. This mill won't turn until someone brings new sailcloth.
        check: { dc: 12 }
        xp: 5
        player_text: You set the sails to the wind, feed the hopper and feel the flour between finger and thumb, closing the stones until it runs fine.
    repair:
      consumes: { sailcloth: 2 }
      duration: 240
      sets: { broken: false }
      narrate_end: "{name} steps back as the new sails catch the wind. De Zwaan turns again."

  - id: horse_mill
    name: horse mill
    aliases: [rosmolen, mill]
    description: A millstone turned by an old grey horse walking a patient circle under a thatched roof.
    affordances:
      - id: grind
        verb: grind
        label: having rye ground
        actors: [npc, player]
        access: public
        consumes: { rye_grain: 1 }
        produces: { flour: 1 }
        duration: 30
        fee: 8
        narrate_start: "{name} heaves a sack of rye onto the horse mill, and the grey horse plods off round its circle."
        player_text: The grey horse walks its circle. Half an hour later you have a sack of flour.

  - id: peat_bank
    name: peat bank
    aliases: [peat, cuttings, turfwand]
    description: A wall of wet black peat, cut in straight steps. Water seeps from every cut.
    affordances:
      - id: cut_peat
        verb: cut
        label: cutting peat
        actors: [npc]
        access: staff
        produces: { peat: 6 }
        duration: 60
        # Peat is cut from Zomermaand to Herfstmaand (Wereldboek, chapter 13).
        months: [6, 7, 8, 9]
        satisfies: { work: 25 }
        narrate_start: "{name} spits on {their} hands and drives the spade into the peat."
        narrate_end: "{name} stacks the new blocks of peat to dry."
      # M8.5: a day's work for pay, as the peat-cutters do it (Wereldboek: "Dagloon turfsteker 3 stuivers").
      - id: work_for_pay
        verb: work
        label: cutting peat for a day's wage
        actors: [player]
        produces: { peat: 6 }
        duration: 480
        months: [6, 7, 8, 9]
        wage: 24
        check: { skill: athletics, dc: 10 }
        xp: 10
        craft: peat_cutting
        technique: cutting
        player_text: You cut peat all day beside the others, up to your knees in black water, and stack the wet blocks to dry.

  - id: eel_traps
    name: eel traps
    aliases: [traps, fuiken]
    description: Long willow traps, some whole, some waiting to be mended.
    affordances:
      - id: check_traps
        verb: check
        label: seeing to the eel traps
        actors: [npc]
        access: owner
        produces: { eel: 4 }
        duration: 120
        satisfies: { work: 25 }
        narrate_start: "{name} shoulders a bundle of willow traps and heads for the water's edge."
        narrate_end: "{name} comes back with a dripping bucket of eels."
      # M10.5: the stranger at the traps, with the eel-fisher's leave.
      - id: tend_traps
        verb: fish
        label: tending the eel traps
        actors: [player]
        access: owner
        craft: eel_fishing
        technique: setting_traps
        produces: { eel: 3 }
        duration: 120
        check: { dc: 13 }
        xp: 5
        player_text: You wade out to the traps, lift them dripping, tip the eels into the bucket and set the willow mouths back against the current.

  - id: spinning_wheel
    name: spinning wheel
    aliases: [wheel, spinnewiel]
    description: A spinning wheel, worn smooth where hands and feet have touched it for years.
    affordances:
      - id: spin
        verb: spin
        label: spinning
        actors: [npc]
        access: household
        consumes: { wool: 1 }
        produces: { yarn: 1 }
        duration: 120
        satisfies: { work: 25 }
        narrate_start: "{name} sits down at the wheel, and it begins to hum."

  - id: well
    name: well
    aliases: [put]
    description: A round stone well with a wooden lid. Someone has scratched a spindle into the top stone. People drop pins in it for Mother Holle.
    inscription:
      look: Round the spindle, scratched marks go all the way round the top stone.
      text: A spindle, and under it in old letters, "Holle, see our hands." A pin in the well asks Mother Holle to look kindly on your work.
      dc: 12
      topic: mother_holles_featherbed
    affordances:
      - id: drink
        verb: drink
        label: drinking
        actors: [player, npc]
        access: public
        duration: 2
        player_text: The water is cold and tastes faintly of iron.

  - id: altar
    name: altar
    aliases: [lantern, lantaarn]
    description: A plain altar under a lantern with three panes. The flame never goes out; someone makes sure of it.
    inscription:
      look: Letters are cut into the front of the altar, filled with soot.
      text: "\"Brand kept the light, and the drowned came home.\" Saint Brand, and the Night of the Water Wolf."
      dc: 11
      topic: saint_brand
    affordances:
      - id: pray
        verb: pray
        label: praying
        actors: [player, npc]
        access: public
        duration: 15
        satisfies: { faith: 20 }
        player_text: You stand a while in the lantern light. It is quiet, and that helps.

  - id: dog_stone
    name: old stone
    aliases: [stone, dog stone, steen]
    description: A worn stone, waist-high, with a dog carved on one side. There are apple cores in the moss around it, and one whole apple on top.
    details:
      - words: [apple, apples, the apple, appel]
        look: An apple on top of the stone, left for the dog. It has gone soft on one side, and a wasp is at it.
        take: You leave it be. It isn't yours, and the dog it was left for might mind.
      - words: [apple cores, cores, moss]
        look: Apple cores, brown and old, sunk into the moss around the foot of the stone. People have been leaving apples here for a long time.
    affordances:
      - id: offer
        verb: offer
        label: making an offering
        actors: [player]
        access: public
        consumes: { apple: 1 }
        duration: 2
        player_text: You leave an apple on the stone. Somewhere across the water a dog barks once.

  - id: bench
    name: bench
    aliases: [benches, table, bank, tafel]
    description: A long bench, polished by years of backsides.
    affordances:
      - id: rest
        verb: rest
        label: resting
        actors: [player]
        access: public
        duration: 30
        player_text: You sit a while and let your feet recover.

  - id: forge
    name: forge
    aliases: [anvil, smithy, smidse]
    description: A forge glowing under a hood of soot. The anvil beside it is older than the smith.
    # M10.5: the stranger's smithing, with the smith's leave. Bar iron from the smith's own rack.
    affordances:
      - id: forge_nails
        verb: forge
        label: drawing out nails
        actors: [player]
        access: owner
        craft: smithing
        technique: drawing_out
        consumes: { bar_iron: 1, peat: 1 }
        produces: { iron_nails: 2 }
        duration: 60
        fee: 3
        check: { dc: 11 }
        xp: 5
        player_text: You heat the bar, draw it out thin on the anvil's horn, cut it and head each nail in the nail-plate. Your ears ring.
      - id: forge_knife
        verb: forge
        label: forging a knife
        actors: [player]
        access: owner
        craft: smithing
        technique: blade_work
        consumes: { bar_iron: 1, peat: 1 }
        produces: { knife: 1 }
        duration: 120
        fee: 3
        check: { dc: 14 }
        xp: 10
        player_text: You beat out a blade, grind an edge, and quench it hissing in the trough. You fit a handle of ash.
      - id: forge_lantern
        verb: forge
        label: making a lantern
        actors: [player]
        access: owner
        craft: smithing
        technique: sheet_work
        consumes: { bar_iron: 1, peat: 1 }
        produces: { lantern: 1 }
        duration: 120
        fee: 3
        check: { dc: 15 }
        xp: 10
        player_text: You hammer the iron into sheet, cut it, pierce it and rivet it into a lantern with a door that shuts.
      - id: forge_lock
        verb: forge
        label: making a lock
        actors: [player]
        access: owner
        craft: smithing
        technique: lock_work
        rank: expert
        masterwork: true
        consumes: { bar_iron: 2, peat: 2 }
        produces: { iron_lock: 1 }
        duration: 240
        fee: 3
        check: { dc: 20 }
        xp: 30
        player_text: You file the wards one by one and fit them to a key of your own cutting. The bolt shoots home with a sound like a coin on a counter.

  - id: scale
    name: great scale
    aliases: [scale, heksenwaag, waag, weegschaal]
    description: The great beam scale of Waagdam, black oak and iron, with a seat hanging from one side. People are weighed here to prove they are no witch.
    inscription:
      look: Words are burnt into the beam, black on black.
      text: "\"Weighed and found honest.\" Whoever weighs what an honest person should goes home with a certificate; whoever weighs too light does not."
      dc: 13
      topic: witches_scale
    affordances: []

  - id: counter
    name: counter
    aliases: [counter, toonbank]
    description: A scrubbed wooden counter with a slate for prices.
    affordances: []

  - id: notice_board
    name: notice board
    aliases: [board, notices, prikbord]
    description: A board on the stable wall, stuck with notes and a nail or two. Most of the notes are about lost goats.
    affordances: []

  # M8.5: the kiln of the brickworks at Waagdam, once it is built.
  - id: brick_kiln
    name: brick kiln
    aliases: [kiln, oven, steenoven]
    description: A squat kiln of its own bricks, black with peat smoke, with clay drying in rows beside it.
    affordances:
      - id: work_for_pay
        verb: work
        label: firing bricks for a day's wage
        actors: [player]
        produces: { brick: 8 }
        duration: 480
        wage: 24
        check: { skill: crafting, dc: 12 }
        xp: 10
        craft: brickmaking
        technique: firing
        player_text: You tread clay, fill the moulds and feed the kiln with peat until your eyes sting with the smoke.
