# Lore and facts people can talk about (Wereldboek, chapters 3, 10 and 11).
# Who knows what (FO, chapter 5): known_by knows everything; everyone else
# rolls against the chance for the topic's fame and the distance to where it
# belongs (origin area or pos, in km on the map of the land), plus audience.

topics:
  - id: the_storm
    name: the storm
    kind: fact
    aliases: [storm, the storm, sails, the sails, storm damage]
    origin: molenend
    fame: 2
    summary: A storm on 8 Herfstmaand tore the sails of Harmen's mill, De Zwaan.
    details: Since the storm the mill stands still. There's no flour in Veenhoek except what Lubbert sells in Waagdam, and he has doubled his price.

  - id: fenna
    name: Fenna Visser
    kind: person
    aliases: [fenna, fenna visser, the missing girl, the girl]
    origin: veenhoek
    fame: 1
    summary: Fenna Visser, fifteen, the daughter of Jan and Grietje, has been missing for four days.
    details: She went out on the evening of 10 Herfstmaand and never came home. Nobody saw where she went. Some say the fen took her.
    known_by: [npc_jan_visser, npc_grietje_visser, npc_pim]

  - id: grey_cat
    name: the grey cat
    kind: fact
    aliases: [grey cat, the cat, cat, grijze kat, kat]
    origin: veenhoek
    fame: 1
    summary: A grey cat with one white paw has sat on the Vissers' doorstep every day since Fenna vanished.
    details: It won't be chased off, won't eat what you give it, and watches the lane as if it's waiting for someone.

  - id: kattenbroek
    name: the Kattenbroek
    kind: place
    aliases: [kattenbroek, the kattenbroek, cat marsh, the fen to the south-east]
    fame: 2
    pos: [123.5, 99]
    summary: The Kattenbroek is a fen about three or four hours' walk south-east of Veenhoek, all reeds and black pools.
    details: Nobody goes there if they can help it. The peat-cutters lost a man there in 208, and they say a widow lives out in it.

  - id: cat_widow
    name: the Cat-Widow of the Kattenbroek
    kind: lore
    aliases: [the widow, widow, cat-widow, cat widow, the witch, witch, kaatje, widow kaatje, weduwe, heks, kattenweduwe]
    fame: 2
    pos: [123.5, 99]
    audience: { peat_cutter: 0.2, child: 0.2 }
    summary: Folk say a widow out in the Kattenbroek turns thieves into cats.
    details: Her name is Kaatje. Her husband was an eel-fisher who drowned, and she keeps the fen as if it were his grave. Take from it without asking and you come home on four legs, if at all.
    story: |
      Out in the Kattenbroek there's a hut on stilts, and in it a widow. Kaatje, they call her. Her man was an eel-fisher who went into the black water one spring and never came up. She's kept the fen ever since, like it's his grave, and maybe it is. Take an egg, a reed, an eel from her water without asking, and you come home on four legs. Or you don't come home. My mother knew a boy it happened to. A year and a day he was a ginger tom, and after that he never could abide fish. Is it true? Half the cats in this parish are just cats. But I wouldn't kick one.
    known_by: [npc_aaltje]

  - id: haakman
    name: the Haakman
    kind: lore
    aliases: [haakman, the haakman, hook-man, hookman, water spirit, blackmere spirit]
    fame: 2
    pos: [114, 97]
    audience: { eel_fisher: 0.2, child: 0.1 }
    summary: The Haakman lives in the Blackmere and drags down anyone who insults the water.
    details: He is grey as a heron, with teeth like water-weed and a long hook. Old women hammer iron nails into their doorsteps to keep him out.
    teller: npc_wouter
    story: |
      My gran fished the Blackmere seventy years. She said the Haakman is grey as a heron, with teeth like water-weed and a long hook, and he drags down anyone who spits in his water or takes more eels than they need. She had a song for him. I only have the start of it: Haakman, Haakman, cold and grey, iron at the door keeps you away, iron in the hand and bread on the stone. There was more. Something about his name. She took the rest with her.
    known_by: [npc_wouter, npc_aaltje]

  - id: water_wolf
    name: the Night of the Water Wolf
    kind: lore
    aliases: [water wolf, the water wolf, night of the water wolf, the flood, waterwolf, de waterwolf, de vloed]
    fame: 5
    everywhere: true
    summary: Two hundred and eleven years ago the sea broke the Great Dyke in one night and drowned seventy-two villages.
    details: The old folk called the flood the Water Wolf, because it came hungry and took everything, the rich city of Saeftinge too. The years are counted from that night.
    story: |
      Two hundred years back, near enough, the sea came over the Great Dyke in one night. The old folk called it the Water Wolf, because it came hungry and took everything: seventy-two villages and all of Saeftinge. In the dark a dyke-man called Brand lit a lantern on the last dry stretch, and those who saw it lived. That's why there's a lantern over every church door. And that's why, when the heemraad calls, you dig.

  - id: saint_brand
    name: Saint Brand
    kind: lore
    aliases: [saint brand, brand, sint brand, the lantern, the church of the lantern]
    fame: 5
    pos: [40, 110]
    summary: Saint Brand lit a lantern on the Great Dyke on the Night of the Water Wolf and led the drowning to dry land. The Church of the Lantern keeps his light.
    known_by: [npc_wendela]

  - id: last_sheaf
    name: the last sheaf
    kind: lore
    aliases: [last sheaf, the last sheaf, grey rider, the grey rider, wild hunt, laatste schoof, grijze ruiter]
    fame: 4
    everywhere: true
    summary: At harvest you leave the last sheaf standing for the Grey Rider's horse, or he takes something else.
    story: |
      At harvest you leave the last sheaf standing in the field, tied with a red thread. That one's for the Grey Rider's horse. Priests say it's superstition. Fine. Old Dirk Hoeve cut his last sheaf in 203. That winter the Rider came through in a storm, and Dirk's barn went up like tinder. You leave the sheaf.

  - id: witches_scale
    name: the Witches' Scale
    kind: lore
    aliases: [witches' scale, the scale, heksenwaag, weighing, the weighing, certificate, waag certificate]
    origin: waagdam
    fame: 3
    summary: In the Waag of Waagdam people accused of witchcraft are weighed on the great scale. Whoever weighs what an honest person should gets a certificate that is honoured everywhere.
    details: The weighing costs a guilder and two stuivers. Weighmaster Dirck is known to be fair, and his certificates are good anywhere in the land.

  - id: drainage
    name: the drainage of the Holleveen
    kind: fact
    aliases: [drainage, the drainage, polder, new polder, drooglegging]
    origin: veenhoek
    fame: 2
    summary: The Count wants to drain the Holleveen and make a polder of it.
    details: A surveyor from Graafhaven has been measuring the fen since spring. The peat-cutters are furious; the miller thinks it will be good for trade.

  - id: surveyor
    name: the surveyor
    kind: person
    aliases: [surveyor, the surveyor, cornelis, master cornelis, cornelis de wit, landmeter]
    origin: drowned_goose
    fame: 2
    summary: Master Cornelis, a surveyor from Graafhaven, lodges at the Drowned Goose and is measuring the fen for the Count.
    details: He walks out every workday with his chains and stakes. Twice now somebody has pulled up his stakes in the night.

  - id: graafhaven
    name: Graafhaven
    kind: place
    aliases: [graafhaven, the capital, the city]
    fame: 5
    pos: [40, 110]
    summary: Graafhaven is the capital, a day west by barge along the Graafse Vaart, where the Count lives and the Brandaris burns every night.

  - id: zwolderkamp
    name: Zwolderkamp
    kind: place
    aliases: [zwolderkamp]
    fame: 4
    pos: [185, 115]
    summary: Zwolderkamp is the merchant city of the Cog League, two days east by road. The Count owes them money.

  - id: the_count
    name: the Count
    kind: person
    aliases: [the count, count, count aelbrecht, aelbrecht, de graaf, graaf]
    fame: 4
    pos: [40, 110]
    summary: Count Aelbrecht III rules the Nethermarch from Graafhaven. He wants land out of water, and money out of land.

  - id: stavermouth
    name: Stavermouth
    kind: place
    aliases: [stavermouth]
    fame: 3
    pos: [125, 193]
    summary: Stavermouth is a silting port far up north, past the Zuyder Mere.

  - id: weeping_stone
    name: the Weeping Stone
    kind: lore
    aliases: [weeping stone, the weeping stone, wenende steen]
    fame: 1
    pos: [200, 160]
    summary: A giant-bed near Hunnenloo, far away on the heath, that weeps salt when someone in the village is about to die.

  - id: hunnenloo
    name: Hunnenloo
    kind: place
    aliases: [hunnenloo]
    fame: 3
    pos: [200, 160]
    summary: Hunnenloo is a town far away on the heath, among the giant-beds and the sheep.
