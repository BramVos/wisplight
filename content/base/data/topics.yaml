  - id: the_priory
    name: the priory of Kloosterveen
    kind: fact
    common: true
    everywhere: true
    aliases: [priory, the priory, kloosterveen priory, the monastery, klooster]
    summary: The Church of the Lantern keeps a priory at Kloosterveen, beside its chapel in Veenhoek and the great light at Graafhaven.
    details: Prior Ansfried keeps the priory and its library, where the Fen Charter lies almost forgotten. The Church wants souls, charity, and an end to witchcraft and the old rites; on the draining it is divided.
