# The great lines of the Nethermarch (M10.22): great dangers that grow in the
# background, with or without the stranger. The engine adds up what pushes
# each one every day and judges it on the first of every month: nothing, a
# threat (a mood of threat in its areas, news, prices up), or the event, a
# plan of the content that the engine plays out.

tides:
  # The Night of the Waterwolf is the story everyone knows (Wereldboek, chapter
  # 3): autumn storms and winter water press on the Great Dyke by Oude Zijl.
  # When it breaks, the dyke leaks (plan dyke_leak), and unless someone gets
  # the dyke reeve to shore it in time, the breach follows.
  - id: great_flood
    name: the great flood
    kind: flood
    areas: [oude_zijl, veenhoek, molenend]
    drivers:
      - { season: autumn, weight: 1 }
      - { season: winter, weight: 2 }
      # A dyke that is manned and shored calms it.
      - { flag: dyke_shored, weight: -3 }
    threat: 40
    threshold: 90
    threatens:
      line: The water stands high against the Great Dyke, and people keep looking at the sky.
      news: The Vaart is higher than anyone remembers at this time of year, and the dyke reeve walks the dyke every night.
      prices: 1.1
      days: 14
    plan: dyke_leak
    breaks:
      title: water through the Great Dyke
      precise: The storm water has found its way into the Great Dyke by Oude Zijl, and it is leaking.
      village: They say the Great Dyke is leaking by Oude Zijl.
      far: The Great Dyke in the Holleveen is leaking.
    cooldown: 180

  # The peat-cutters and the Count's men are old rivals (data/factions.yaml): the
  # Brotherhood cuts the peat, and the schout takes the Count's share of every
  # barge. What the stranger does weighs in (M10.22): a crime against the schout
  # sharpens it, any crime a little; bringing Gerrit and Schout Everhard to one
  # table calms it. When it breaks, the cutters down tools (plan peat_strike).
  - id: peat_unrest
    name: the peat-cutters' unrest
    kind: uprising
    areas: [veenhoek]
    drivers:
      - { fact: { kind: crime, about: npc_everhard, by: player }, weight: 8 }
      - { fact: { kind: crime, by: player }, weight: 2 }
      - { fact: { kind: reconciled, about: npc_gerrit }, weight: -4 }
      - { season: winter, weight: 1 }
    threat: 30
    threshold: 60
    threatens:
      line: The peat-cutters stand about in knots and stop talking when the schout passes.
      news: The Brotherhood says the Count's share is too much this year, and Schout Everhard says a bargain is a bargain.
      prices: 1.1
      days: 10
    plan: peat_strike
    breaks:
      title: the peat-cutters down tools
      precise: The Brotherhood of Peat-cutters has laid down its spades and stands before the schout's house, and no peat is cut for the Count.
      village: The cutters have downed tools! They're standing outside Everhard's door.
      far: Peat-cutters in the Holleveen have stopped work against their count.
    cooldown: 120
    mediation:
      between: [npc_gerrit, npc_everhard]
      eases: 10
      told: the stranger brought Gerrit of the peat-cutters and Schout Everhard to one table
