areas:
  - id: veenhoek
    name: Veenhoek
    kind: village
    sound: { kind: birds, level: 0.4, night: reeds }
    aliases: [the village]
    fame: 1
    pos: [110, 105]
    summary: A peat-cutters' village of about 180 souls on the Graafse Vaart, with a bakery, a chapel and the peat sheds.

  - id: molenend
    name: Molenend
    kind: hamlet
    sound: { kind: wind, level: 0.5 }
    aliases: []
    fame: 1
    pos: [111.5, 106]
    summary: A hamlet a short walk north-east of Veenhoek, around the windmill De Zwaan that grinds grain and pumps the polder dry.

  - id: drowned_goose
    name: The Drowned Goose
    kind: inn
    sound: { kind: wind, level: 0.35 }
    aliases: [the goose, drowned goose, the inn, de verdronken gans]
    fame: 2
    pos: [112, 104]
    summary: The inn at the crossroads between Veenhoek and Waagdam, run by Trijntje Kroes. Everyone's news passes through it.

  - id: waagdam
    name: Waagdam
    kind: town
    sound: { kind: crowd, level: 0.35, night: water }
    aliases: [the town]
    fame: 2
    pos: [116, 103]
    summary: The market town of the Holleveen, an hour and a quarter east along the Vaart, famous for its Witches' Scale. Market day is Woensdag.
    market_days: [Woensdag]

  - id: roads
    name: the roads of the Holleveen
    kind: route
    sound: { kind: wind, level: 0.35 }
    aliases: [the tow path, the vaart, graafse vaart, the road]
    fame: 1
    pos: [113, 104.5]
    summary: The tow path along the Graafse Vaart and the road past the Drowned Goose, both leading from Veenhoek to Waagdam.

  # The open land of the region, between the places: the hexes of the region map.
  - id: holleveen
    name: the Holleveen
    kind: wilderness
    sound: { kind: reeds, level: 0.5 }
    aliases: [holleveen, the holleveen]
    fame: 2
    pos: [110, 100]
    summary: The fen country between the Graafse Vaart and the heath, thirty by twenty kilometres of peat, reed and black water.

  - id: kloosterveen
    name: Kloosterveen
    kind: hamlet
    sound: { kind: birds, level: 0.3 }
    aliases: [the priory, klooster]
    fame: 2
    pos: [105, 108]
    summary: The priory of Kloosterveen in the woods north-west of Veenhoek, with its church, its library and a brewery famous for autumn beer.

  - id: oude_zijl
    name: Oude Zijl
    kind: hamlet
    sound: { kind: water, level: 0.45 }
    aliases: [the sluice, the old sluice]
    fame: 1
    pos: [100, 105]
    summary: The old sluice and dyke house at the western end of the Graafse Vaart, where Heemraad Sijbrand keeps the gates.

  - id: kabouterberg
    name: the Kabouterberg
    kind: wilderness
    sound: { kind: wind, level: 0.5 }
    aliases: [kabouterberg, kabouter hill, the kabouter hill]
    fame: 1
    pos: [107, 102]
    summary: A sandy hill south-west of Veenhoek with a hollow under an old oak. The kabouters live there, people say, and you leave them milk.

  - id: blackmere
    name: the Blackmere
    kind: wilderness
    sound: { kind: water, level: 0.4, night: reeds }
    aliases: [blackmere, the black mere, zwarte meer]
    fame: 2
    pos: [114, 97]
    summary: A black fen lake south of Veenhoek, with Wouter's eel weirs on its shore and drowned willows in the shallows.

  # Known through the lore topic of the same name, so the two do not compete in conversation.
  - id: kattenbroek
    name: the Kattenbroek
    kind: wilderness
    sound: { kind: reeds, level: 0.55 }
    topic: kattenbroek
    fame: 2
    pos: [123.5, 99]
    summary: A fen of reeds and black pools south-east of Veenhoek, where a widow is said to live.
    # The widow's mist (Wereldboek, chapter 14): nobody gets in carrying measuring chains while she keeps the fen.
    barred:
      - when: [{ flag: widow_mist }, { not_flag: fen_without_keeper }]
        carrying: survey
        text: Mist comes up out of the reeds, thick as wool. You walk on and on, and come out where you started, with the chains heavy on your back.

  - id: rietdoolhof
    name: the Rietdoolhof
    kind: wilderness
    sound: { kind: reeds, level: 0.55 }
    aliases: [rietdoolhof, the reed maze, reed maze]
    fame: 2
    pos: [117, 94]
    summary: A maze of reed channels south of the Blackmere. Nobody with any sense goes in there.

  - id: reuzenrust
    name: Reuzenrust
    kind: wilderness
    sound: { kind: wind, level: 0.45 }
    aliases: [the giant-bed, the hunebed, giant's rest]
    fame: 2
    pos: [122, 108]
    summary: Where the heath begins north-east of Waagdam, a giant-bed and three burial mounds mark the start of the road to Hunnenloo.
