# Watchers (design: signalen en nasleep, M8.1). A watcher says when a change
# in the world is a signal: a new fact with a claim, conditions that come
# true, or a state the system works out. What follows is in aftermath.yaml.
# A new kind of event is a watcher and an aftermath here, not code.

watchers:
  # Two people will marry: a quest's outcome says so ({ subject, key: betrothed, value }).
  - id: betrothal
    signal: life_event
    event: betrothal
    fact: { key: betrothed }

  # Two people married: the player at a chapel, or two villagers at their feast.
  - id: wedding
    signal: life_event
    event: wedding
    fact: { key: married }

  # Two people ran off together: a signal of its own, not a wedding.
  - id: eloped
    signal: eloped
    fact: { key: eloped }

  # Someone stopped working where they served: a place is open.
  - id: vacancy
    signal: vacancy
    fact: { key: vacancy, not: filled }
    who: [$about]

  # A house nobody has lived in for three days.
  - id: house_empty
    signal: house_empty
    probe: { house_empty: 3 }

  # Peace between realms, and a place that is itself again after a flood or a war.
  - id: peace
    signal: realm_stance
    event: peace
    fact: { key: stance, value: peace }

  - id: place_restored
    signal: place_restored
    # Only a place that was flooded, damaged or taken (kind place), not a leak shored in time (M10.6).
    fact: { key: state, value: normal, kind: place }

  # M10.11: a place burnt out or torn down: the area is in a panic for a few days.
  - id: place_destroyed
    signal: place_destroyed
    fact: { key: state, value: destroyed, kind: place }

  # M8.2: the brain plans.

  # A household that rose two standings (money against the middle of the region).
  - id: rose_in_standing
    signal: rose_in_standing
    probe: { standing_rise: 2 }

  # A quarrel: a grudge between two, until someone makes peace.
  - id: quarrel
    signal: quarrel
    fact: { kind: quarrel }
    who: [$about]
    belang: 1

  # A grudge that lasted a week is a feud.
  - id: feud
    signal: feud
    probe: { grudge: 7 }

  # Someone believes a warning that a dyke leaks: they carry word to the dyke reeve.
  - id: warned
    signal: warned
    belief: { key: state, value: leaking }

  # Someone hears the stranger was asking after them (M10.3): they may go and find out why.
  - id: asked_about
    signal: asked_about
    belief: { key: asked_about }

  # Someone hears that a workshop works again (M10.3): whoever's trade needs what it makes goes there.
  - id: heard_working
    signal: heard_working
    belief: { key: working, value: yes }

  # People from elsewhere who have stayed a week: the one of the village who likes them least has a choice to make.
  - id: strangers_stay
    signal: strangers_stay
    probe: { strangers_stay: 5 }

  # Too many newcomers for the village, and food short: friction.
  - id: friction
    signal: friction
    probe: { friction: 0.6 }

  # The economy (M8.4): what the ledgers of the settlements show.
  # A good short two days running: for the shopkeepers who sell it ($a), $area, $value the good.
  - id: shortage
    signal: shortage
    probe: { shortage: 2 }
    belang: 2

  # Still short after a week: the whole place feels it.
  - id: long_shortage
    signal: shortage
    event: lasting
    probe: { shortage: 7 }
    belang: 3

  # More than twice what the place keeps, five days running.
  - id: surplus
    signal: surplus
    probe: { surplus: 5 }
    belang: 2

  # A counter asking twice the worth of a good or more.
  - id: price_doubled
    signal: price_doubled
    probe: { price_doubled: 2 }
    belang: 2

  # A workshop nobody has worked for two weeks: the village notices.
  - id: missing_trade
    signal: missing_trade
    probe: { missing_trade: 14 }
    belang: 3

  # A trade route closed: $subject the route.
  - id: route_closed
    signal: route_closed
    fact: { key: route, value: closed }
    who: []
    belang: 3

  # M8.5: trouble from the east, and Waagdam a trading town: the town wants a wall (design, scenario 8).
  - id: threat_from_the_east
    signal: threat
    when: [{ tension: [nethermarch, rijkland], at_least: 60 }, { character: waagdam, is: trade_town }]
    who: [npc_aleid]
    place: loc_waagdam_town_hall
    belang: 3

  # M9.1: a settlement finished what it was building. What it built may change what it is.
  - id: project_done
    signal: project_done
    fact: { key: project, value: done }

  # Warm towards the stranger for three days, with something shared (M10.3): a friend.
  - id: befriended
    signal: befriended
    probe: { befriended: 3 }

  # M10.14: good news has an aftermath too. De Zwaan turns again (a mended windmill); the dyke held in time.
  - id: mill_turning
    signal: mill_turning
    fact: { kind: "repaired:windmill" }

  - id: danger_passed
    signal: danger_passed
    fact: { key: state, value: normal, kind: danger }

  # The pulse (M10.24): never by themselves. When the stranger has had nothing new
  # near them for days and the chronicler brought nothing, the rule sets one of
  # these off where they are, never two of a kind in a row: Kobus the pedlar
  # comes by, weather is on its way, someone near has an errand.
  - id: pulse_pedlar
    signal: pulse_pedlar
    probe: { pulse: visitor }

  - id: pulse_weather
    signal: pulse_weather
    probe: { pulse: tiding }

  - id: pulse_errand
    signal: pulse_errand
    probe: { pulse: request }
