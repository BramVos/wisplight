    tags: [medicine, trade]
    value: 16
    remedy: { heal: 1d8, cures: [bleeding, sickened, fen_fever] }

  - id: wool
    name: fleece
    plural: fleeces
    aliases: [wool, wol]
    description: A greasy fleece from the heath sheep.
    tags: [trade]
    value: 16

  - id: yarn
    name: skein of yarn
    plural: skeins of yarn
    aliases: [yarn, garen]
    description: Grey woollen yarn, spun tight and even.
    tags: [trade]
    value: 24

  - id: sailcloth
    name: bolt of sailcloth
    plural: bolts of sailcloth
    aliases: [sailcloth, canvas, zeildoek]
    description: Heavy canvas, rolled tight. Good for sails and not much else.
    tags: [material, trade]
    value: 200

  - id: lantern
    name: lantern
    aliases: [lamp, lantaarn]
    description: A tin lantern with horn panes. Without oil it is just a tin box.
    tags: [tool, light]
    value: 160

  - id: lamp_oil
    name: jug of lamp oil
    plural: jugs of lamp oil
    aliases: [oil, lamp oil, lampolie]
    description: A stoppered jug of rapeseed oil for lamps.
    tags: [fuel]
    value: 24

  - id: saw
    name: saw
    aliases: [zaag, handsaw, bow saw]
    description: A bow saw with a blade worn thin from years of mill timber, the handle dark with grease.
    tags: [tool]
    value: 18

  - id: knife
    name: knife
    aliases: [mes]
    description: A plain working knife with a horn handle.
    tags: [tool, weapon]
    value: 48
    weapon: { damage: 1d4, light: true, crit: bleeding, iron: true }

  - id: iron_nails
    name: handful of iron nails
    plural: handfuls of iron nails
    aliases: [nails, nail, iron nails, spijkers]
    description: Square iron nails, still dark from the forge. Old women hammer them into doorsteps against the Haakman.
    tags: [material, iron]
    value: 8


  - id: scrap_iron
    name: piece of scrap iron
    plural: pieces of scrap iron
    aliases: [scrap, scrap iron, schroot]
    description: A twisted bit of iron that cracked under the hammer. A smith takes it for the scrap heap, and it can go back in the fire.
    tags: [material, iron]
    value: 3
    quality: poor
  - id: surveyors_chain
    name: surveyor's chain
    plural: surveyor's chains
    aliases: [chain, chains, measuring chain, surveyor's chains, meetketting, meetkettingen]
    description: A long chain of iron links with brass tags every ten ells, the kind the Count's surveyor measures the fen with.
    tags: [tool, survey, iron]
    value: 120

  - id: rope
    name: coil of rope
    plural: coils of rope
    aliases: [rope, touw]
    description: Hemp rope, about ten ells of it.
    tags: [tool]
    value: 12

  # Weapons and armour (FO, chapter 12). Damage is the weapon die; Might adds
  # to it for weapons used up close.

  - id: spear
