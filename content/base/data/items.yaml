# Prices are in duiten: 1 stuiver = 8 duiten, 1 guilder = 20 stuivers.

items:
  - id: lubberts_key
    name: iron key
    aliases: [key, iron key, sleutel]
    description: A heavy iron key on a greasy string, the kind that opens a strongbox.
    tags: [key]
    value: 2

  - id: rye_grain
    name: sack of rye
    plural: sacks of rye
    aliases: [rye, grain, graan, rogge, sheaf, last sheaf]
    description: A coarse sack of rye grain, heavy as a sleeping child.
    tags: [grain, trade]
    value: 24

  - id: flour
    name: sack of flour
    plural: sacks of flour
    aliases: [flour, meel]
    description: Rye flour, grey and fine, in a sack that leaves white on your sleeve.
    tags: [trade]
    value: 36

  - id: rye_bread
    name: loaf of rye bread
    plural: loaves of rye bread
    aliases: [bread, loaf, rye bread, brood, roggebrood]
    description: A dense, dark loaf with a crust you could knock on.
    tags: [food, bread]
    value: 2
    food: 35


  # M10.14: what a failed batch leaves. Poorer, of use for something else, worth less.
  - id: burnt_loaf
    name: burnt loaf
    plural: burnt loaves
    aliases: [burnt bread, burnt loaves, verbrand brood]
    description: A loaf burnt black outside and doughy within. The pigs won't mind, and hungry people won't either.
    tags: [food]
    value: 1
    food: 10
    quality: poor
    of: rye_bread
  - id: peat
    name: basket of peat
    plural: baskets of peat
    aliases: [peat, turf]
    description: Dried blocks of peat, brown and fibrous. They burn slow and smell of the fen.
    tags: [fuel, trade]
    value: 2

  - id: eel
    name: eel
    aliases: [paling]
    description: A fresh eel from the fen, still glistening.
    tags: [food, fish]
    value: 1
    food: 15

  - id: smoked_eel
    name: smoked eel
    plural: smoked eels
    aliases: [gerookte paling]
    description: A smoked eel, golden and oily, wrapped in a dock leaf.
    tags: [food, fish]
    value: 2
    food: 25

  - id: beer
    name: mug of beer
    plural: mugs of beer
    aliases: [beer, ale, bier]
    description: Thin brown beer from the priory brewery. It tastes of bread and smoke.
    tags: [drink]
    value: 1
    food: 5

  - id: hot_meal
    name: bowl of stew
    plural: bowls of stew
    aliases: [stew, meal, hot meal, stoofpot, maaltijd]
    description: Eel and barley stew, thick enough to stand a spoon in.
    tags: [food]
    value: 4
    food: 60

  - id: apple
    name: apple
    aliases: [appel]
    description: A small, sour apple.
    tags: [food]
    value: 1
    food: 10

  - id: herbs
    name: bundle of herbs
    plural: bundles of herbs
    aliases: [herbs, kruiden]
