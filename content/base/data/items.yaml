    tags: [armour]
    value: 80
    armour: { kind: light, defence: 2, cap: 3 }

  - id: brigandine
    name: brigandine
    aliases: [scale vest]
    description: Small iron plates riveted inside a canvas vest.
    tags: [armour, iron]
    value: 240
    armour: { kind: medium, defence: 3, cap: 2 }

  - id: chain_shirt
    name: chain shirt
    plural: chain shirts
    aliases: [mail, maliënkolder]
    description: A shirt of riveted rings, oiled against the damp of the fen.
    tags: [armour, iron]
    value: 400
    armour: { kind: heavy, defence: 4, cap: 1 }

  - id: round_shield
    name: round shield
    plural: round shields
    aliases: [shield, schild]
    description: A round shield of limewood with an iron boss.
    tags: [armour]
    value: 64
    armour: { kind: shield, defence: 2 }

  # Quest things (M7).
  - id: milk
    name: jug of milk
    plural: jugs of milk
    aliases: [milk, melk, bowl of milk, jug]
    description: Fresh milk in a stone jug, still smelling faintly of cow.
    tags: [food]
    value: 2
    food: 10

  - id: moon_water
    name: flask of moon water
    plural: flasks of moon water
    aliases: [moon water, moonwater, maanwater, flask]
    description: Black water from the Blackmere, drawn at night. It is heavier than water should be.
    tags: [magic]
    value: 0

  - id: cat_draught
    name: bottle of cat's draught
    plural: bottles of cat's draught
    aliases: [draught, potion, cat draught, cat's draught, brew, drankje]
    description: A small brown bottle of Aaltje's. It smells of valerian and river mud.
    tags: [remedy, magic]
    value: 0

  - id: measuring_chest
    name: measuring chest
    plural: measuring chests
    aliases: [chest, measuring chest, jacob's chest, meetkist, kist]
    description: An iron-bound chest with JvD burnt into the lid. Inside are a brass level, a folded chain and bundles of figures in a careful hand.
    tags: [tool, survey]
    value: 60

  - id: fen_charter_deed
    name: the Fen Charter
    plural: copies of the Fen Charter
    aliases: [charter, fen charter, the charter, veenhandvest, handvest]
    description: A brown parchment in a lead case, with a great seal on a cord. It grants the villages of the Holleveen the fen they cut, for as long as they cut it.
    tags: [document]
    value: 0

  - id: toll_letter
    name: toll letter
    plural: toll letters
    aliases: [letter, toll letter, tolbrief]
    description: A sealed letter granting a lawful toll of eight duiten a boat on the Vaart, for keeping it clear of reed.
    tags: [document]
    value: 0

  - id: aaltje_letter
    name: letter from Aaltje
    plural: letters from Aaltje
    aliases: [letter, aaltje's letter, brief]
    description: A letter folded very small, in Aaltje's careful, round hand. You haven't read it.
    tags: [document]
    value: 0


  # M8.5: growth. What a cooper makes, and what a brickworks takes and gives.
  - id: barrel
    name: barrel
    plural: barrels
    aliases: [ton, cask, tun]
    description: An oak barrel, hooped with iron, the kind eel is packed in for the barges.
    tags: [container]
    value: 40

  - id: clay
    name: basket of clay
    plural: baskets of clay
    aliases: [clay, klei]
    description: Heavy grey clay dug from the bank of the Vaart, still wet.
    tags: [material]
    value: 2

  - id: brick
    name: brick
    plural: bricks
    aliases: [bricks, baksteen]
    description: A hard yellow-red brick, fired with peat in a kiln by the Vaart.
    tags: [material]
    value: 3

  # M10.5: what the stranger can make.
  - id: apple_cake
    name: apple cake
    plural: apple cakes
    aliases: [cake, apple cake, appelkoek, koek]
