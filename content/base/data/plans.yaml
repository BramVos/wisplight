# Effect plans for big events (design: lore and world change, "Grote
# gebeurtenissen"). A plan runs in phases, hours after it starts, with effects
# from a fixed vocabulary the system can check. Near the player people really
# pack up and walk; far off they become notes. Quests react to the state of
# places and people that follows (quests/engine.ts, on_place and on_death).

plans:
  # The dyke reeve calls out the dyke (M10.6): convinced of the leak, Sijbrand sends for the men of Veenhoek, and with
  # clay and brushwood they pack it before it opens (hours on the dyke: the goal Guard). The breach does not come.
  - id: dyke_muster
    name: Sijbrand calls out the dyke
    topic: dyke
    expires: 2
    groups:
      hands: { npcs: [npc_gerrit, npc_jan_visser, npc_wouter, npc_everhard] }
    steps:
      - id: mustered
        do: { set: dyke_mustered }
      - id: call
        after: mustered
        do:
          tell:
            kind: danger
            about: [npc_sijbrand, loc_oude_zijl_dyke]
            place: loc_oude_zijl_sluice
            belang: 3
            title: Sijbrand calls out the dyke
            precise: "Heemraad Sijbrand has sent to Veenhoek for every man with a spade: clay and brushwood to the dyke at Oude Zijl, before the leak opens."
            village: "Sijbrand's calling every man to the dyke at Oude Zijl. Bring a spade!"
            far: "They are out on a dyke in the Holleveen, packing a leak."
      - id: called
        after: call
        do: { news: "Sijbrand has sent to Veenhoek for every man with a spade. Clay and brushwood to the dyke, before the leak opens!", area: oude_zijl }
      - id: called_veenhoek
        after: call
        do: { news: "Sijbrand's calling every man to the dyke at Oude Zijl. Spades and brushwood, now!", area: veenhoek }
      - id: reeve
        after: call
        do: { goal: Guard, who: npc_sijbrand, target: loc_oude_zijl_dyke, priority: 0.95, hours: 8 }
      - id: hands
        after: call
        each: hands
        do: { goal: Guard, who: $who, target: loc_oude_zijl_dyke, priority: 0.95, hours: 8 }
      - id: shored
        at: { hours: 5 }
        when: [{ not_flag: dyke_broke }]
        do: { set: dyke_shored }
      - id: held
        after: shored
        when: [{ flag: dyke_shored }]
        do: { news: "The leak is packed with clay and brushwood, and the dyke at Oude Zijl holds.", area: oude_zijl }
      - id: shored_news
        after: shored
        when: [{ flag: dyke_shored }]
        do:
          tell:
            kind: danger
            about: [npc_sijbrand, loc_oude_zijl_dyke]
            place: loc_oude_zijl_dyke
            belang: 3
            title: the dyke at Oude Zijl was shored in time
            precise: "Sijbrand called out Oude Zijl and Veenhoek, and they packed the leak with clay and brushwood before it could open."
            village: "They stopped the leak at Oude Zijl in time, thank the saints. Sijbrand had every man out on the dyke."
            far: "A dyke nearly broke in the Holleveen."
            claim: { subject: loc_oude_zijl_dyke, key: state, value: normal }

  - id: dyke_breach
    name: The dyke breaks at Oude Zijl
    groups:
      # The Vissers stay: Grietje won't leave without the cat, and the cat won't leave the doorstep.
      veenhoek: { areas: [veenhoek], except: [npc_grietje_visser, npc_pim, npc_jan_visser] }
      molenend: { areas: [molenend] }
    phases:
      - after: 0
        effects:
          - { place: loc_oude_zijl_dyke, state: damaged }
          - { place: loc_veenhoek_quay, state: flooded }
          - { place: loc_peat_sheds, state: flooded }
          - { place: loc_towpath_w, state: flooded }
          - { place: loc_towpath_e, state: flooded }
          - { close: [loc_veenhoek_quay, loc_towpath_w], reason: "The tow path is under brown water as far as you can see." }
          - { close: [loc_gerrit_house, loc_towpath_e], reason: "The tow path is under brown water as far as you can see." }
          - { news: "The dyke at Oude Zijl has broken, and the water is in Veenhoek.", area: veenhoek }
          # The mood of Veenhoek (M10.11): panic while the water comes, grief when it goes.
          - { mood: veenhoek, kind: panic, days: 3, line: "People wade past with what they could carry, and nobody stops to talk.", prompt: "The dyke has broken and the water is in Veenhoek; everyone is frightened and busy saving what they can." }
          - { fact: { title: the dyke broke at Oude Zijl, precise: "The dyke at Oude Zijl broke in the night and the water ran into Veenhoek.", village: "The dyke's gone at Oude Zijl! The water's in Veenhoek, run for the high ground!", far: "A dyke broke in the Holleveen and a village went under.", belang: 5, about: [who_will_not_dyke, water_wolf], place: loc_oude_zijl_dyke } }
      - after: 1
        effects:
          - { place: loc_veenhoek_green, state: flooded }
          - { place: loc_visser_house, state: flooded }
          - { place: loc_gerrit_house, state: flooded }
          - { flee: veenhoek, to: loc_waagdam_church, days: 7 }
      - after: 6
        effects:
          - { place: loc_veenhoek_bakery, state: flooded }
          - { place: loc_aaltje_cottage, state: flooded }
          - { place: loc_molenend_field, state: flooded }
          - { flee: molenend, to: loc_goose_common, days: 4 }
          - { market: flour, factor: 0.5 }
          - { market: rye_grain, factor: 0.6 }
      - after: 72
        effects:
          - { mood: veenhoek, kind: grief, days: 7, line: "Mud lines every wall at the height the water reached, and people talk low about what was lost.", prompt: "The flood has gone down; people mourn what they lost and are short of everything." }
          - { place: loc_veenhoek_quay, state: damaged }
          - { place: loc_veenhoek_green, state: damaged }
          - { place: loc_visser_house, state: damaged }
          - { place: loc_gerrit_house, state: damaged }
          - { place: loc_peat_sheds, state: damaged }
          - { place: loc_towpath_w, state: normal }
          - { place: loc_towpath_e, state: normal }
          - { place: loc_veenhoek_bakery, state: damaged }
          - { place: loc_aaltje_cottage, state: damaged }
          - { place: loc_molenend_field, state: normal }
          - { open: [loc_veenhoek_quay, loc_towpath_w] }
          - { open: [loc_gerrit_house, loc_towpath_e] }
          - { news: "The water is going down in Veenhoek, and people are going home to the mud.", area: veenhoek }
      - after: 240
        effects:
          - { market: flour, factor: 1 }
          - { market: rye_grain, factor: 1 }

  # The missing girl without the stranger (M10.6): Veenhoek hears that Grietje took the grey cat in.
  - id: cat_taken_in
    name: Grietje takes the grey cat in
    phases:
      - after: 0
        effects:
          - { news: "Grietje Visser has taken the grey cat in off the doorstep. The widow stopped waiting, they say, and the girl stays a cat.", area: veenhoek }

  - id: fen_closed
    name: The widow closes the fen
    phases:
      - after: 0
        effects:
          - { close: [loc_kattenbroek_edge, loc_kattenbroek_reedpaths], reason: "Mist stands on the reed paths like a wall. You walk in, and you walk out where you started." }
          - { close: [loc_kattenbroek_edge, loc_kattenbroek_hut], reason: "Mist stands between you and the hut like a wall. Somewhere in it, a cat laughs." }
          - { news: "The Kattenbroek is closed in mist, and nobody who goes in finds the widow's hut.", area: kattenbroek }
          - { fact: { title: mist over the Kattenbroek, precise: "The widow closed the Kattenbroek in mist when her patience ran out.", village: "The Kattenbroek's all mist now. You go in and come out where you started.", far: "A fen in the Holleveen is said to be bewitched.", belang: 3, about: [cat_widow, kattenbroek] } }

  - id: soldiers_come
    name: The Count sends soldiers
    phases:
      - after: 96
        effects:
          - { place: loc_route_peat_pits, state: occupied }
          - { news: "Soldiers of the Count have camped at the peat pits. They ask everyone their name.", area: veenhoek }
          - { fact: { title: the Count's soldiers at the peat pits, precise: "The Count sent soldiers to the Holleveen after his surveyor was chased off.", village: "Soldiers! At the peat pits, asking everyone their name!", far: "The Count has sent soldiers into the Holleveen.", belang: 4, about: [the_count, drainage], place: loc_route_peat_pits } }

  - id: war
    name: War
    phases:
      - after: 0
        effects:
          # The Oostweg is shut: no more lamp oil and nails from Zwolderkamp (economy.yaml).
          - { close_route: zwolderkamp_oostweg, why: the Count's soldiers hold the toll gate }
          - { market: lamp_oil, factor: 0.5 }
          - { market: iron_nails, factor: 0.5 }
          - { news: "There's war, and the Oostweg is shut. No more carts from Zwolderkamp.", area: waagdam }
      - after: 48
        effects:
          - { place: loc_waagdam_harbour, state: occupied }
          - { market: rye_grain, factor: 0.7 }
          - { news: "Soldiers hold the harbour at Waagdam, and the barges are searched.", area: waagdam }
      - after: 336
        effects:
          - { place: loc_waagdam_harbour, state: normal }
          - { open_route: zwolderkamp_oostweg }
          - { market: lamp_oil, factor: 1 }
          - { market: iron_nails, factor: 1 }
          - { market: rye_grain, factor: 1 }

  # A danger with its own clock (M8.2; design: "Een wedloop die niemand plant").
  # Whoever is at the dyke sees the leak. If the dyke reeve comes to believe
  # it within two days, he has it shored; if not, the dyke breaks. Whether
  # word reaches him in time follows from who believes whom, and the walk.
  - id: dyke_leak
    name: The dyke at Oude Zijl leaks
    topic: dyke
    expires: 4
    steps:
      - id: leak
        do:
          tell:
            kind: danger
            about: [loc_oude_zijl_dyke]
            place: loc_oude_zijl_dyke
            belang: 2
            title: the dyke at Oude Zijl leaks
            precise: "Water is seeping through the dyke at Oude Zijl, low down on the land side, and the seep is growing."
            village: "The dyke's leaking at Oude Zijl, they say!"
            far: "A dyke is leaking somewhere, they say."
            claim: { subject: loc_oude_zijl_dyke, key: state, value: leaking }
            # Teunis from Waagdam comes upon it on the dyke road while the dyke reeve is at home (M8.2 scenario;
            # without a finder nobody ever knew, found in the M9.4 playtest).
            witnesses: [npc_teunis]
      # Convinced (M10.6): Sijbrand believes it, by a persuasion with Teunis's word behind it, by Teunis himself, or
      # by his own eyes on the dyke. A stranger's word alone is not enough; then he calls out the village.
      - id: shored
        after: leak
        when: [{ knows: { who: npc_sijbrand, subject: loc_oude_zijl_dyke, key: state, value: leaking } }, { not_flag: dyke_broke }]
        otherwise: wait
        do: { plan: dyke_muster }
      - id: breach
        at: { days: 2 }
        when: [{ not_flag: dyke_shored }, { not_flag: dyke_mustered }]
        do: { plan: dyke_breach }
      - id: broke
        after: breach
        when: [{ not_flag: dyke_shored }, { not_flag: dyke_mustered }]
        do: { set: dyke_broke }
      - id: proven
        after: broke
        when: [{ flag: dyke_broke }]
        do:
          tell:
            kind: danger
            about: [loc_oude_zijl_dyke]
            place: loc_oude_zijl_dyke
            belang: 3
            title: the dyke at Oude Zijl was leaking after all
            precise: "The dyke at Oude Zijl had been leaking, as the stranger said, and now it has given way."
            village: "It was leaking all along, the dyke! And now look."
            far: "A dyke gave way where a stranger said it would."
            claim: { subject: loc_oude_zijl_dyke, key: state, value: leaking }

  # The opponents do not wait for the player (Wereldboek, chapter 14; M8.3, in
  # place of the scripted antagonists): Cornelis measures a sector every
  # working evening, Gerrit pulls up stakes at night, Cornelis hires the
  # Goat-Riders, the schout arrests a peat-cutter, and the Haakman counts the
  # nights the mill pumps his water. They run from the first day (world.yaml,
  # plans). Every step comes again each day (every); the flags in between are
  # how one step tells the next what happened this evening or this night.
  - id: holleveen_survey
    name: Cornelis measures the Holleveen
    topic: survey
    steps:
      - id: survey_begins
        do: { clock: { id: survey, name: Survey of the Holleveen, size: 8, full: "Cornelis sends his report to Graafhaven. In spring the digging begins." } }
      # A working evening with his chain, no halt, no pulled stakes, and the pits as they were.
      - id: measures
        at: { hour: 18 }
        every: 1
        when:
          - { not: { clock_full: survey } }
          - { not: { weekday: Rustdag } }
          - { around: npc_cornelis }
          - { carries: npc_cornelis, item: surveyors_chain }
          - { not_flag: survey_halted }
          - { not_flag: stakes_pulled_today }
          - { place_state: loc_route_peat_pits, is: normal }
        do: { set: measured_today }
      # The widow counts the days the chains lie still: her price for Fenna.
      - id: lies_still
        at: { hour: 18 }
        every: 1
        when: [{ not: { clock_full: survey } }, { not_flag: measured_today }, { any: [{ not: { weekday: Rustdag } }, { flag: survey_halted }] }]
        do: { count: survey_quiet_days }
      - id: stakes_back
        at: { hour: 18 }
        every: 1
        when: [{ not: { clock_full: survey } }]
        do: { unset: stakes_pulled_today }
      - id: quiet_ends
        at: { hour: 18 }
        every: 1
        when: [{ flag: measured_today }]
        do: { set: survey_quiet_days, value: 0 }
      - id: sector
        at: { hour: 18 }
        every: 1
        when: [{ flag: measured_today }]
        do: { tick: survey }
      - id: half
        at: { hour: 18 }
        every: 1
        when: [{ flag: measured_today }, { clock: survey, at_least: 4 }, { not: { clock: survey, at_least: 5 } }]
        do: { fact: { kind: survey, title: half the fen measured, precise: "Master Cornelis has measured half of the Holleveen for the drainage.", village: "The surveyor's measured half the fen already. Half!", far: "The Count is having the Holleveen measured.", belang: 3, about: [npc_cornelis, drainage], place: loc_route_peat_pits } }
      - id: mist
        at: { hour: 18 }
        every: 1
        when: [{ flag: measured_today }, { clock: survey, at_least: 6 }]
        do: { set: widow_mist }
      # The survey done: the report goes to Graafhaven, and Cornelis with it.
      - id: polder
        at: { hour: 18 }
        every: 1
        when: [{ flag: measured_today }, { clock_full: survey }]
        do: { set: polder_coming }
      - id: fen_dies
        at: { hour: 18 }
        every: 1
        when: [{ flag: measured_today }, { clock_full: survey }]
        do: { set: fen_dying }
      - id: to_graafhaven
        at: { hour: 18 }
        every: 1
        when: [{ flag: measured_today }, { clock_full: survey }, { alive: npc_cornelis }]
        do: { vanish: npc_cornelis }
      - id: report
        at: { hour: 18 }
        every: 1
        when: [{ flag: measured_today }, { clock_full: survey }]
        do: { fact: { kind: survey, title: the survey of the Holleveen finished, precise: "Master Cornelis finished the survey of the Holleveen and took his report to Graafhaven.", village: "The survey's done. They'll start digging in spring, God help us.", far: "The Count's survey of the Holleveen is finished.", belang: 4, about: [drainage], place: loc_route_peat_pits } }
      - id: evening_over
        at: { hour: 18 }
        every: 1
        do: { unset: measured_today }

  - id: holleveen_stakes
    name: Stakes in the night, and the schout
    topic: stakes
    steps:
      # Gerrit pulls stakes once the survey is under way; less often once the Goat-Riders guard them.
      - id: pulls
        at: { hour: 2 }
        every: 1
        chance: 0.3
        when: [{ not: { clock_full: survey } }, { not_flag: survey_halted }, { clock: survey, at_least: 2 }, { around: npc_gerrit }, { not_flag: gerrit_arrested }, { any: [{ not_flag: goat_riders_hired }, { flag: riders_quiet }] }]
        do: { set: pulled_tonight }
      - id: pulls_guarded
        at: { hour: 2 }
        every: 1
        chance: 0.15
        when: [{ not: { clock_full: survey } }, { not_flag: survey_halted }, { clock: survey, at_least: 2 }, { around: npc_gerrit }, { not_flag: gerrit_arrested }, { flag: goat_riders_hired }, { not_flag: riders_quiet }]
        do: { set: pulled_tonight }
      - id: stakes_out
        at: { hour: 2 }
        every: 1
        when: [{ flag: pulled_tonight }]
        do: { set: stakes_pulled_today }
      - id: counted
        at: { hour: 2 }
        every: 1
        when: [{ flag: pulled_tonight }]
        do: { count: gerrit_pulled }
      - id: sabotage
        at: { hour: 2 }
        every: 1
        when: [{ flag: pulled_tonight }]
        do: { fact: { kind: sabotage, title: "the surveyor's stakes pulled up", precise: "Somebody pulled up the surveyor's stakes at the peat pits in the night.", village: "Somebody pulled all the surveyor's stakes out last night. Can't think who.", far: "There is trouble over the drainage in the Holleveen.", belang: 2, about: [drainage], place: loc_route_peat_pits } }
      - id: night_over
        at: { hour: 2 }
        every: 1
        do: { unset: pulled_tonight }
      # Cornelis answers by hiring the Goat-Riders to guard his stakes.
      - id: riders_news
        at: { hour: 2 }
        every: 1
        when: [{ count: gerrit_pulled, at_least: 1 }, { not_flag: goat_riders_hired }, { not_flag: riders_quiet }, { around: npc_cornelis }]
        do: { fact: { kind: hired, title: the surveyor hired the Goat-Riders, precise: "Master Cornelis has hired the Goat-Riders to guard his stakes at night.", village: "The surveyor's paying the Goat-Riders to guard his stakes now. Imagine.", far: "Robbers guard the Count's surveyor in the Holleveen.", belang: 3, about: [npc_cornelis, goat_riders], place: loc_goose_common } }
      - id: riders_hired
        at: { hour: 2 }
        every: 1
        when: [{ count: gerrit_pulled, at_least: 1 }, { not_flag: goat_riders_hired }, { not_flag: riders_quiet }, { around: npc_cornelis }]
        do: { set: goat_riders_hired }
      # After the second night of pulled stakes the schout locks up a peat-cutter: Gerrit, or else Jan Visser.
      - id: arrest_gerrit
        at: { hour: 2 }
        every: 1
        when: [{ count: gerrit_pulled, at_least: 2 }, { not_flag: peat_cutter_arrested }, { around: npc_everhard }, { around: npc_gerrit }]
        do: { fact: { kind: arrest, title: Gerrit Turfsteker arrested, precise: "Schout Everhard arrested Gerrit Turfsteker for pulling up the surveyor's stakes.", village: "The schout's locked up Gerrit Turfsteker! Over the stakes.", far: "A peat-cutter was arrested in the Holleveen.", belang: 3, about: [npc_gerrit, npc_everhard], place: loc_schout_house } }
      - id: gerrit_locked_up
        at: { hour: 2 }
        every: 1
        when: [{ count: gerrit_pulled, at_least: 2 }, { not_flag: peat_cutter_arrested }, { around: npc_everhard }, { around: npc_gerrit }]
        do: { send: npc_gerrit, to: loc_schout_house, hours: 48 }
      - id: gerrit_held
        at: { hour: 2 }
        every: 1
        when: [{ count: gerrit_pulled, at_least: 2 }, { not_flag: peat_cutter_arrested }, { around: npc_everhard }, { around: npc_gerrit }]
        do: { set: gerrit_arrested }
      - id: gerrit_since
        at: { hour: 2 }
        every: 1
        when: [{ count: gerrit_pulled, at_least: 2 }, { not_flag: peat_cutter_arrested }, { around: npc_everhard }, { around: npc_gerrit }]
        do: { stamp: gerrit_locked_up }
      - id: gerrit_it_was
        at: { hour: 2 }
        every: 1
        when: [{ count: gerrit_pulled, at_least: 2 }, { not_flag: peat_cutter_arrested }, { around: npc_everhard }, { around: npc_gerrit }]
        do: { set: peat_cutter_arrested, value: npc_gerrit }
      - id: arrest_jan
        at: { hour: 2 }
        every: 1
        when: [{ count: gerrit_pulled, at_least: 2 }, { not_flag: peat_cutter_arrested }, { around: npc_everhard }, { around: npc_jan_visser }]
        do: { fact: { kind: arrest, title: Jan Visser arrested, precise: "Schout Everhard arrested Jan Visser for pulling up the surveyor's stakes.", village: "The schout's locked up Jan Visser! Over the stakes.", far: "A peat-cutter was arrested in the Holleveen.", belang: 3, about: [npc_jan_visser, npc_everhard], place: loc_schout_house } }
      - id: jan_locked_up
        at: { hour: 2 }
        every: 1
        when: [{ count: gerrit_pulled, at_least: 2 }, { not_flag: peat_cutter_arrested }, { around: npc_everhard }, { around: npc_jan_visser }]
        do: { send: npc_jan_visser, to: loc_schout_house, hours: 48 }
      - id: jan_it_was
        at: { hour: 2 }
        every: 1
        when: [{ count: gerrit_pulled, at_least: 2 }, { not_flag: peat_cutter_arrested }, { around: npc_everhard }, { around: npc_jan_visser }]
        do: { set: peat_cutter_arrested, value: npc_jan_visser }
      # Two days on, Gerrit is out again.
      - id: gerrit_out
        at: { hour: 2 }
        every: 1
        when: [{ flag: gerrit_arrested }, { since: gerrit_locked_up, hours: 48 }]
        do: { unset: gerrit_arrested }

  - id: the_haakman_counts
    name: The Haakman counts the nights
    topic: haakman
    steps:
      # Every second night the mill pumps his water, the Haakman's patience runs shorter.
      - id: patience
        at: { days: 1, hour: 2 }
        every: 2
        when: [{ object: loc_molenend_mill/de_zwaan, state: { broken: false } }, { not_flag: haakman_at_peace }, { not_flag: haakman_revenge_done }]
        do: { clock: { id: haakman_revenge, name: "The Haakman's revenge", size: 4, full: "The water rises against the dyke at Oude Zijl." } }
      - id: counts
        at: { days: 1, hour: 2 }
        every: 2
        when: [{ object: loc_molenend_mill/de_zwaan, state: { broken: false } }, { not_flag: haakman_at_peace }, { not_flag: haakman_revenge_done }]
        do: { tick: haakman_revenge }
      - id: revenge
        at: { days: 1, hour: 2 }
        every: 2
        when: [{ clock_full: haakman_revenge }, { not_flag: haakman_revenge_done }]
        do: { plan: dyke_breach }
      - id: revenge_done
        at: { days: 1, hour: 2 }
        every: 2
        when: [{ clock_full: haakman_revenge }]
        do: { set: haakman_revenge_done }
