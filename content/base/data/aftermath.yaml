# The standard aftermath (design: signalen en nasleep, M8.1): what follows a
# signal by the rules, always, also without AI. Each is a plan of steps over
# days, with a moment (at, after), a condition on what someone knows or what
# is true (when), and one verb (do). The people of the signal are $a and $b,
# its place $place (and its area $area), its claim $subject and $value.
# Every step that is done is news, by the usual ways.

aftermath:
  # Two will marry: a feast on the first rest day at least a week on, near
  # the one who moves, with both families; the feast is the wedding.
  - id: betrothal
    signal: life_event
    event: betrothal
    topic: wedding
    expires: 30
    steps:
      - id: feast
        at: { days: 7, hour: 16, rest_day: true }
        do: { feast: { social_near: { mover: [$a, $b] } }, hours: 6, guests: [$a, $b, { family_of: $a }, { family_of: $b }] }
      - id: wed
        after: feast
        wait: 1
        do:
          tell:
            kind: wedding
            about: [$a, $b]
            place: { step: feast }
            belang: 3
            title: "{a} and {b} are married"
            precise: "{a} and {b} were married at {place}, and half the district came to drink to them."
            village: "{a} and {b} are married! There was a feast at {place}."
            far: "There was a wedding in the Holleveen."
            claim: { subject: $a, key: married, value: $b }

  # Married: the tie, one house (the player or whoever still lives with a
  # parent moves in with the other), the in-laws, a spouse who expects the
  # player home, and work that is now too far away.
  - id: wedding
    signal: life_event
    event: wedding
    topic: household
    expires: 5
    steps:
      - id: tie
        do: { set_tie: [$a, $b], role: spouse, bond: 3 }
      - id: home
        after: tie
        do: { join_household: { mover: [$a, $b] }, of: { stayer: [$a, $b] } }
      - id: in_laws
        after: tie
        do: { regard: [{ family_of: $b }], to: $a, affinity: 10 }
      - id: in_laws_too
        after: tie
        do: { regard: [{ family_of: $a }], to: $b, affinity: 10 }
      - id: expects
        after: home
        when: [{ is_player: $mover }]
        do: { expect_home: $stayer, of: $mover, nights: 5 }
      - id: work
        after: home
        wait: 12
        when: [{ has_work: $mover }, { commute: $mover, at_least: 30 }]
        do: { quit_work: $mover }

  # Ran off together: away down the Vaart for three weeks, and back married,
  # without a feast and without the family's blessing.
  - id: eloped
    signal: eloped
    topic: wedding
    expires: 40
    steps:
      - id: go
        at: { hour: 22 }
        do: { leave: [$a, $b], to: graafhaven, days: 21 }
      - id: back
        after: go
        wait: 520
        do:
          tell:
            kind: wedding
            about: [$a, $b]
            place: { home_of: $a }
            belang: 3
            title: "{a} and {b} came back married"
            precise: "{a} and {b} came back from Graafhaven married, with a paper from a city chapel to prove it."
            village: "{a} and {b} are back, and married, if you please!"
            far: "Two who ran off to the city came back married."
            claim: { subject: $a, key: married, value: $b }

  # A place is open: a notice on the nearest board, the one who needs help
  # thinks about it, and someone without work who heard of it takes it.
  - id: vacancy
    signal: vacancy
    topic: vacancy
    expires: 30
    steps:
      - id: notice
        do:
          post: { board_near: $at }
          fact:
            kind: notice
            about: [$b]
            belang: 2
            title: "{b} needs help at {at}"
            precise: "A note on the board: help wanted at {at}, ask for {b}."
            village: "{b} is looking for someone at {at}, they say."
            far: "Someone is looking for help."
            claim: { subject: $subject, key: vacancy, value: $value }
      - id: mind
        do: { thought: $b, text: "{a} has gone, and you need someone at {at}. You have put a note on the board.", days: 10 }
      - id: hire
        after: notice
        wait: 12
        otherwise: wait
        # Not the one who just left it.
        do: { hire: $subject, except: [$a] }

  # A house nobody lives in: news, and it is on the list of free houses.
  - id: house_empty
    signal: house_empty
    topic: house
    steps:
      - id: news
        do:
          tell:
            kind: house_empty
            about: [$place]
            place: $place
            belang: 1
            title: "nobody lives at {place} now"
            precise: "Nobody lives at {place} any more. The door is shut and the hearth is cold."
            village: "{place} stands empty now."
            far: "A house stands empty somewhere."

  # Peace, and a place that is itself again: the news of the day where it
  # matters. Who fled goes home by the return step of their own flight, as
  # soon as they know and think their house stands.
  - id: peace
    signal: realm_stance
    event: peace
    topic: peace
    steps:
      - id: news
        do: { news: "There's peace, they say. The barges will run again.", area: $area }

  - id: place_restored
    signal: place_restored
    topic: place
    steps:
      - id: news
        do: { news: "{place} is itself again, and people are going back.", area: $area }

  # M8.2: what follows by custom when nobody's brain plans it. Where brain is
  # true, the brain of $a may make a plan of their own instead (with a model).

  # Come up in the world: the village notices, the neighbours are envious, and
  # from now on the chapel, not the inn (the rule of standing does that).
  - id: rose_in_standing
    signal: rose_in_standing
    topic: standing
    brain: true
    steps:
      - id: news
        at: { hour: 20 }
        do:
          tell:
            kind: standing
            about: [$a]
            place: { social_near: $a }
            belang: 2
            title: "{a} has come up in the world"
            precise: "{a} stood everyone a round at {place} to show he has money now, and said it would be the last time he drank with the likes of them."
            village: "{a} has grown too good for the rest of us, they say."
            far: "Somebody in the Holleveen has come into money."
      - id: mind
        do: { thought: $a, text: "You are somebody now, and people had better see it.", days: 14 }

  # Whatever they do about it, the neighbours are envious: always, by the rules.
  - id: envy
    signal: rose_in_standing
    topic: envy
    steps:
      - id: envy
        do: { regard: [{ neighbours_of: $a }], to: $a, affinity: -5 }

  # A quarrel: the next evening someone both trust tries to make peace. Who
  # mediates decides how it ends; without anyone, it becomes a feud in a week.
  - id: quarrel
    signal: quarrel
    topic: quarrel
    brain: true
    expires: 8
    steps:
      - id: mediate
        at: { days: 1, hour: 19 }
        do: { mediate: [$a, $b] }

  # A feud: enemies from now on, and the village knows it.
  - id: feud
    signal: feud
    topic: feud
    steps:
      - id: enemies
        do: { set_tie: [$a, $b], role: rival, bond: -2 }
      - id: news
        do:
          tell:
            kind: feud
            about: [$a, $b]
            place: { home_of: $a }
            belang: 2
            title: "{a} and {b} are not speaking"
            precise: "{a} and {b} have not made it up, and now they cross the street rather than pass each other."
            village: "{a} and {b} won't speak to each other any more."
            far: "There's a feud in the Holleveen."

  # Doubt with something at stake: first ask a trader, or go and look.
  - id: doubt
    signal: doubt
    about: first
    topic: doubt
    brain: true
    expires: 3
    steps:
      - id: ask
        at: { hours: 1 }
        otherwise: wait
        do: { ask_around: $a, about: [$subject, $key] }

  # A stranger who is not believed, by someone the gates let through.
  - id: stranger_unwelcome
    signal: stranger_unwelcome
    about: first
    topic: stranger
    steps:
      - id: chase
        do: { chase_away: [$a, $b] }

  # Known again after a long time: it comes back to them, and they go and speak to them.
  - id: recognised
    signal: recognised
    about: first
    topic: meeting
    brain: true
    expires: 2
    steps:
      - id: recall
        do: { recall: $a, of: $b }
      - id: talk
        do: { goal: Talk, who: $a, target: $b, hours: 12 }

  # Believed a warning about the dyke: carry word to the dyke reeve.
  - id: warned
    signal: warned
    about: first
    topic: warning
    brain: true
    expires: 3
    steps:
      - id: word
        do: { carry_word: $a, to: npc_sijbrand, about: $subject }

  # Heard that the stranger was asking after them (M10.3): the one it was about goes to find the stranger.
  - id: asked_about
    signal: asked_about
    about: first
    topic: asked_about
    expires: 2
    steps:
      - id: seek
        when: [{ same: [$a, $subject] }]
        do: { seek_player: $a, line: "You were asking after me. What do you want?", hours: 24 }

  # Someone needs something and thinks well of the stranger (M10.3): they go and find the stranger to ask.
  - id: request_open
    signal: request_open
    about: first
    topic: request
    expires: 1
    steps:
      - id: seek
        when: [{ attitude: $a, at_least: Friendly }]
        do: { seek_player: $a, line: "There you are. There's something I'd ask of you.", hours: 24 }

  # A friend of the stranger (M10.3): a tie, told as news, and a warmer greeting from now on.
  - id: befriended
    signal: befriended
    about: first
    topic: friendship
    expires: 1
    steps:
      - id: tie
        do: { set_tie: [$a, player], role: friend, bond: 2 }
      - id: mind
        do: { thought: $a, text: "The stranger is a friend of yours now.", days: 14 }

  # The stranger gave back or paid for what they took (M10.3): it makes up for some of it,
  # less when they were caught or found out first than when they came of their own accord.
  - id: theft_mended_own
    signal: theft_mended
    event: own_accord
    about: first
    topic: theft
    expires: 1
    steps:
      - id: regard
        do: { regard: [$a], to: player, affinity: 8 }
      - id: mind
        do: { thought: $a, text: "The stranger came back of their own accord and made it right. That counts for something.", days: 7 }

  - id: theft_mended_caught
    signal: theft_mended
    event: after_caught
    about: first
    topic: theft
    expires: 1
    steps:
      - id: regard
        do: { regard: [$a], to: player, affinity: 2 }
      - id: mind
        do: { thought: $a, text: "The stranger made it right, but only once they were caught.", days: 7 }

  # The stranger did not keep their word (M10.3): the one let down minds it, and the village hears of it.
  - id: broken_promise
    signal: broken_promise
    about: first
    topic: promise
    expires: 1
    steps:
      - id: word
        do:
          tell:
            kind: broken_promise
            about: [$a]
            place: $place
            belang: 2
            title: "the stranger's broken word to {a}"
            precise: "The stranger gave {a} their word to {value}, and never did."
            village: "Don't count on that stranger's word. Ask {a}."
            far: "A stranger who does not keep their word."
      - id: mind
        do: { thought: $a, text: "The stranger gave you their word, and it was worth nothing.", days: 7 }

  # The stranger kept their word (M10.3): a small thing, and people hear it.
  - id: promise_kept
    signal: promise_kept
    about: first
    topic: promise
    expires: 1
    steps:
      - id: word
        do:
          tell:
            kind: promise_kept
            about: [$a]
            place: $place
            belang: 1
            title: "the stranger keeping their word to {a}"
            precise: "The stranger gave {a} their word to {value}, and did."
            village: "That stranger keeps their word, {a} says."
            far: "A stranger who keeps their word."

  # Heard that a workshop works again (M10.3): whose trade takes in what it makes goes there, today.
  # Told the mill turns when it does not, the baker walks to Molenend for nothing, and sees it for herself.
  - id: heard_working
    signal: heard_working
    about: first
    topic: working
    expires: 1
    steps:
      - id: go
        when: [{ needs_from: [$a, $subject] }]
        do: { goal: Visit, who: $a, target: $subject, priority: 0.9, hours: 12 }

  # People from elsewhere stay on: by custom, only grumbling.
  - id: strangers_stay
    signal: strangers_stay
    topic: strangers
    brain: true
    steps:
      - id: mind
        do: { thought: $a, text: "Those people are still here, eating our bread.", days: 7 }

  # M8.3: the chronicler plans.

  # Too many newcomers and too little food: those who mind them most band together.
  - id: friction
    signal: friction
    topic: friction
    brain: true
    steps:
      - id: band
        do: { form_group: [$a, $b, $c], aim: against, about: $area, name: "those who want the newcomers gone" }
      # And the warm hearts of the place take their side: the Lantern's charity (M9.1).
      - id: help
        at: { days: 1 }
        do: { form_group: [{ welcoming: $area }], aim: for, about: $area, name: "the Lantern's charity" }

  # Two brains' plans cross, and nobody writes the story: they go on, and people talk.
  - id: plans_cross
    signal: plans_cross
    topic: crossing
    brain: true
    steps:
      - id: talk
        do:
          tell:
            kind: crossing
            about: [$a, $b]
            place: $place
            belang: 1
            title: "{a} and {b} are at cross purposes"
            precise: "{a} and {b} are each going their own way about it, and each against the other."
            village: "{a} and {b} are at it again, they say."
            far: "Two people are at odds."

  # A warning that came true: whoever did not believe it thinks better of the one who gave it, and may be ashamed.
  - id: warning_proven
    signal: warning_proven
    topic: warning
    about: first
    steps:
      - id: credit
        do: { regard: [$a], to: $b, affinity: 10 }
      - id: mind
        do: { thought: $a, text: "{b} tried to warn you, and {b} was right.", days: 14 }
      - id: shame
        when: [{ did: chased, who: $a, to: $b }]
        do: { thought: $a, text: "You ran {b} out of the village for telling the truth. You cannot look at the water without thinking of it.", days: 30 }
      - id: story
        when: [{ did: chased, who: $a, to: $b }]
        do:
          tell:
            kind: warning
            about: [$a, $b]
            place: $place
            belang: 3
            title: "the stranger who was right"
            precise: "{b} warned them about the dyke, and {a} ran {b} off. The dyke broke all the same."
            village: "They chased off the one who warned them, and then the dyke went."
            far: "Nobody listened to the one who warned them, they say."

  # M8.4: the economy. The same shortage goes differently in a trading town
  # and in a village: in the town the merchants put their prices up and, if it
  # lasts, send far afield (M8.5, below); the village makes do and grumbles,
  # and a stranger finds it harder there (openness, belief.ts).
  - id: shortage_sent_for
    signal: shortage
    topic: shortage
    brain: true
    when: [{ character: $area, is: trade }]
    steps:
      - id: word
        do: { news: "{value} are short in {area}. The merchants have put their prices up and talk of sending far afield.", area: $area }
      # The shortage as a fact (M9.2): cause and effect for the chronicler, from what shut it off.
      - id: fact
        do:
          tell:
            kind: shortage
            belang: 2
            claim: { subject: $area, key: short, value: $value }
            title: "{value} short in {area}"
            precise: "{value} are short in {area}, and the merchants have put their prices up."
            village: "No {value} to be had in {area} but at a price."
            far: "Goods are short in {area}."

  - id: shortage_made_do
    signal: shortage
    topic: shortage
    brain: true
    when: [{ not: { character: $area, is: trade } }]
    steps:
      - id: word
        do: { news: "There are no {value} to be had in {area}. People make do, and grumble about it.", area: $area }
      - id: fact
        do:
          tell:
            kind: shortage
            belang: 2
            claim: { subject: $area, key: short, value: $value }
            title: "no {value} in {area}"
            precise: "There are no {value} to be had in {area}; people make do."
            village: "No {value} in {area}, and everyone grumbling."
            far: "Goods are short in {area}."

  - id: surplus
    signal: surplus
    topic: surplus
    brain: true
    steps:
      - id: word
        do: { news: "{value} are piling up in {area}; you can have them for next to nothing.", area: $area }

  - id: price_doubled
    signal: price_doubled
    topic: price
    brain: true
    steps:
      - id: word
        do: { news: "{a} is asking twice the worth for {value}, and people say so.", area: $area }
      - id: grudge
        do: { regard: [{ neighbours_of: $a }], to: $a, affinity: -3 }

  - id: missing_trade
    signal: missing_trade
    topic: trade
    expires: 21
    steps:
      # Newcomers for the trade, if the content has them and a house stands free (M8.5): on a barge day.
      - id: newcomers
        at: { days: 2, hour: 15 }
        when: [{ any: [{ weekday: Maandag }, { weekday: Donderdag }] }]
        otherwise: wait
        do: { arrive: $value, to: $area }
      # Still nobody after three days: a note on the board.
      - id: notice
        at: { days: 3, hour: 9 }
        when: [{ idle: $value }]
        do:
          post: { board_near: $place }
          fact:
            kind: notice
            about: [$area]
            belang: 2
            title: "nobody to work {place}"
            precise: "A note on the board: {place} stands idle, and anyone who knows the work is wanted."
            village: "Nobody works {place} any more, they say. Somebody ought to."
            far: "A trade has nobody to work it."
            claim: { subject: $subject, key: trade, value: $value }

  - id: route_closed
    signal: route_closed
    topic: route
    steps:
      - id: word
        do: { news: "Nothing comes along {subject} any more. What it brought will be dear soon.", area: $area }

  # M8.5: a shortage that lasts. A trader decides to send far afield; a village
  # may draw newcomers who make the good, if the content has them.
  - id: shortage_lasting_trader
    signal: shortage
    event: lasting
    topic: shortage_lasting
    when: [{ character: $area, is: trade }]
    steps:
      - id: cart
        do: { order: $value, to: $area, qty: 20, days: 5, by: "a cart {a} sent far afield" }
      - id: word
        do:
          tell:
            kind: trader
            about: [$a]
            belang: 2
            title: "{a} sent a cart far afield for {value}"
            precise: "{a} has had enough of waiting and sent a cart far afield for {value}, whatever they cost."
            village: "{a} has sent off for {value} at last. It'll cost us, you'll see."
            far: "A trader sent far afield for goods."

  - id: shortage_lasting_newcomers
    signal: shortage
    event: lasting
    topic: shortage_lasting
    when: [{ not: { character: $area, is: trade } }]
    steps:
      - id: newcomers
        do: { arrive: $value, to: $area }

  # M8.5: a wall for Waagdam. First a brickworks, for there is no stone in the
  # Holleveen: clay from the Vaart, fired with peat. Then the wall.
  # M9.1: raids in the east drive people from the border villages to Waagdam:
  # a crowd in the church, nameless until the player speaks to one of them.
  - id: refugees_from_the_east
    signal: threat
    topic: refugees
    expires: 30
    steps:
      - id: come
        do: { crowd: refugees from the eastern border, one: refugee, count: 18, at: loc_waagdam_church, from: nethermarch, days: 21, profession: labourer }

  # M9.1: town rights. With the wall standing, the mayor goes to Graafhaven to
  # ask the Count to make Waagdam a city. The Count decides (the chance is his,
  # and the charter costs the town 200 duiten); the world notices either way.
  - id: town_rights
    signal: project_done
    topic: rank
    expires: 60
    when: [{ built: waagdam_wall }, { not: { character: waagdam, is: city } }]
    steps:
      - id: ask
        do: { leave: [npc_aleid], to: graafhaven, days: 6 }
      - id: word
        do: { news: "Mayor Aleid Vos has gone to Graafhaven to ask the Count for town rights, now the wall stands.", area: waagdam }
      - id: decide
        after: ask
        at: { days: 7 }
        chance: 0.75
        do: { rank: waagdam, kind: city, cost: 200, by: the Count }
      - id: charter
        after: decide
        when: [{ character: waagdam, is: city }]
        do: { set: waagdam_city }
      - id: refused
        after: decide
        when: [{ not: { character: waagdam, is: city } }]
        do:
          tell:
            kind: rank
            title: the Count said no to Waagdam
            precise: "The Count will not make Waagdam a city: not this year, he told Mayor Aleid Vos."
            village: "No town rights for Waagdam. The Count kept the mayor waiting three days and then said no."
            far: "Waagdam asked for town rights and did not get them."
            belang: 3
            about: [waagdam]

  - id: wall_for_waagdam
    signal: threat
    topic: wall
    expires: 150
    when: [{ character: $area, is: trade_town }]
    steps:
      - id: brickworks
        do: { build: waagdam_brickworks }
      - id: word
        do: { news: "Mayor Aleid Vos wants a wall round the town, and first a brickworks by the Vaart: there is no stone in the Holleveen.", area: $area }
      - id: wall
        after: brickworks
        when: [{ built: waagdam_brickworks }]
        otherwise: wait
        do: { build: waagdam_wall }
