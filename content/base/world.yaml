world:
  id: nethermarch
  name: The Nethermarch
  start:
    location: loc_veenhoek_quay
    year: 211
    month: 9      # Herfstmaand
    day: 14
    hour: 18
    minute: 30
  player:
    money: 112    # 14 stuivers
    inventory:
      knife: 1
      apple: 2
  # How pictures of places and people look (after the M7 playtest), when an image model is chosen.
  pictures:
    style: A small illustration in the manner of a 17th-century Dutch etching with a light ink wash, muted greys, browns and greens, fine lines, a low wet land under a wide grey sky.
  intro: |
    The barge from Graafhaven leaves you at the Veenhoek quay just as the
    light goes. The bargeman won't tie up. "Not after dark, not out here,"
    he says, and poles away into the mist, taking his lantern with him.

    This is the Holleveen: peat and reed and black water, mile upon mile
    of it between the Great Dyke and the heath. The villages sit on the
    few dry places like cats on a fence. Peat smoke. A windmill turning
    slowly against a sky the colour of pewter.

    Somewhere a dog barks. On the doorstep of the nearest house a grey cat
    watches you, very still, the way cats don't usually watch people.

    Type LOOK to look around. Type HELP if you are lost. You probably are.

  # Who knows what (FO, chapter 5). The chance table and distance bands use the
  # defaults from the FO; these modifiers are the professions and traits it names.
  knowledge:
    modifiers:
      # An innkeeper hears about everyone.
      - { profession: [innkeeper, barmaid], kinds: [person], factor: 1.3 }
      # Traders and travellers know places as if they were more famous.
      - { profession: [grain_merchant, pedlar, boatman, soldier], kinds: [place, area], fame: 1 }
      # A baker knows everyone who sells grain or flour.
      - { profession: [baker], kinds: [person], sells: [rye_grain, flour], min_level: 2 }
      # A sister of the Lantern knows the saints and their stories well.
      - { profession: [sister], topics: [saint_brand], level: 1, factor: 1.2 }
      # Old people know old stories.
      - { min_age: 60, kinds: [lore], factor: 1.2 }
      # Gossips hear more about people.
      - { quirk: [gossip], kinds: [person, fact], factor: 1.2 }
