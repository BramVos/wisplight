world:
  id: nethermarch
  name: The Nethermarch
  start:
    location: loc_veenhoek_quay
    year: 211
    month: 9      # Herfstmaand
    day: 14
    hour: 18
    minute: 30
  player:
    money: 112    # 14 stuivers
    inventory:
      knife: 1
      apple: 2
  # The fixed block every model call gets about this world (FO, chapter 10).
  frame: |
    WORLD: The Nethermarch, a low, wet land by the Grey Sea. Year 211 After the Wolf
    (the great flood). Dykes, polders, peat fens, windmills, barges. Money: guilders, stuivers
    and duiten (1 gl = 20 st, 1 st = 8 d). Faith: the Church of the Lantern (Saint Brand) in the
    towns; the Old Powers (Nehalennia, the Grey Rider, Mother Holle, Baduhenna) in old customs.
    Folk believe in kabouters, the White Women, the Haakman, will-o'-the-wisps and witches.
    Some of it is true.
    REGION: the Holleveen. The Count wants to drain it. The peat-cutters and the fen folk are
    against it. Tempers are short, and a girl is missing.
    PEOPLE speak plain, practical English with a little local colour. They measure distance in
    hours' walk and time by bells and daylight.
  # Who keeps the law (M8): the Count's schout, and Waagdam with town rights of its own (M8.2).
  law: { where: "in the Count's land", officer: schout, npc: npc_everhard, office: loc_schout_house, lord: the Count }
  towns:
    - { id: waagdam, area: waagdam, where: in Waagdam, officer: town watch, offices: [loc_waagdam_waag, loc_waagdam_weighing_room], trade_ban: true, cleared: The clerk writes you out of the book. }
  # Names for people who come during a game (M8.5): Low Saxon, as from Zwolderkamp and the east.
  names:
    she: [Hilde, Marij, Geertje, Femke, Tjitske, Hendrikje, Janna, Wobbina, Roelie, Aukje]
    he: [Roelof, Tjark, Berend, Wessel, Gijs, Hessel, Lammert, Egbert, Arend, Albert]
    family: [Scholten, Veldkamp, Wessels, Brink, Hofstede, Lamberts, Postma, Roelofs, Dekker, Bosch]
  newcomers_per_season: 6
  # Faiths (Wereldboek, chapter 5; M9.1): most are Lantern on Rustdag and the Old Powers when it comes to it.
  faiths:
    - { id: lantern, name: the Church of the Lantern, patrons: [lantern] }
    - { id: old_powers, name: the Old Powers, patrons: [nehalennia, grey_rider, holle, baduhenna] }
  # Plans that run from the first day (M8.3): the opponents in the Holleveen do not wait for the player.
  plans: [holleveen_survey, holleveen_stakes, the_haakman_counts]
  # How pictures of places and people look (after the M7 playtest), when an image model is chosen.
  pictures:
    style: A small illustration in the manner of a 17th-century Dutch etching with a light ink wash, muted greys, browns and greens, fine lines, a low wet land under a wide grey sky.
  intro: |
    The barge from Graafhaven leaves you at the Veenhoek quay just as the
    light goes. The bargeman won't tie up. "Not after dark, not out here,"
    he says, and poles away into the mist, taking his lantern with him.

    This is the Holleveen: peat and reed and black water, mile upon mile
    of it between the Great Dyke and the heath. The villages sit on the
    few dry places like cats on a fence. Peat smoke. A windmill turning
    slowly against a sky the colour of pewter.

    Somewhere a dog barks. On the doorstep of the nearest house a grey cat
    watches you, very still, the way cats don't usually watch people.

    Type LOOK to look around. Type HELP if you are lost. You probably are.

  # Who knows what (FO, chapter 5). The chance table and distance bands use the
  # defaults from the FO; these modifiers are the professions and traits it names.
  knowledge:
    modifiers:
      # An innkeeper hears about everyone.
      - { profession: [innkeeper, barmaid], kinds: [person], factor: 1.3 }
      # Traders and travellers know places as if they were more famous.
      - { profession: [grain_merchant, pedlar, boatman, soldier], kinds: [place, area], fame: 1 }
      # A baker knows everyone who sells grain or flour.
      - { profession: [baker], kinds: [person], sells: [rye_grain, flour], min_level: 2 }
      # A sister of the Lantern knows the saints and their stories well.
      - { profession: [sister], topics: [saint_brand], level: 1, factor: 1.2 }
      # Old people know old stories.
      - { min_age: 60, kinds: [lore], factor: 1.2 }
      # Gossips hear more about people.
      - { quirk: [gossip], kinds: [person, fact], factor: 1.2 }
