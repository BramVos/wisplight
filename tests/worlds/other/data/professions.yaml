# Schedules in Deepwell, in shifts. The first block that matches the time wins.

professions:
  - id: warden
    name: warden
    schedule:
      - { from: "07:00", to: "07:30", activity: eat }
      - { from: "12:30", to: "13:00", activity: eat }
      - { from: "07:30", to: "19:00", activity: work }
      - { from: "19:00", to: "21:30", activity: socialize }
      - { from: "21:30", to: "07:00", activity: sleep }

  - id: fabricator
    name: fabricator
    teaches: crafting
    schedule:
      - { from: "07:30", to: "08:00", activity: eat }
      - { from: "13:00", to: "13:30", activity: eat }
      - { from: "08:00", to: "20:00", activity: work }
      - { from: "20:00", to: "22:30", activity: socialize }
      - { from: "22:30", to: "07:30", activity: sleep }

  - id: ice_cutter
    name: ice cutter
    schedule:
      - { from: "05:30", to: "06:00", activity: eat }
      - { from: "06:00", to: "16:00", activity: work }
      - { from: "16:00", to: "17:00", activity: free }
      - { from: "17:00", to: "18:00", activity: eat }
      - { from: "18:00", to: "21:00", activity: socialize }
      - { from: "21:00", to: "05:30", activity: sleep }

  - id: cook
    name: cook
    schedule:
      - { from: "05:30", to: "22:00", activity: work }
      - { from: "22:00", to: "05:30", activity: sleep }
